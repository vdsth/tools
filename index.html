  for (let t = 0; t <= o.T + 1e-9; t += tStap) {
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(X(t) + .5, m.t); ctx.lineTo(X(t) + .5, m.t + ph); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(fmt(t), X(t), m.t + ph + 7);
  }
  const y0 = Math.ceil(o.yMin / o.yStep - 1e-9);
  for (let i = y0; i * o.yStep <= o.yMax + 1e-9; i++) {
    const y = i * o.yStep;
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(m.l, Y(y) + .5); ctx.lineTo(m.l + pw, Y(y) + .5); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(fmt(y), m.l - 7, Y(y));
  }
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1.5;
  if (o.yMin <= 0 && o.yMax >= 0) { ctx.beginPath(); ctx.moveTo(m.l, Y(0)); ctx.lineTo(m.l + pw + 12, Y(0)); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(X(0), m.t + ph); ctx.lineTo(X(0), m.t - 10); ctx.stroke();
  ctx.fillStyle = css('--fg'); ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left'; ctx.fillText(o.yNaam, m.l + 6, m.t - 10);
  const ty = (o.yMin <= 0 && o.yMax >= 0) ? Y(0) : m.t + ph;
  ctx.textAlign = 'right'; ctx.fillText('t (s)', w - 4, ty - 6);
  return { X, Y, m, pw, ph };
}

/* ============================================================
   APPLET: Eenparig rechtlijnige beweging (4EMT)
   ============================================================ */
function renderERB(root) {
  const T = 10;
  const SMAX = 100, VMAX = 20;
  const SITUATIES = [
    { id: 'treinen', naam: 'Twee treinen kruisen elkaar', A: { s0: 0, v: 12 }, B: { s0: 100, v: -10 }, aanB: true,
      uitleg: '<b>A</b> is een trein die naar rechts rijdt, <b>B</b> een trein die op het spoor ernaast naar links rijdt. Waar en wanneer kruisen ze elkaar?' },
    { id: 'inhalen', naam: 'Een auto wordt ingehaald', A: { s0: 20, v: 10 }, B: { s0: 0, v: 20 }, aanB: true,
      uitleg: 'Auto <b>A</b> rijdt 10 m/s (36 km/h) en heeft 20 m voorsprong. Auto <b>B</b> rijdt 20 m/s (72 km/h). Wanneer en waar haalt B auto A in?' },
    { id: 'achteruit', naam: 'Een auto rijdt achteruit', A: { s0: 15, v: -2.5 }, B: { s0: 0, v: 0 }, aanB: false,
      uitleg: 'Auto <b>A</b> rijdt achteruit een parkeerplaats uit. De snelheid is negatief, dus de positie neemt af en de oppervlakte ligt onder de t-as.' },
    { id: 'fietser', naam: 'Fietser passeert een geparkeerde auto', A: { s0: 30, v: 0 }, B: { s0: 0, v: 6 }, aanB: true,
      uitleg: 'Auto <b>A</b> staat geparkeerd (v = 0), fietser <b>B</b> rijdt 6 m/s. Hoe ziet stilstand eruit in de (s,t)- en de (v,t)-grafiek?' },
    { id: 'evensnel', naam: 'Twee auto’s rijden even snel', A: { s0: 0, v: 15 }, B: { s0: 15, v: 15 }, aanB: true,
      uitleg: 'Beide auto’s rijden 15 m/s, maar <b>B</b> start 15 m vóór <b>A</b>. Haalt A auto B ooit in? Let op de richting van de twee rechten.' }
  ];
  const STANDAARD_UITLEG = 'Kies een voorbeeldsituatie of stel de bewegingen zelf in. Druk daarna op <b>Afspelen</b>.';

  const st = { A: { s0: 0, v: 0 }, B: { s0: 0, v: 0 }, aanB: false, t: 0, arceer: true, stip: true, sit: null };

  const ctrl = (id, label, min, max, step, eenh) => `
      <div class="ctrl">
        <label for="erb-${id}">${label}</label>
        <div class="rij">
          <input type="range" id="erb-${id}" min="${min}" max="${max}" step="${step}">
          <input type="number" id="erb-${id}n" min="${min}" max="${max}" step="${step}" aria-label="${label.replace(/<[^>]+>/g, '')} in ${eenh}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`;

  root.innerHTML = `
  <div class="erb">
    <div class="lay2">
     <div class="hoofd2">
    <div class="paneel graf">
      <div class="kop"><h2>Beweging op de baan</h2><span class="legende">positie op tijdstip t</span></div>
      <div class="doek spoor"><canvas id="erb-spoor" role="img" aria-label="Baan met de positie van de voorwerpen"></canvas></div>
    </div>
    <div class="grafieken stapel erbg">
      <div class="paneel graf">
        <div class="kop"><h2>(s,t)-grafiek</h2><span class="legende"><span><i class="ln"></i>A</span><span class="lb"><i class="ln b"></i>B</span></span></div>
        <div class="doek"><canvas id="erb-cs" role="img" aria-label="Positie in functie van de tijd"></canvas></div>
      </div>
      <div class="paneel graf">
        <div class="kop"><h2>(v,t)-grafiek</h2><span class="legende"><span><i class="ln"></i>A</span><span class="lb"><i class="ln b"></i>B</span></span></div>
        <div class="doek"><canvas id="erb-cv" role="img" aria-label="Snelheid in functie van de tijd"></canvas></div>
      </div>
    </div>

    <div class="uitlezing">
      <div class="uit ra"><div class="titel"><span class="stip a"></span><h2>Beweging A</h2></div>
        <span class="val" id="erb-ra"></span><span class="note" id="erb-na"></span></div>
      <div class="uit rb" id="erb-kb"><div class="titel"><span class="stip b"></span><h2>Beweging B</h2></div>
        <span class="val" id="erb-rb"></span><span class="note" id="erb-nb"></span></div>
      <div class="uit rm" id="erb-km"><div class="titel"><h2 class="c-m">Ontmoeting</h2></div>
        <span class="val" id="erb-rm"></span><span class="note" id="erb-nm"></span></div>
    </div>
     </div>
     <aside class="zij2" aria-label="Instellingen">
    <div class="paneel bediening">
      <div class="groep ga">
        <div class="gkop"><span class="stip a"></span>Beweging A</div>
        ${ctrl('as0', 'Beginpositie s<sub>0</sub>', -SMAX, SMAX, 1, 'm')}
        ${ctrl('av', 'Snelheid v', -VMAX, VMAX, 0.5, 'm/s')}
      </div>
      <div class="groep gb" id="erb-gb">
        <div class="gkop"><label class="vink"><input type="checkbox" id="erb-aanb"><span class="stip b"></span>Beweging B tonen</label></div>
        ${ctrl('bs0', 'Beginpositie s<sub>0</sub>', -SMAX, SMAX, 1, 'm')}
        ${ctrl('bv', 'Snelheid v', -VMAX, VMAX, 0.5, 'm/s')}
      </div>
      <div class="groep gt">
        <div class="gkop">Tijd</div>
        ${ctrl('t', 'Tijdstip t', 0, T, 0.1, 's')}
        <div class="knoppen">
          <button class="knop" id="erb-play" type="button">▶ Afspelen</button>
          <label class="vink"><input type="checkbox" id="erb-arceer"><span class="sw"></span>Arceer oppervlakte</label>
          <label class="vink"><input type="checkbox" id="erb-stip"><span class="stipjes"></span>Positie op elke seconde</label>
        </div>
      </div>
    </div>

     </aside>
    </div>
    <div class="paneel situaties">
      <span class="lbl-klein">Voorbeeldsituaties</span>
      <div class="chips" id="erb-chips">${SITUATIES.map(s => `<button type="button" class="sit" data-id="${s.id}" aria-pressed="false">${s.naam}</button>`).join('')}</div>
      <p class="uitleg" id="erb-uitleg"></p>
    </div>

  </div>`;

  const $ = id => root.querySelector('#erb-' + id);
  const cvS = $('cs'), cvV = $('cv'), cvB = $('spoor');

  function wisSituatie() {
    if (!st.sit) return;
    st.sit = null; tekenSituaties();
  }
  function koppel(id, obj, key, min, max) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(val);
      if (!isFinite(x)) return;
      x = Math.min(max, Math.max(min, x));
      obj[key] = x;
      if (bron !== r) r.value = x;
      if (bron !== n) n.value = x;
      if (bron && id !== 't') wisSituatie();
      teken();
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = obj[key]; });
    r.value = n.value = obj[key];
    return v => zet(v, null);
  }
  const zetAs0 = koppel('as0', st.A, 's0', -SMAX, SMAX);
  const zetAv = koppel('av', st.A, 'v', -VMAX, VMAX);
  const zetBs0 = koppel('bs0', st.B, 's0', -SMAX, SMAX);
  const zetBv = koppel('bv', st.B, 'v', -VMAX, VMAX);
  const zetT = koppel('t', st, 't', 0, T);

  const vinkB = $('aanb'), vinkA = $('arceer');
  function zetAanB(aan) {
    st.aanB = aan; vinkB.checked = aan;
    $('gb').classList.toggle('uit-b', !aan);
    ['bs0', 'bs0n', 'bv', 'bvn'].forEach(id => { $(id).disabled = !aan; });
    root.querySelectorAll('.lb').forEach(el => { el.hidden = !aan; });
    $('kb').hidden = !aan; $('km').hidden = !aan;
  }
  vinkB.addEventListener('change', () => { zetAanB(vinkB.checked); wisSituatie(); teken(); });
  vinkA.checked = st.arceer;
  vinkA.addEventListener('change', () => { st.arceer = vinkA.checked; teken(); });
  const vinkS = $('stip'); vinkS.checked = st.stip;
  vinkS.addEventListener('change', () => { st.stip = vinkS.checked; teken(); });

  function tekenSituaties() {
    root.querySelectorAll('button.sit').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.sit)));
    const s = SITUATIES.find(x => x.id === st.sit);
    $('uitleg').innerHTML = s ? s.uitleg + ' Druk op <b>Afspelen</b>.' : STANDAARD_UITLEG;
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('button.sit'); if (!b) return;
    const s = SITUATIES.find(x => x.id === b.dataset.id);
    stop();
    zetAanB(s.aanB);
    zetAs0(s.A.s0); zetAv(s.A.v); zetBs0(s.B.s0); zetBv(s.B.v);
    zetT(0);
    st.sit = s.id; tekenSituaties(); teken();
  });

  // Afspelen
  let raf = null, vorige = null;
  const knop = $('play');
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; vorige = null; knop.textContent = '▶ Afspelen'; }
  function stap(ts) {
    if (vorige == null) vorige = ts;
    const nt = st.t + (ts - vorige) / 1000; vorige = ts;
    if (nt >= T) { zetT(T); stop(); return; }
    zetT(Math.round(nt * 100) / 100);
    raf = requestAnimationFrame(stap);
  }
  knop.addEventListener('click', () => {
    if (raf) { stop(); return; }
    if (st.t >= T - 1e-9) zetT(0);
    knop.textContent = '❚❚ Pauze';
    raf = requestAnimationFrame(stap);
  });

  function ontmoeting() {
    const dv = st.A.v - st.B.v, d0 = st.B.s0 - st.A.s0;
    if (Math.abs(dv) < 1e-12) return Math.abs(d0) < 1e-12 ? { soort: 'samen' } : { soort: 'evenwijdig', afstand: Math.abs(d0) };
    const t = d0 / dv;
    return { soort: (t >= -1e-9 && t <= T + 1e-9) ? 'binnen' : 'buiten', t, s: st.A.s0 + st.A.v * t };
  }

  function teken() {
    const K = { a: css('--a'), b: css('--b'), meet: css('--meet'), fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel') };
    const M = [{ k: 'A', p: st.A, col: K.a, dash: [], dir: 1 }];
    if (st.aanB) M.push({ k: 'B', p: st.B, col: K.b, dash: [], dir: -1 });
    const twee = M.length === 2;
    M.forEach(m => { m.sT = m.p.s0 + m.p.v * st.t; m.ds = m.p.v * st.t; });
    const ont = twee ? ontmoeting() : null;

    const sv = [0]; M.forEach(m => sv.push(m.p.s0, m.p.s0 + m.p.v * T));
    const sR = blokRange(Math.min(...sv), Math.max(...sv));
    const vv = [0]; M.forEach(m => vv.push(m.p.v));
    const vR = blokRange(Math.min(...vv), Math.max(...vv));

    /* (s,t) */
    {
      const { ctx, w, h } = prepCanvas(cvS);
      const A = assen(ctx, w, h, { T, yMin: sR.min, yMax: sR.max, yStep: sR.step, yNaam: 's (m)' });
      // hulplijnen naar het punt op tijdstip t
      ctx.lineWidth = 1; ctx.strokeStyle = K.muted; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(A.X(st.t), A.m.t); ctx.lineTo(A.X(st.t), A.m.t + A.ph); ctx.stroke();
      M.forEach(m => {
        ctx.strokeStyle = K.muted;
        ctx.beginPath(); ctx.moveTo(A.X(st.t), A.Y(m.sT)); ctx.lineTo(A.X(0), A.Y(m.sT)); ctx.stroke();
        if (st.arceer) {
          ctx.strokeStyle = m.col;
          ctx.beginPath(); ctx.moveTo(A.X(0), A.Y(m.p.s0)); ctx.lineTo(A.X(st.t), A.Y(m.p.s0)); ctx.stroke();
        }
      });
      // rechten
      M.forEach(m => {
        ctx.setLineDash(m.dash); ctx.strokeStyle = m.col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(A.X(0), A.Y(m.p.s0)); ctx.lineTo(A.X(T), A.Y(m.p.s0 + m.p.v * T)); ctx.stroke();
      });
      ctx.setLineDash([]);
      // ontmoetingspunt
      if (ont && ont.soort === 'binnen') {
        const x = A.X(ont.t), y = A.Y(ont.s);
        ctx.fillStyle = K.meet; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill();
      }
      // Δs-pijlen
      if (st.arceer) M.forEach((m, i) => {
        if (Math.abs(m.ds) < 1e-9) return;
        const x = A.X(st.t) + 8 + i * 13;
        pijl(ctx, x, A.Y(m.p.s0), x, A.Y(m.sT), m.col, 2);
      });
      // punten
      M.forEach(m => {
        ctx.fillStyle = m.col;
        ctx.beginPath(); ctx.arc(A.X(0), A.Y(m.p.s0), 4, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(A.X(st.t), A.Y(m.sT), 5.5, 0, 7); ctx.fill();
        ctx.strokeStyle = K.bg; ctx.lineWidth = 2; ctx.stroke();
      });
    }

    /* (v,t) */
    {
      const { ctx, w, h } = prepCanvas(cvV);
      const A = assen(ctx, w, h, { T, yMin: vR.min, yMax: vR.max, yStep: vR.step, yNaam: 'v (m/s)' });
      const labels = [];
      if (st.arceer && st.t > 0) M.forEach(m => {
        if (m.p.v === 0) return;
        arceer(ctx, A.X(0), A.X(st.t), A.Y(0), A.Y(m.p.v), m.col, m.dir);
        labels.push({ m, y: (A.Y(0) + A.Y(m.p.v)) / 2, hoog: Math.abs(A.Y(m.p.v) - A.Y(0)) });
      });
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = K.muted;
      ctx.beginPath(); ctx.moveTo(A.X(st.t), A.m.t); ctx.lineTo(A.X(st.t), A.m.t + A.ph); ctx.stroke();
      M.forEach(m => {
        ctx.setLineDash(m.dash); ctx.strokeStyle = m.col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(A.X(0), A.Y(m.p.v)); ctx.lineTo(A.X(T), A.Y(m.p.v)); ctx.stroke();
      });
      ctx.setLineDash([]);
      M.forEach(m => {
        ctx.fillStyle = m.col;
        ctx.beginPath(); ctx.arc(A.X(st.t), A.Y(m.p.v), 5.5, 0, 7); ctx.fill();
        ctx.strokeStyle = K.bg; ctx.lineWidth = 2; ctx.stroke();
      });
      // labels in de gearceerde vlakken
      const br = A.X(st.t) - A.X(0);
      if (labels.length === 2 && Math.abs(labels[0].y - labels[1].y) < 24) labels[1].y = labels[0].y + 24;
      labels.forEach(L => {
        if (br < 50 || L.hoog < 20) return;
        const cx = (A.X(0) + A.X(st.t)) / 2;
        ctx.font = '600 13px ' + css('--f-mono');
        const volledig = 'Δs' + (twee ? 'A' : '') + ' = ' + fmt(L.m.ds) + ' m';
        if (ctx.measureText(volledig).width + 14 < br) indexLabel(ctx, cx, L.y, 'Δs', twee ? L.m.k : '', ' = ' + fmt(L.m.ds) + ' m', L.m.col, K.bg);
        else indexLabel(ctx, cx, L.y, 'Δs', twee ? L.m.k : '', '', L.m.col, K.bg);
      });
    }

    /* Baan */
    {
      const { ctx, w, h } = prepCanvas(cvB);
      const ml = 30, mr = 24, pw = w - ml - mr;
      const X = s => ml + (s - sR.min) / (sR.max - sR.min) * pw;
      const banen = twee ? [58, 118] : [68];
      const yAs = banen[banen.length - 1] + 30;
      ctx.font = '11px ' + css('--f-mono');
      const stapB = (pw / ((sR.max - sR.min) / sR.step) < 34) ? sR.step * 2 : sR.step;
      for (let s = Math.ceil(sR.min / stapB) * stapB; s <= sR.max + 1e-9; s += stapB) {
        ctx.strokeStyle = s === 0 ? K.axis : K.grid; ctx.lineWidth = 1; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(X(s) + .5, banen[0] - 26); ctx.lineTo(X(s) + .5, yAs); ctx.stroke();
        if (X(s) > w - 52) continue;
        ctx.fillStyle = s === 0 ? K.fg : K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(fmt(s), X(s), yAs + 4);
      }
      ctx.fillStyle = K.fg; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('s (m)', w - 2, yAs + 4);
      M.forEach((m, i) => {
        const y = banen[i];
        ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(ml - 10, y); ctx.lineTo(ml + pw + 10, y); ctx.stroke();
        ctx.fillStyle = m.col; ctx.font = '600 12px ' + css('--f-mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(m.k, 4, y);
        // startpositie
        ctx.strokeStyle = m.col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(X(m.p.s0), y, 5, 0, 7); ctx.stroke();
        // Δs
        if (st.arceer && Math.abs(m.ds) > 1e-9) pijl(ctx, X(m.p.s0), y - 30, X(m.sT), y - 30, m.col, 2);
        // snelheidspijl vóór het voorwerp
        if (m.p.v !== 0) {
          const sg = Math.sign(m.p.v), len = Math.max(10, Math.min(40, Math.abs(m.p.v) * 2.2));
          pijl(ctx, X(m.sT) + sg * 22, y, X(m.sT) + sg * (22 + len), y, m.col, 2);
          // label: snelheidsvector v⃗ (met index bij twee bewegingen)
          const cx = X(m.sT) + sg * (22 + len / 2), ly = y + 15;
          ctx.font = 'italic 600 13px ' + css('--f-mono');
          const wv = ctx.measureText('v').width;
          ctx.font = '600 10px ' + css('--f-mono');
          const wi = twee ? ctx.measureText(m.k).width + 1 : 0;
          const x0 = cx - (wv + wi) / 2;
          ctx.fillStyle = m.col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.font = 'italic 600 13px ' + css('--f-mono'); ctx.fillText('v', x0, ly);
          if (twee) { ctx.font = '600 10px ' + css('--f-mono'); ctx.fillText(m.k, x0 + wv + 1, ly + 4); }
          ctx.strokeStyle = m.col; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x0, ly - 9); ctx.lineTo(x0 + wv + 1, ly - 9); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x0 + wv - 2, ly - 11.5); ctx.lineTo(x0 + wv + 1, ly - 9); ctx.lineTo(x0 + wv - 2, ly - 6.5); ctx.stroke();
        }
        // positie op elke seconde
        if (st.stip) { ctx.fillStyle = m.col; for (let k = 0; k <= st.t + 1e-9; k++) { ctx.beginPath(); ctx.arc(X(m.p.s0 + m.p.v * k), y, 3.2, 0, 7); ctx.fill(); } }
        // voorwerp: autootje in de rijrichting
        m.richt = m.p.v < 0 ? -1 : 1;
        auto(ctx, X(m.sT), y, m.col, m.richt, K.bg);
      });
    }

    /* Teksten */
    const ind = k => twee ? `<sub>${k}</sub>` : '';
    M.forEach(m => {
      const c = m.k === 'A' ? 'c-a' : 'c-b';
      const k = m.k.toLowerCase();
      $('r' + k).innerHTML =
        `<span class="${c}">s${ind(m.k)}(t)</span> = ${fmt(m.p.s0)} + ${pn(m.p.v)}·t<br>` +
        `<span class="${c}">s${ind(m.k)}(${fmt(st.t)} s)</span> = <b class="${c}">${fmt(m.sT)} m</b><br>` +
        `<span class="${c}">Δs${ind(m.k)}</span> = v·Δt = ${par(m.p.v, 'm/s')} · ${fmt(st.t)} s = <b class="${c}">${fmt(m.ds)} m</b>`;
      $('n' + k).textContent = !st.arceer
        ? 'Vink “Arceer oppervlakte” aan om de verplaatsing als oppervlakte te zien.'
        : m.p.v < 0 ? 'De oppervlakte ligt onder de t-as: de verplaatsing is negatief, het voorwerp beweegt in de negatieve zin.'
        : m.p.v > 0 ? 'Gearceerde oppervlakte onder de (v,t)-grafiek = verplaatsing.'
        : 'v = 0: er is geen oppervlakte, het voorwerp staat stil.';
    });
    if (twee) {
      const afst = Math.abs(M[1].sT - M[0].sT);
      if (ont.soort === 'binnen') {
        $('rm').innerHTML = `s<sub>A</sub> = s<sub>B</sub> op <b class="c-m">t = ${fmt(ont.t)} s</b><br>bij <b class="c-m">s = ${fmt(ont.s)} m</b>`;
        $('nm').textContent = `Dat is het snijpunt van de twee rechten in de (s,t)-grafiek. Afstand tussen A en B op t = ${fmt(st.t)} s: ${fmt(afst)} m.`;
      } else if (ont.soort === 'buiten') {
        $('rm').innerHTML = `Geen ontmoeting tussen 0 en ${T} s`;
        $('nm').textContent = (ont.t < 0
          ? `De rechten snijden elkaar bij t = ${fmt(ont.t)} s, dus vóór de start.`
          : `Ze ontmoeten elkaar pas op t = ${fmt(ont.t)} s, buiten de grafiek.`) + ` Afstand op t = ${fmt(st.t)} s: ${fmt(afst)} m.`;
      } else if (ont.soort === 'evenwijdig') {
        $('rm').innerHTML = `Nooit: v<sub>A</sub> = v<sub>B</sub>`;
        $('nm').textContent = `Even snel, dus de afstand blijft altijd ${fmt(ont.afstand)} m. De rechten in de (s,t)-grafiek zijn evenwijdig.`;
      } else {
        $('rm').innerHTML = `A en B vallen samen`;
        $('nm').textContent = 'Zelfde beginpositie en zelfde snelheid: de grafieken liggen op elkaar.';
      }
    }
  }

  zetAanB(st.aanB);
  tekenSituaties();
  const ro = new ResizeObserver(() => teken());
  [cvS, cvV, cvB].forEach(c => ro.observe(c));
  teken();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(teken);

  return () => { stop(); ro.disconnect(); };
}

/* Gearceerd gebied met een willekeurige omtrek (punten in pixels) */
function arceerPad(ctx, pts, kleur, richting) {
  if (pts.length < 3) return;
  const pad = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const br = x1 - x0, hoog = y1 - y0;
  if (br < 0.5 || hoog < 0.5) return;
  ctx.save();
  pad(); ctx.clip();
  ctx.fillStyle = kleur; ctx.globalAlpha = 0.12; ctx.fillRect(x0, y0, br, hoog);
  ctx.globalAlpha = 0.7; ctx.strokeStyle = kleur; ctx.lineWidth = 1.2; ctx.setLineDash([]);
  for (let k = -hoog; k < br + hoog; k += 8) {
    ctx.beginPath();
    if (richting > 0) { ctx.moveTo(x0 + k, y1); ctx.lineTo(x0 + k + hoog, y0); }
    else { ctx.moveTo(x0 + k, y0); ctx.lineTo(x0 + k + hoog, y1); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = kleur; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  pad(); ctx.stroke();
}
/* Vectorsymbool (v⃗, a⃗) met optionele index, gecentreerd rond (cx, cy) */
function vecLabel(ctx, cx, cy, letter, index, kleur) {
  ctx.font = 'italic 600 13px ' + css('--f-mono');
  const wv = ctx.measureText(letter).width;
  ctx.font = '600 10px ' + css('--f-mono');
  const wi = index ? ctx.measureText(index).width + 1 : 0;
  const x0 = cx - (wv + wi) / 2;
  ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'italic 600 13px ' + css('--f-mono'); ctx.fillText(letter, x0, cy);
  if (index) { ctx.font = '600 10px ' + css('--f-mono'); ctx.fillText(index, x0 + wv + 1, cy + 4); }
  ctx.strokeStyle = kleur; ctx.lineWidth = 1.2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x0, cy - 9); ctx.lineTo(x0 + wv + 1, cy - 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0 + wv - 2, cy - 11.5); ctx.lineTo(x0 + wv + 1, cy - 9); ctx.lineTo(x0 + wv - 2, cy - 6.5); ctx.stroke();
}

/* ============================================================
   APPLET: Eenparig veranderlijke beweging (4EMT)
   ============================================================ */
function renderEVB(root) {
  const T = 10, SMAX = 100, VMAX = 30, AMAX = 10;
  const NUL = { s0: 0, v0: 0, a: 0, t1: 0 };
  const SITUATIES = [
    { id: 'vertrek', naam: 'Een auto vertrekt vanuit stilstand', A: { s0: 0, v0: 0, a: 3, t1: 0 }, B: NUL, aanB: false,
      uitleg: 'Auto <b>A</b> vertrekt vanuit stilstand aan een verkeerslicht en versnelt met 3 m/s². Welke vorm heeft elk van de drie grafieken?' },
    { id: 'remt', naam: 'Een auto remt', A: { s0: 0, v0: 20, a: -2, t1: 0 }, B: NUL, aanB: false,
      uitleg: 'Auto <b>A</b> rijdt 20 m/s (72 km/h) en remt met een vertraging van 2 m/s². Na hoeveel seconden staat hij stil en hoe lang is de remweg?' },
    { id: 'inhalen', naam: 'Een versnellende auto haalt een andere auto in', A: { s0: 15, v0: 10, a: 0, t1: 0 }, B: { s0: 0, v0: 0, a: 3, t1: 0 }, aanB: true,
      uitleg: 'Auto <b>A</b> rijdt constant 10 m/s en is 15 m vóór auto <b>B</b> op het moment dat B vanuit stilstand vertrekt met 3 m/s². Wanneer en waar haalt B auto A in?' },
    { id: 'helling', naam: 'Een bal rolt een helling op en terug', A: { s0: 0, v0: 8, a: -2, t1: 0 }, B: NUL, aanB: false,
      uitleg: 'Bal <b>A</b> rolt met 8 m/s een helling op en vertraagt met 2 m/s². Wanneer keert de bal om? Hoe groot is de verplaatsing na 8 s?' }
  ];
  const STANDAARD_UITLEG = 'Kies een voorbeeldsituatie of stel de bewegingen zelf in. Druk daarna op <b>Afspelen</b>.';

  const st = { A: { ...NUL }, B: { ...NUL }, aanB: false, t: 0, arceer: true, stip: true, raak: false, sit: null };

  const sF = (p, t) => t <= p.t1 ? p.s0 + p.v0 * t : p.s0 + p.v0 * t + 0.5 * p.a * (t - p.t1) ** 2;
  const vF = (p, t) => t <= p.t1 ? p.v0 : p.v0 + p.a * (t - p.t1);
  const aF = (p, t) => (t < p.t1 || (p.t1 > 0 && t === 0)) ? 0 : p.a;

  const ctrl = (id, label, min, max, step, eenh) => `
      <div class="ctrl">
        <label for="evb-${id}">${label}</label>
        <div class="rij">
          <input type="range" id="evb-${id}" min="${min}" max="${max}" step="${step}">
          <input type="number" id="evb-${id}n" min="${min}" max="${max}" step="${step}" aria-label="${label.replace(/<[^>]+>/g, '')} in ${eenh}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`;
  const groepCtrls = k => `
        ${ctrl(k + 's0', 'Beginpositie s<sub>0</sub>', -SMAX, SMAX, 1, 'm')}
        ${ctrl(k + 'v0', 'Beginsnelheid v<sub>0</sub>', -VMAX, VMAX, 0.5, 'm/s')}
        ${ctrl(k + 'a', 'Versnelling a', -AMAX, AMAX, 0.1, 'm/s²')}`;
  const legende = `<span class="legende"><span><i class="ln"></i>A</span><span class="lb"><i class="ln b"></i>B</span></span>`;

  root.innerHTML = `
  <div class="erb">
    <div class="lay2">
     <div class="hoofd2">
    <div class="paneel graf">
      <div class="kop"><h2>Beweging op de baan</h2><span class="legende">positie, snelheid en versnelling op tijdstip t</span></div>
      <div class="doek spoor" id="evb-doekb"><canvas id="evb-spoor" role="img" aria-label="Baan met de positie van de voorwerpen"></canvas></div>
    </div>
    <div class="grafieken drie stapel evbg">
      <div class="paneel graf">
        <div class="kop"><h2>(s,t)-grafiek</h2>${legende}</div>
        <div class="doek"><canvas id="evb-cs" role="img" aria-label="Positie in functie van de tijd"></canvas></div>
      </div>
      <div class="paneel graf">
        <div class="kop"><h2>(v,t)-grafiek</h2>${legende}</div>
        <div class="doek"><canvas id="evb-cv" role="img" aria-label="Snelheid in functie van de tijd"></canvas></div>
      </div>
      <div class="paneel graf">
        <div class="kop"><h2>(a,t)-grafiek</h2>${legende}</div>
        <div class="doek"><canvas id="evb-ca" role="img" aria-label="Versnelling in functie van de tijd"></canvas></div>
      </div>
    </div>

    <div class="uitlezing">
      <div class="uit ra"><div class="titel"><span class="stip a"></span><h2>Beweging A</h2></div>
        <span class="val" id="evb-ra"></span><span class="note" id="evb-na"></span></div>
      <div class="uit rb" id="evb-kb"><div class="titel"><span class="stip b"></span><h2>Beweging B</h2></div>
        <span class="val" id="evb-rb"></span><span class="note" id="evb-nb"></span></div>
      <div class="uit rm" id="evb-km"><div class="titel"><h2 class="c-m">Ontmoeting</h2></div>
        <span class="val" id="evb-rm"></span><span class="note" id="evb-nm"></span></div>
    </div>
     </div>
     <aside class="zij2" aria-label="Instellingen">
    <div class="paneel bediening">
      <div class="groep ga">
        <div class="gkop"><span class="stip a"></span>Beweging A</div>
        ${groepCtrls('a')}
      </div>
      <div class="groep gb" id="evb-gb">
        <div class="gkop"><label class="vink"><input type="checkbox" id="evb-aanb"><span class="stip b"></span>Beweging B tonen</label></div>
        ${groepCtrls('b')}
      </div>
      <div class="groep gt">
        <div class="gkop">Tijd en weergave</div>
        ${ctrl('t', 'Tijdstip t', 0, T, 0.1, 's')}
        <div class="knoppen">
          <button class="knop" id="evb-play" type="button">▶ Afspelen</button>
        </div>
        <label class="vink"><input type="checkbox" id="evb-arceer"><span class="sw"></span>Arceer oppervlakte</label>
          <label class="vink"><input type="checkbox" id="evb-stip"><span class="stipjes"></span>Positie op elke seconde</label>
        <label class="vink"><input type="checkbox" id="evb-raak">Raaklijn aan de (s,t)-grafiek</label>
      </div>
    </div>

     </aside>
    </div>
    <div class="paneel situaties">
      <span class="lbl-klein">Voorbeeldsituaties</span>
      <div class="chips" id="evb-chips">${SITUATIES.map(s => `<button type="button" class="sit" data-id="${s.id}" aria-pressed="false">${s.naam}</button>`).join('')}</div>
      <p class="uitleg" id="evb-uitleg"></p>
    </div>

  </div>`;

  const $ = id => root.querySelector('#evb-' + id);
  const cvS = $('cs'), cvV = $('cv'), cvA = $('ca'), cvB = $('spoor');

  function wisSituatie() { if (st.sit) { st.sit = null; tekenSituaties(); } }
  function koppel(id, obj, key, min, max) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(val);
      if (!isFinite(x)) return;
      x = Math.min(max, Math.max(min, x));
      obj[key] = x;
      if (bron !== r) r.value = x;
      if (bron !== n) n.value = x;
      if (bron && id !== 't') wisSituatie();
      teken();
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = obj[key]; });
    r.value = n.value = obj[key];
    return v => zet(v, null);
  }
  const zetters = {};
  [['a', st.A], ['b', st.B]].forEach(([k, obj]) => {
    zetters[k] = {
      s0: koppel(k + 's0', obj, 's0', -SMAX, SMAX),
      v0: koppel(k + 'v0', obj, 'v0', -VMAX, VMAX),
      a: koppel(k + 'a', obj, 'a', -AMAX, AMAX),
      t1: v => { obj.t1 = 0; }
    };
  });
  const zetT = koppel('t', st, 't', 0, T);
  const zetBeweging = (k, p) => ['s0', 'v0', 'a', 't1'].forEach(x => zetters[k][x](p[x]));

  const vinkB = $('aanb'), vinkA = $('arceer'), vinkR = $('raak');
  function zetAanB(aan) {
    st.aanB = aan; vinkB.checked = aan;
    $('gb').classList.toggle('uit-b', !aan);
    ['s0', 'v0', 'a'].forEach(x => { $('b' + x).disabled = !aan; $('b' + x + 'n').disabled = !aan; });
    root.querySelectorAll('.lb').forEach(el => { el.hidden = !aan; });
    $('kb').hidden = !aan; $('km').hidden = !aan;
    $('doekb').style.height = aan ? '210px' : '140px';
  }
  vinkB.addEventListener('change', () => { zetAanB(vinkB.checked); wisSituatie(); teken(); });
  vinkA.checked = st.arceer; vinkR.checked = st.raak;
  vinkA.addEventListener('change', () => { st.arceer = vinkA.checked; teken(); });
  const vinkS = $('stip'); vinkS.checked = st.stip;
  vinkS.addEventListener('change', () => { st.stip = vinkS.checked; teken(); });
  vinkR.addEventListener('change', () => { st.raak = vinkR.checked; teken(); });

  function tekenSituaties() {
    root.querySelectorAll('button.sit').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.sit)));
    const s = SITUATIES.find(x => x.id === st.sit);
    $('uitleg').innerHTML = s ? s.uitleg + ' Druk op <b>Afspelen</b>.' : STANDAARD_UITLEG;
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('button.sit'); if (!b) return;
    const s = SITUATIES.find(x => x.id === b.dataset.id);
    stop();
    zetAanB(s.aanB);
    zetBeweging('a', s.A); zetBeweging('b', s.B);
    zetT(0);
    st.sit = s.id; tekenSituaties(); teken();
  });

  // Afspelen
  let raf = null, vorige = null;
  const knop = $('play');
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; vorige = null; knop.textContent = '▶ Afspelen'; }
  function stap(ts) {
    if (vorige == null) vorige = ts;
    const nt = st.t + (ts - vorige) / 1000; vorige = ts;
    if (nt >= T) { zetT(T); stop(); return; }
    zetT(Math.round(nt * 100) / 100);
    raf = requestAnimationFrame(stap);
  }
  knop.addEventListener('click', () => {
    if (raf) { stop(); return; }
    if (st.t >= T - 1e-9) zetT(0);
    knop.textContent = '❚❚ Pauze';
    raf = requestAnimationFrame(stap);
  });

  /* Ontmoetingen: nulpunten van sA(t) − sB(t) op [0, T] */
  function ontmoetingen() {
    const f = t => sF(st.A, t) - sF(st.B, t);
    const N = 2000, uit = [];
    let allesNul = true;
    for (let i = 0; i <= N; i++) if (Math.abs(f(i * T / N)) > 1e-9) { allesNul = false; break; }
    if (allesNul) return { samen: true, lijst: [] };
    if (Math.abs(f(0)) < 1e-9) uit.push(0);
    for (let i = 0; i < N; i++) {
      let a = i * T / N, b = (i + 1) * T / N, fa = f(a), fb = f(b);
      if (Math.abs(fb) < 1e-9) { uit.push(b); continue; }
      if (Math.abs(fa) < 1e-9 || fa * fb > 0) continue;
      for (let k = 0; k < 60; k++) { const c = (a + b) / 2, fc = f(c); if (fa * fc <= 0) { b = c; } else { a = c; fa = fc; } }
      uit.push((a + b) / 2);
    }
    const lijst = uit.filter((t, i) => i === 0 || t - uit[i - 1] > 1e-3);
    return { samen: false, lijst };
  }

  function teken() {
    const K = { a: css('--a'), b: css('--b'), meet: css('--meet'), fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel') };
    const M = [{ k: 'A', p: st.A, col: K.a, dash: [], dir: 1 }];
    if (st.aanB) M.push({ k: 'B', p: st.B, col: K.b, dash: [], dir: -1 });
    const twee = M.length === 2;
    const t = st.t;
    M.forEach(m => {
      m.sT = sF(m.p, t); m.vT = vF(m.p, t); m.aT = aF(m.p, t);
      m.ds = m.sT - m.p.s0; m.dv = m.vT - m.p.v0;
    });

    const N = 200;
    const sv = [0], vv = [0], av = [0];
    M.forEach(m => {
      for (let i = 0; i <= N; i++) sv.push(sF(m.p, i * T / N));
      vv.push(m.p.v0, vF(m.p, T)); av.push(m.p.a);
    });
    const sR = blokRange(Math.min(...sv), Math.max(...sv));
    const vR = blokRange(Math.min(...vv), Math.max(...vv));
    const aR = Math.min(...av) < 0 ? { min: -10, max: 10, step: 5 } : { min: 0, max: 10, step: 2 };
    const ont = twee ? ontmoetingen() : null;

    const tijdlijn = (ctx, G) => {
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.strokeStyle = K.muted;
      ctx.beginPath(); ctx.moveTo(G.X(t), G.m.t); ctx.lineTo(G.X(t), G.m.t + G.ph); ctx.stroke();
      ctx.setLineDash([]);
    };
    const punt = (ctx, x, y, col, r = 5.5) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = K.bg; ctx.lineWidth = 2; ctx.stroke();
    };
    const plaatsLabels = labels => {
      labels.sort((p, q) => p.y - q.y);
      for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 24) labels[i].y = labels[i - 1].y + 24;
    };

    /* (s,t) */
    {
      const { ctx, w, h } = prepCanvas(cvS);
      const G = assen(ctx, w, h, { T, yMin: sR.min, yMax: sR.max, yStep: sR.step, yNaam: 's (m)' });
      tijdlijn(ctx, G);
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      M.forEach(m => {
        ctx.strokeStyle = K.muted;
        ctx.beginPath(); ctx.moveTo(G.X(t), G.Y(m.sT)); ctx.lineTo(G.X(0), G.Y(m.sT)); ctx.stroke();
        if (st.arceer) {
          ctx.strokeStyle = m.col;
          ctx.beginPath(); ctx.moveTo(G.X(0), G.Y(m.p.s0)); ctx.lineTo(G.X(t), G.Y(m.p.s0)); ctx.stroke();
        }
      });
      M.forEach(m => {
        ctx.setLineDash(m.dash); ctx.strokeStyle = m.col; ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let i = 0; i <= N; i++) { const tt = i * T / N; const x = G.X(tt), y = G.Y(sF(m.p, tt)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      });
      ctx.setLineDash([]);
      // raaklijn: richtingscoëfficiënt = v(t)
      if (st.raak) M.forEach(m => {
        const d = T * 0.22;
        ctx.save();
        ctx.beginPath(); ctx.rect(G.m.l, G.m.t, G.pw, G.ph); ctx.clip();
        ctx.strokeStyle = K.fg; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(G.X(t - d), G.Y(m.sT - m.vT * d)); ctx.lineTo(G.X(t + d), G.Y(m.sT + m.vT * d)); ctx.stroke();
        ctx.restore();
        const ex = Math.min(t + d, T), ey = m.sT + m.vT * (ex - t);
        if (ey >= sR.min && ey <= sR.max) {
          ctx.font = '600 11px ' + css('--f-mono');
          const lab = 'rico = ' + fmt(m.vT) + ' m/s';
          const tw = ctx.measureText(lab).width;
          let lx = G.X(ex) + 4; if (lx + tw > w - 2) lx = G.X(ex) - tw - 4;
          const ly = G.Y(ey) + (m.vT >= 0 ? -12 : 12);
          ctx.fillStyle = K.bg; ctx.fillRect(lx - 3, ly - 8, tw + 6, 16);
          ctx.fillStyle = m.col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(lab, lx, ly);
        }
      });
      // ontmoetingen
      if (ont && !ont.samen) ont.lijst.forEach(tm => {
        const x = G.X(tm), y = G.Y(sF(st.A, tm));
        ctx.fillStyle = K.meet; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill();
      });
      if (st.arceer) M.forEach((m, i) => {
        if (Math.abs(m.ds) < 1e-9) return;
        const x = G.X(t) + 8 + i * 13;
        pijl(ctx, x, G.Y(m.p.s0), x, G.Y(m.sT), m.col, 2);
      });
      M.forEach(m => {
        ctx.fillStyle = m.col; ctx.beginPath(); ctx.arc(G.X(0), G.Y(m.p.s0), 4, 0, 7); ctx.fill();
        punt(ctx, G.X(t), G.Y(m.sT), m.col);
      });
    }

    /* (v,t) */
    {
      const { ctx, w, h } = prepCanvas(cvV);
      const G = assen(ctx, w, h, { T, yMin: vR.min, yMax: vR.max, yStep: vR.step, yNaam: 'v (m/s)' });
      const labels = [];
      if (st.arceer && t > 0) M.forEach(m => {
        const p = m.p;
        const pts = [[0, 0], [0, p.v0]];
        if (p.t1 > 0 && p.t1 < t) pts.push([p.t1, p.v0]);
        pts.push([t, m.vT], [t, 0]);
        arceerPad(ctx, pts.map(q => [G.X(q[0]), G.Y(q[1])]), m.col, m.dir);
        const vm = vF(p, t / 2) / 2;
        if (Math.abs(G.Y(vF(p, t / 2)) - G.Y(0)) > 20) labels.push({ m, y: G.Y(vm), grootheid: 'Δs', waarde: m.ds, eenh: 'm' });
      });
      tijdlijn(ctx, G);
      M.forEach(m => {
        ctx.setLineDash(m.dash); ctx.strokeStyle = m.col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(G.X(0), G.Y(m.p.v0)); ctx.lineTo(G.X(m.p.t1), G.Y(m.p.v0)); ctx.lineTo(G.X(T), G.Y(vF(m.p, T))); ctx.stroke();
      });
      ctx.setLineDash([]);
      M.forEach(m => punt(ctx, G.X(t), G.Y(m.vT), m.col));
      const br = G.X(t) - G.X(0), cx = (G.X(0) + G.X(t)) / 2;
      plaatsLabels(labels);
      labels.forEach(L => {
        if (br < 40) return;
        ctx.font = '600 13px ' + css('--f-mono');
        const rest = ' = ' + fmt(L.waarde) + ' ' + L.eenh;
        const past = ctx.measureText('Δs' + (twee ? 'A' : '') + rest).width + 14 < br;
        indexLabel(ctx, cx, L.y, L.grootheid, twee ? L.m.k : '', past ? rest : '', L.m.col, K.bg);
      });
    }

    /* (a,t) */
    {
      const { ctx, w, h } = prepCanvas(cvA);
      const G = assen(ctx, w, h, { T, yMin: aR.min, yMax: aR.max, yStep: aR.step, yNaam: 'a (m/s²)' });
      tijdlijn(ctx, G);
      M.forEach(m => {
        const p = m.p;
        ctx.setLineDash(m.dash); ctx.strokeStyle = m.col; ctx.lineWidth = 2.5;
        if (p.t1 > 0) {
          ctx.beginPath(); ctx.moveTo(G.X(0), G.Y(0)); ctx.lineTo(G.X(p.t1), G.Y(0)); ctx.stroke();
          ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
          ctx.beginPath(); ctx.moveTo(G.X(p.t1), G.Y(0)); ctx.lineTo(G.X(p.t1), G.Y(p.a)); ctx.stroke();
          ctx.setLineDash(m.dash); ctx.lineWidth = 2.5;
        }
        ctx.beginPath(); ctx.moveTo(G.X(p.t1), G.Y(p.a)); ctx.lineTo(G.X(T), G.Y(p.a)); ctx.stroke();
      });
      ctx.setLineDash([]);
      M.forEach(m => punt(ctx, G.X(t), G.Y(m.aT), m.col));
    }

    /* Baan */
    {
      const { ctx, w, h } = prepCanvas(cvB);
      const ml = 30, mr = 24, pw = w - ml - mr;
      const X = s => ml + (s - sR.min) / (sR.max - sR.min) * pw;
      const banen = twee ? [58, 134] : [58];
      const yAs = banen[banen.length - 1] + 54;
      ctx.font = '11px ' + css('--f-mono');
      const stapB = (pw / ((sR.max - sR.min) / sR.step) < 34) ? sR.step * 2 : sR.step;
      for (let s = Math.ceil(sR.min / stapB) * stapB; s <= sR.max + 1e-9; s += stapB) {
        ctx.strokeStyle = s === 0 ? K.axis : K.grid; ctx.lineWidth = 1; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(X(s) + .5, banen[0] - 26); ctx.lineTo(X(s) + .5, yAs); ctx.stroke();
        if (X(s) > w - 52) continue;
        ctx.fillStyle = s === 0 ? K.fg : K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(fmt(s), X(s), yAs + 4);
      }
      ctx.fillStyle = K.fg; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '11px ' + css('--f-mono');
      ctx.fillText('s (m)', w - 2, yAs + 4);
      M.forEach((m, i) => {
        const y = banen[i];
        const idx = twee ? m.k : '';
        ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(ml - 10, y); ctx.lineTo(ml + pw + 10, y); ctx.stroke();
        ctx.fillStyle = m.col; ctx.font = '600 12px ' + css('--f-mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(m.k, 4, y);
        ctx.strokeStyle = m.col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(X(m.p.s0), y, 5, 0, 7); ctx.stroke();
        if (st.arceer && Math.abs(m.ds) > 1e-9) pijl(ctx, X(m.p.s0), y - 30, X(m.sT), y - 30, m.col, 2);
        const x = X(m.sT);
        // snelheidsvector op de baan, vóór het voorwerp
        if (Math.abs(m.vT) > 1e-9) {
          const sg = Math.sign(m.vT), len = Math.min(70, 14 + Math.abs(m.vT) * 2.2);
          pijl(ctx, x + sg * 22, y, x + sg * (22 + len), y, m.col, 2);
          vecLabel(ctx, x + sg * (22 + len / 2), y + 15, 'v', idx, m.col);
        }
        // versnellingsvector onder de baan
        if (Math.abs(m.aT) > 1e-9) {
          const sg = Math.sign(m.aT), len = Math.min(60, 16 + Math.abs(m.aT) * 9), ya = y + 34;
          pijl(ctx, x, ya, x + sg * len, ya, K.fg, 2);
          vecLabel(ctx, x + sg * (len + 14), ya + 2, 'a', idx, K.fg);
        }
        // positie op elke seconde
        if (st.stip) { ctx.fillStyle = m.col; for (let k = 0; k <= st.t + 1e-9; k++) { ctx.beginPath(); ctx.arc(X(sF(m.p, k)), y, 3.2, 0, 7); ctx.fill(); } }
        // voorwerp: autootje in de rijrichting (bij stilstand: richting van de versnelling)
        const richt = Math.abs(m.vT) > 1e-9 ? Math.sign(m.vT) : (Math.abs(m.p.a) > 1e-9 ? Math.sign(m.p.a) : (Math.sign(m.p.v0) || 1));
        auto(ctx, x, y, m.col, richt, K.bg);
      });
    }

    /* Teksten */
    const ind = k => twee ? `<sub>${k}</sub>` : '';
    M.forEach(m => {
      const p = m.p, c = m.k === 'A' ? 'c-a' : 'c-b', k = m.k.toLowerCase(), i = ind(m.k);
      const S = `<span class="${c}">s${i}</span>`, V = `<span class="${c}">v${i}</span>`, A_ = `<span class="${c}">a${i}</span>`;
      let form;
      if (p.t1 > 0) {
        form = `voor t ≤ ${fmt(p.t1)} s: ${S}(t) = ${fmt(p.s0)} + ${pn(p.v0)}·t<br>` +
               `voor t ≥ ${fmt(p.t1)} s: ${S}(t) = ${fmt(p.s0)} + ${pn(p.v0)}·t + ½·${pn(p.a)}·(t − ${fmt(p.t1)})²<br>` +
               `voor t ≤ ${fmt(p.t1)} s: ${V}(t) = ${fmt(p.v0)}<br>` +
               `voor t ≥ ${fmt(p.t1)} s: ${V}(t) = ${fmt(p.v0)} + ${pn(p.a)}·(t − ${fmt(p.t1)})`;
      } else {
        form = `${S}(t) = ${fmt(p.s0)} + ${pn(p.v0)}·t + ½·${pn(p.a)}·t²<br>` +
               `${V}(t) = ${fmt(p.v0)} + ${pn(p.a)}·t`;
      }
      $('r' + k).innerHTML = form + `<br>op t = ${fmt(t)} s: ${S} = <b class="${c}">${fmt(m.sT)} m</b>, ${V} = <b class="${c}">${fmt(m.vT)} m/s</b>, ${A_} = <b class="${c}">${fmt(m.aT)} m/s²</b>` +
        `<br><span class="${c}">Δs${i}</span> = s − s<sub>0</sub> = <b class="${c}">${fmt(m.ds)} m</b>` +
        `<br><span class="${c}">Δv${i}</span> = v − v<sub>0</sub> = <b class="${c}">${fmt(m.dv)} m/s</b>`;
      // keert het voorwerp om tussen 0 en t?
      const tStop = (p.a !== 0) ? p.t1 - p.v0 / p.a : -1;
      const keert = tStop > Math.max(p.t1, 0) + 1e-9 && tStop < t - 1e-9 && p.v0 !== 0;
      $('n' + k).textContent = keert
        ? `Op t = ${fmt(tStop)} s is v = 0 en keert het voorwerp om. Oppervlakte onder de t-as telt negatief, dus Δs is kleiner dan de afgelegde weg.`
        : p.a === 0 ? 'a = 0: de snelheid blijft constant, dit is een ERB.'
        : !st.arceer ? 'Vink “Arceer oppervlakte” aan om Δs als oppervlakte te zien.'
        : 'Gearceerde oppervlakte onder de (v,t)-grafiek = Δs.';
    });
    if (twee) {
      const afst = Math.abs(M[1].sT - M[0].sT);
      if (ont.samen) {
        $('rm').innerHTML = 'A en B vallen samen';
        $('nm').textContent = 'Zelfde beginpositie en zelfde beweging: de grafieken liggen op elkaar.';
      } else if (ont.lijst.length) {
        $('rm').innerHTML = ont.lijst.map(tm => `s<sub>A</sub> = s<sub>B</sub> op <b class="c-m">t = ${fmt(tm)} s</b> bij <b class="c-m">s = ${fmt(sF(st.A, tm))} m</b>`).join('<br>');
        $('nm').textContent = `Dat ${ont.lijst.length > 1 ? 'zijn de snijpunten' : 'is het snijpunt'} van de twee krommen in de (s,t)-grafiek. Afstand tussen A en B op t = ${fmt(t)} s: ${fmt(afst)} m.`;
      } else {
        $('rm').innerHTML = `Geen ontmoeting tussen 0 en ${T} s`;
        $('nm').textContent = `De krommen in de (s,t)-grafiek snijden elkaar niet. Afstand op t = ${fmt(t)} s: ${fmt(afst)} m.`;
      }
    }
  }

  zetAanB(st.aanB);
  tekenSituaties();
  const ro = new ResizeObserver(() => teken());
  [cvS, cvV, cvA, cvB].forEach(c => ro.observe(c));
  teken();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(teken);

  return () => { stop(); ro.disconnect(); };
}

/* ============================================================
   APPLET: Buigspanning in een profiel (6TWE)
   Afspraak: M > 0 = ligger buigt hol naar boven (onderaan trek).
   σ(y) = −M·y / I, met y gemeten vanaf de neutrale lijn (naar boven positief).
   ============================================================ */
function renderBuig(root) {
  let L = 4; // overspanning in m (instelbaar)
  const SIT = [
    { id: 'steun', naam: 'Op twee steunpunten', icon: '<svg viewBox="0 0 24 16"><rect x="1" y="4" width="22" height="4" fill="currentColor"/><path d="M3 8 L0.5 13 L5.5 13 Z M21 8 L18.5 13 L23.5 13 Z" fill="currentColor"/></svg>',
      uitleg: 'De ligger rust op twee steunpunten.' },
    { id: 'rechts', naam: 'Rechts ingeklemd', icon: '<svg viewBox="0 0 24 16"><rect x="1" y="6" width="19" height="4" fill="currentColor"/><rect x="20" y="1" width="3" height="14" fill="currentColor"/></svg>',
      uitleg: 'De ligger is rechts ingeklemd en links vrij (een uitkraging).' },
    { id: 'links', naam: 'Links ingeklemd', icon: '<svg viewBox="0 0 24 16"><rect x="4" y="6" width="19" height="4" fill="currentColor"/><rect x="1" y="1" width="3" height="14" fill="currentColor"/></svg>',
      uitleg: 'De ligger is links ingeklemd en rechts vrij (een uitkraging).' }
  ];
  const PROF = [
    { id: 'rect', naam: 'Rechthoekige balk', soort: 'rect',
      icon: '<svg viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" fill="currentColor"/></svg>' },
    { id: 'I', naam: 'I-profiel', soort: 'I',
      icon: '<svg viewBox="0 0 16 16"><path d="M2 1h12v2.5H9.2v9H14V15H2v-2.5h4.8v-9H2z" fill="currentColor"/></svg>' },
    { id: 'Lo', naam: 'L-profiel, beentje onderaan', soort: 'L',
      icon: '<svg viewBox="0 0 16 16"><path d="M3 1h2.6v11.4H14V15H3z" fill="currentColor"/></svg>' },
    { id: 'Lb', naam: 'L-profiel, beentje bovenaan', soort: 'L',
      icon: '<svg viewBox="0 0 16 16"><path d="M3 1h11v2.6H5.6V15H3z" fill="currentColor"/></svg>' }
  ];
  const STD = { rect: { b: 100, h: 200 }, I: { h: 200, b: 100, tf: 8.5, tw: 5.6 }, L: { h: 150, b: 100, t: 12 } };
  const dim = JSON.parse(JSON.stringify(STD));
  /* Bouwt de doorsnede (in mm) uit de ingestelde afmetingen en berekent A, zwaartepunt, I en v */
  function bouwProfiel(id) {
    const meta = PROF.find(p => p.id === id);
    let rects, poly, info;
    if (meta.soort === 'rect') {
      const { b, h } = dim.rect;
      rects = [[0, 0, b, h]]; poly = [[0, 0], [b, 0], [b, h], [0, h]];
      info = `rechthoek ${fmt(b, 1)} × ${fmt(h, 1)} mm`;
    } else if (meta.soort === 'I') {
      const { h, b } = dim.I, tf = Math.min(dim.I.tf, h / 2 - 1), tw = Math.min(dim.I.tw, b - 1);
      const x1 = (b - tw) / 2, x2 = (b + tw) / 2;
      rects = [[0, 0, b, tf], [x1, tf, tw, h - 2 * tf], [0, h - tf, b, tf]];
      poly = [[0, 0], [b, 0], [b, tf], [x2, tf], [x2, h - tf], [b, h - tf], [b, h], [0, h], [0, h - tf], [x1, h - tf], [x1, tf], [0, tf]];
      const std = h === 200 && b === 100 && tf === 8.5 && tw === 5.6;
      info = std ? 'IPE 200, zonder afrondingen' : `h = ${fmt(h, 1)}, b = ${fmt(b, 1)}, t<sub>f</sub> = ${fmt(tf, 1)}, t<sub>w</sub> = ${fmt(tw, 1)} mm`;
    } else {
      const { h, b } = dim.L, t = Math.min(dim.L.t, Math.min(h, b) - 1);
      if (id === 'Lo') { rects = [[0, 0, t, h], [t, 0, b - t, t]]; poly = [[0, 0], [b, 0], [b, t], [t, t], [t, h], [0, h]]; }
      else { rects = [[0, 0, t, h], [t, h - t, b - t, t]]; poly = [[0, 0], [t, 0], [t, h - t], [b, h - t], [b, h], [0, h]]; }
      info = `L ${fmt(h, 1)} × ${fmt(b, 1)} × ${fmt(t, 1)} mm`;
    }
    const p = { id, naam: meta.naam, rects, poly, info };
    let A = 0, Sy = 0;
    rects.forEach(([x, y, w, h]) => { A += w * h; Sy += w * h * (y + h / 2); });
    p.A = A; p.yc = Sy / A;
    p.h = Math.max(...rects.map(r => r[1] + r[3]));
    p.b = Math.max(...rects.map(r => r[0] + r[2]));
    p.I = rects.reduce((s, [x, y, w, h]) => s + w * h ** 3 / 12 + w * h * (y + h / 2 - p.yc) ** 2, 0);
    p.eB = p.h - p.yc; p.eO = p.yc;
    return p;
  }

  const st = { sit: 'steun', prof: 'rect', type: 'punt', dir: 1, F: 10, q: 5, a: 2, x: 2, toonM: false, toonX: false, toonDim: false, toonGrootte: false, toonL: false, toonPos: false, toonBer: false };
  const prof = () => bouwProfiel(st.prof);

  /* Buigend moment in kNm op plaats x (m) */
  /* Maximale moment voor de ongunstigste ligging van de kracht: bepaalt de vaste schaal */
  function Mschaal() {
    const d = st.dir;
    if (st.type === 'q') return st.sit === 'steun' ? d * st.q * L * L / 8 : -d * st.q * L * L / 2;
    return st.sit === 'steun' ? d * st.F * L / 4 : -d * st.F * L;
  }
  function Mx(x) {
    if (st.type === 'q') {
      const q = st.q * st.dir;
      if (st.sit === 'steun') return q * x * (L - x) / 2;
      if (st.sit === 'rechts') return -q * x * x / 2;
      return -q * (L - x) ** 2 / 2;
    }
    const F = st.F * st.dir, a = st.a;
    if (st.sit === 'steun') {
      const RA = F * (L - a) / L, RB = F * a / L;
      return x <= a ? RA * x : RB * (L - x);
    }
    if (st.sit === 'rechts') return x >= a ? -F * (x - a) : 0;   // vrij links, inklemming bij x = L
    return x <= a ? -F * (a - x) : 0;                            // inklemming bij x = 0, vrij rechts
  }
  function Mmax() {
    let best = 0, bx = 0;
    for (let i = 0; i <= 400; i++) { const x = i * L / 400, m = Mx(x); if (Math.abs(m) > Math.abs(best) + 1e-12) { best = m; bx = x; } }
    return { M: best, x: bx };
  }
  const sigma = (M, p) => ({ boven: -M * 1e6 * p.eB / p.I, onder: M * 1e6 * p.eO / p.I });
  const soort = s => Math.abs(s) < 1e-9 ? 'geen spanning' : s < 0 ? 'druk' : 'trek';

  const ctrl = (id, label, min, max, step, eenh) => `
      <div class="ctrl">
        <label for="bz-${id}">${label}</label>
        <div class="rij">
          <input type="range" id="bz-${id}" min="${min}" max="${max}" step="${step}">
          <input type="number" id="bz-${id}n" min="${min}" max="${max}" step="${step}" aria-label="${label.replace(/<[^>]+>/g, '')} in ${eenh}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`;

  const vink = (id, tekst) => `<label class="vink"><input type="checkbox" id="bz-${id}">${tekst}</label>`;
  root.innerHTML = `
  <div class="erb">
   <div class="lay3">
    <aside class="zij3" aria-label="Instellingen">
     <div class="paneel bediening">
      <div class="groep">
        <div class="gkop">Belastingsgeval</div>
        <div class="chips" id="bz-sit">${SIT.map(s => `<button type="button" class="sit ico" data-id="${s.id}" aria-pressed="false">${s.icon}${s.naam}</button>`).join('')}</div>
      </div>
      <div class="groep">
        <div class="gkop">Doorsnede van het profiel</div>
        <div class="chips" id="bz-prof">${PROF.map(p => `<button type="button" class="sit ico" data-id="${p.id}" aria-pressed="false">${p.icon}${p.naam}</button>`).join('')}</div>
      </div>
      <div class="groep">
        <div class="gkop">Belasting</div>
        <div class="chips" id="bz-type"><button type="button" class="sit" data-id="punt">Puntkracht</button><button type="button" class="sit" data-id="q">Verdeelde belasting</button></div>
        <div class="chips" id="bz-dir"><button type="button" class="sit" data-id="1">↓ Naar omlaag</button><button type="button" class="sit" data-id="-1">↑ Naar omhoog</button></div>
      </div>
      <div class="groep geavanceerd">
        <div class="gkop">Geavanceerde instellingen</div>
        <div class="optie">${vink('vber', 'Berekeningen tonen')}</div>
        <div class="optie">${vink('vm', 'Momentenlijn tonen')}</div>
        <div class="optie">${vink('vlen', 'Lengte van de ligger instellen')}
          <div id="bz-lenwrap" class="kolom">${ctrl('len', 'Lengte van de ligger L', 1, 10, 0.5, 'm')}</div></div>
        <div class="optie">${vink('vdim', 'Afmetingen van het profiel instellen')}
          <div id="bz-dims" class="kolom">
            <div id="bz-drect" class="kolom">${ctrl('rb', 'Breedte b', 20, 300, 1, 'mm')}${ctrl('rh', 'Hoogte h', 20, 400, 1, 'mm')}</div>
            <div id="bz-dI" class="kolom">${ctrl('Ih', 'Hoogte h', 80, 600, 1, 'mm')}${ctrl('Ib', 'Flensbreedte b', 40, 300, 1, 'mm')}${ctrl('Itf', 'Flensdikte t<sub>f</sub>', 3, 40, 0.5, 'mm')}${ctrl('Itw', 'Lijfdikte t<sub>w</sub>', 3, 30, 0.5, 'mm')}</div>
            <div id="bz-dL" class="kolom">${ctrl('Lh', 'Hoogte h', 30, 300, 1, 'mm')}${ctrl('Lb', 'Breedte b', 30, 300, 1, 'mm')}${ctrl('Lt', 'Dikte t', 3, 40, 0.5, 'mm')}</div>
            <div class="knoppen"><button class="knop" id="bz-std" type="button">Standaardafmetingen</button></div>
          </div></div>
        <div class="optie">${vink('vgrootte', 'Grootte van de belasting instellen')}
          <div id="bz-grootte" class="kolom">
            <div id="bz-gF">${ctrl('F', 'Kracht F', 1, 20, 0.5, 'kN')}</div>
            <div id="bz-gq">${ctrl('q', 'Verdeelde belasting q', 0.5, 10, 0.5, 'kN/m')}</div>
          </div></div>
        <div class="optie" id="bz-vposwrap">${vink('vpos', 'Positie van de kracht instellen')}
          <div id="bz-poswrap" class="kolom">${ctrl('a', 'Plaats van de kracht (vanaf links)', 0, L, 0.1, 'm')}</div></div>
        <div class="optie">${vink('vx', 'Doorsnede zelf kiezen')}
          <div id="bz-xwrap" class="kolom">
            ${ctrl('x', 'Plaats van de doorsnede x', 0, L, 0.05, 'm')}
            <div class="knoppen"><button class="knop" id="bz-max" type="button">Naar het grootste moment</button></div>
          </div></div>
      </div>
     </div>
    </aside>

    <div class="hoofd3">
     <p class="uitleg" id="bz-uitleg"></p>
     <div class="paneel graf">
      <div class="kop"><h2 id="bz-baltitel">Ligger</h2>
        <span class="legende"><span><i class="vlak druk"></i>druk</span><span><i class="vlak trek"></i>trek</span></span></div>
      <div class="doek balk" id="bz-balkdoek"><canvas id="bz-balk" role="img" aria-label="Ligger met belasting en steunpunten"></canvas></div>
     </div>
     <div class="bz-onder" id="bz-onder">
      <div class="paneel graf">
        <div class="kop"><h2>Spanningsverloop in de doorsnede</h2><span class="legende" id="bz-xlbl"></span></div>
        <p class="maxtekst" id="bz-maxtekst"></p>
        <div class="doek dsn"><canvas id="bz-dsn" role="img" aria-label="Doorsnede met neutrale lijn en buigspanningsverloop"></canvas></div>
      </div>
      <div class="kolom" id="bz-uitkol">

        <div class="uit"><div class="titel"><h2>Grootste moment</h2></div>
          <span class="val" id="bz-rm"></span></div>

          <span class="val" id="bz-rp"></span><span class="note" id="bz-np"></span></div>

     </div>
    </div>
   </div>
  </div>`;

  const $ = id => root.querySelector('#bz-' + id);
  const cvBalk = $('balk'), cvD = $('dsn');

  function koppel(id, key, min, max, obj = st) {

      obj[key] = x;

    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = obj[key]; });

  }
  const dimZet = {
    rb: koppel('rb', 'b', 20, 300, dim.rect), rh: koppel('rh', 'h', 20, 400, dim.rect),
    Ih: koppel('Ih', 'h', 80, 600, dim.I), Ib: koppel('Ib', 'b', 40, 300, dim.I), Itf: koppel('Itf', 'tf', 3, 40, dim.I), Itw: koppel('Itw', 'tw', 3, 30, dim.I),
    Lh: koppel('Lh', 'h', 30, 300, dim.L), Lb: koppel('Lb', 'b', 30, 300, dim.L), Lt: koppel('Lt', 't', 3, 40, dim.L)
  };
  $('std').addEventListener('click', () => {
    dimZet.rb(STD.rect.b); dimZet.rh(STD.rect.h);
    dimZet.Ih(STD.I.h); dimZet.Ib(STD.I.b); dimZet.Itf(STD.I.tf); dimZet.Itw(STD.I.tw);
    dimZet.Lh(STD.L.h); dimZet.Lb(STD.L.b); dimZet.Lt(STD.L.t);
  });
  const zetF = koppel('F', 'F', 1, 20);
  const zetQ = koppel('q', 'q', 0.5, 10);
  const zetA = koppel('a', 'a', 0, () => L);
  const zetX = koppel('x', 'x', 0, () => L);
  // lengte van de ligger: kracht en doorsnede schuiven evenredig mee
  const lw = { L };
  const zetLen = koppel('len', 'L', 1, 10, lw);
  const lenR = $('len'), lenN = $('lenn');
  const nieuweL = () => {
    const oud = L; L = lw.L;
    if (Math.abs(oud - L) < 1e-9) return;
    ['a', 'x'].forEach(k => { $(k).max = L; $(k + 'n').max = L; });
    zetA(Math.round(st.a / oud * L * 100) / 100);
    zetX(Math.round(st.x / oud * L * 100) / 100);
  };
  lenR.addEventListener('input', nieuweL); lenN.addEventListener('input', nieuweL);
  const naarMax = () => zetX(Math.round(Mmax().x * 100) / 100);
  $('max').addEventListener('click', naarMax);
  const standaardPos = () => st.sit === 'steun' ? L / 2 : st.sit === 'rechts' ? 0 : L;
  // geavanceerde opties: uitvinken zet terug naar de standaardwaarde
  [['vm', 'toonM'], ['vx', 'toonX'], ['vdim', 'toonDim'], ['vgrootte', 'toonGrootte'], ['vlen', 'toonL'], ['vpos', 'toonPos'], ['vber', 'toonBer']].forEach(([id, key]) => {

    v.addEventListener('change', () => {

      if (!v.checked) {

        if (key === 'toonPos') zetA(standaardPos());

      if (key === 'toonX' && v.checked) naarMax();

  function kies() {
    root.querySelectorAll('#bz-sit button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.sit)));
    root.querySelectorAll('#bz-prof button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.prof)));
    const p = prof();
    root.querySelectorAll('#bz-type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.type)));
    root.querySelectorAll('#bz-dir button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.id === st.dir)));

    $('uitkol').hidden = !st.toonBer;
    $('onder').classList.toggle('enkel', !st.toonBer);
    $('grootte').hidden = !st.toonGrootte; $('gF').hidden = st.type !== 'punt'; $('gq').hidden = st.type !== 'q';
    $('xwrap').hidden = !st.toonX;
    $('dims').hidden = !st.toonDim;
    const soortP = PROF.find(x => x.id === st.prof).soort;
    $('drect').hidden = soortP !== 'rect'; $('dI').hidden = soortP !== 'I'; $('dL').hidden = soortP !== 'L';
    $('balkdoek').style.height = st.toonM ? '340px' : '185px';
    $('baltitel').textContent = st.toonM ? 'Ligger en momentenlijn' : 'Ligger';
    const hol = Mschaal() > 0;
    let u = SIT.find(s => s.id === st.sit).uitleg +
      ` Door deze belasting buigt de ligger <b>${hol ? 'hol' : 'bol'} naar boven</b>: bovenaan ${hol ? 'druk' : 'trek'}, onderaan ${hol ? 'trek' : 'druk'}.` +
      ` Het grootste moment zit ${st.sit !== 'steun' ? 'aan de inklemming' : st.type === 'q' ? 'in het midden' : 'onder de kracht'}.`;
    if (p.id.startsWith('L')) u += ' Bij dit L-profiel ligt de neutrale lijn <b>niet in het midden</b>: de vezel die het verst van de neutrale lijn ligt, krijgt de grootste spanning.';
    else u += ' Dit profiel is symmetrisch: de neutrale lijn ligt in het midden, dus druk en trek zijn even groot.';
    $('uitleg').innerHTML = u;
  }
  $('sit').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.sit = b.dataset.id;
    zetA(standaardPos());
    naarMax(); kies(); teken();
  });
  $('type').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.type = b.dataset.id; naarMax(); kies(); teken();
  });
  $('dir').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.dir = +b.dataset.id; kies(); teken();
  });
  $('prof').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.prof = b.dataset.id; kies(); teken();
  });

  function teken() {
    const K = { druk: css('--druk'), trek: css('--trek'), lijn: css('--b'), m: css('--a'), fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel'), vul: css('--panel-2') };
    const p = prof();
    const mm = Mmax();
    const xS = st.toonX ? st.x : mm.x;
    const mHier = Mx(xS);
    const sHier = sigma(mHier, p), sMax = sigma(mm.M, p);
    const kleur = s => Math.abs(s) < 1e-9 ? K.muted : s < 0 ? K.druk : K.trek;

    /* ---------- Ligger + momentenlijn ---------- */
    {
      const { ctx, w, h } = prepCanvas(cvBalk);
      const ml = 46, mr = 40, pw = w - ml - mr;
      const X = x => ml + x / L * pw;
      const yb0 = 66, yb1 = 98, strook = 8;
      const N = 400;

      // balk met druk- en trekzones langs boven- en onderrand
      ctx.fillStyle = K.vul; ctx.fillRect(X(0), yb0, pw, yb1 - yb0);
      for (let i = 0; i < N; i++) {
        const m = Mx((i + 0.5) * L / N);
        if (Math.abs(m) < 1e-9) continue;
        const x0 = X(i * L / N), bw = pw / N + 0.6;
        ctx.fillStyle = m > 0 ? K.druk : K.trek; ctx.globalAlpha = 0.75; ctx.fillRect(x0, yb0, bw, strook);
        ctx.fillStyle = m > 0 ? K.trek : K.druk; ctx.fillRect(x0, yb1 - strook, bw, strook);
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.strokeRect(X(0), yb0, pw, yb1 - yb0);
      const yNA = yb1 - (p.yc / p.h) * (yb1 - yb0);
      ctx.setLineDash([5, 4]); ctx.strokeStyle = K.muted; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(0), yNA); ctx.lineTo(X(L), yNA); ctx.stroke(); ctx.setLineDash([]);

      // opleggingen
      ctx.fillStyle = K.fg; ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5;
      const grond = (x, y) => {
        ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.lineTo(x + 16, y); ctx.stroke();
        for (let k = -14; k <= 12; k += 6) { ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + k - 5, y + 6); ctx.stroke(); }
      };
      const muur = (x, kant) => {
        const x1 = kant < 0 ? x - 12 : x;
        ctx.fillStyle = K.axis; ctx.fillRect(x1, yb0 - 26, 12, yb1 - yb0 + 52);
        ctx.strokeStyle = K.fg; ctx.lineWidth = 1;
        const xr = kant < 0 ? x1 : x1 + 12;
        for (let y = yb0 - 26; y < yb1 + 26; y += 7) { ctx.beginPath(); ctx.moveTo(xr, y); ctx.lineTo(xr + kant * -0 + (kant < 0 ? -6 : 6), y + 6); ctx.stroke(); }
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, yb0 - 26); ctx.lineTo(x, yb1 + 26); ctx.stroke();
      };
      if (st.sit === 'steun') {
        ctx.beginPath(); ctx.moveTo(X(0), yb1); ctx.lineTo(X(0) - 10, yb1 + 16); ctx.lineTo(X(0) + 10, yb1 + 16); ctx.closePath(); ctx.fill();
        grond(X(0), yb1 + 17);
        ctx.beginPath(); ctx.moveTo(X(L), yb1); ctx.lineTo(X(L) - 10, yb1 + 13); ctx.lineTo(X(L) + 10, yb1 + 13); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(X(L) - 5, yb1 + 17, 3, 0, 7); ctx.arc(X(L) + 5, yb1 + 17, 3, 0, 7); ctx.fill();
        grond(X(L), yb1 + 21);
      } else if (st.sit === 'rechts') muur(X(L), 1);
      else muur(X(0), -1);

      // belasting (boven de balk naar omlaag, onder de balk naar omhoog)
      const omlaag = st.dir > 0;
      const yStaart = omlaag ? 18 : yb1 + 44, yKop = omlaag ? yb0 - 3 : yb1 + 3;
      const yLabel = omlaag ? 18 : yb1 + 56;
      const label = (xRef, letter, tekst) => {
        ctx.font = '500 12px ' + css('--f-mono');
        const fw = ctx.measureText(tekst).width;
        const rechts = xRef + 30 + fw < w - 4;
        const tx = rechts ? xRef + 28 : xRef - 8 - fw;
        ctx.fillStyle = K.bg; ctx.fillRect(tx - 22, yLabel - 10, fw + 26, 20);
        vecLabel(ctx, tx - 12, yLabel, letter, '', K.fg);
        ctx.font = '500 12px ' + css('--f-mono'); ctx.fillStyle = K.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(tekst, tx, yLabel);
      };
      if (st.type === 'punt') {
        const xa = X(st.a);
        pijl(ctx, xa, omlaag ? 10 : yb1 + 48, xa, yKop, K.fg, 2.5);
        label(xa, 'F', st.toonBer ? '= ' + fmt(st.F, 1) + ' kN' : '');
      } else {
        const n = 16, yL = omlaag ? 30 : yb1 + 34;
        ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(X(0), yL); ctx.lineTo(X(L), yL); ctx.stroke();
        const van = (st.sit === 'steun' && !omlaag) ? 1 : 0, tot = (st.sit === 'steun' && !omlaag) ? n - 1 : n;
        for (let i = van; i <= tot; i++) pijl(ctx, X(i * L / n), yL, X(i * L / n), yKop, K.fg, 1.5);
        label(X(L) - 140, 'q', st.toonBer ? '= ' + fmt(st.q, 1) + ' kN/m' : '');
      }

      // momentenlijn (optioneel)
      const my0 = 186, my1 = h - 30;
      let YM = null;
      if (st.toonM) {
      const ms = []; for (let i = 0; i <= N; i++) ms.push(Mx(i * L / N));
      const Mw = Mschaal();
      const mR = niceRange(Math.min(0, Mw), Math.max(0, Mw));
      YM = m => my0 + (mR.max - m) / (mR.max - mR.min) * (my1 - my0);
      ctx.font = '11px ' + css('--f-mono'); ctx.lineWidth = 1;
      for (let i = Math.ceil(mR.min / mR.step - 1e-9); i * mR.step <= mR.max + 1e-9; i++) {
        const m = i * mR.step;
        ctx.strokeStyle = K.grid; ctx.beginPath(); ctx.moveTo(X(0), YM(m) + .5); ctx.lineTo(X(L), YM(m) + .5); ctx.stroke();
        ctx.fillStyle = K.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; if (st.toonBer) ctx.fillText(fmt(m), X(0) - 8, YM(m));
      }
      for (let x = 0; x <= L; x++) {
        ctx.fillStyle = K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(fmt(x), X(x), my1 + 8);
      }
      ctx.fillStyle = K.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(st.toonBer ? 'M (kNm)' : 'M', X(0) + 6, my0 - 8);
      ctx.textAlign = 'right'; ctx.fillText('x (m)', w - 4, YM(0) - 6);
      ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(0), YM(0)); ctx.lineTo(X(L) + 14, YM(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), my1); ctx.lineTo(X(0), my0 - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), YM(0));
      ms.forEach((m, i) => ctx.lineTo(X(i * L / N), YM(m)));
      ctx.lineTo(X(L), YM(0)); ctx.closePath();
      ctx.fillStyle = K.m; ctx.globalAlpha = 0.14; ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath(); ms.forEach((m, i) => i ? ctx.lineTo(X(i * L / N), YM(m)) : ctx.moveTo(X(0), YM(m)));
      ctx.strokeStyle = K.m; ctx.lineWidth = 2.5; ctx.stroke();
      }

      // plaats(en) van de grootste spanning: doorsnede met het grootste moment, verste vezel
      if (Math.abs(mm.M) > 1e-9) {
        const xm = X(mm.x), sym = Math.abs(p.eB - p.eO) < 1e-6;
        const vezels = sym ? ['boven', 'onder'] : [p.eB > p.eO ? 'boven' : 'onder'];
        vezels.forEach(vz => {
          const y = vz === 'boven' ? yb0 + 4 : yb1 - 4, s = vz === 'boven' ? sMax.boven : sMax.onder;
          ctx.strokeStyle = K.fg; ctx.lineWidth = 2; ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(xm, y, 7, 0, 7); ctx.stroke();
          ctx.fillStyle = kleur(s); ctx.beginPath(); ctx.arc(xm, y, 3.5, 0, 7); ctx.fill();
          const rechts = xm < w - 120;
          indexLabel(ctx, xm + (rechts ? 44 : -44), vz === 'boven' ? yb0 - 14 : yb1 + 16, 'σ', 'max', '', K.fg, K.bg);
        });
      }
      // gekozen doorsnede
      const xs = X(xS);
      ctx.setLineDash([4, 4]); ctx.strokeStyle = K.fg; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(xs, yb0 - 14); ctx.lineTo(xs, st.toonM ? my1 : yb1 + 14); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = K.fg; ctx.font = '600 11px ' + css('--f-mono'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('x', xs, yb0 - 16);
      if (st.toonM) {
      ctx.fillStyle = K.m; ctx.beginPath(); ctx.arc(xs, YM(mHier), 5.5, 0, 7); ctx.fill();
      ctx.strokeStyle = K.bg; ctx.lineWidth = 2; ctx.stroke();
      const lab = 'M = ' + fmt(mHier) + ' kNm';
      if (st.toonBer) {
      ctx.font = '600 12px ' + css('--f-mono');
      const tw = ctx.measureText(lab).width;
      let lx = xs + 10; if (lx + tw > w - 4) lx = xs - 10 - tw;
      const ly = YM(mHier) + (mHier >= 0 ? -14 : 14);
      ctx.fillStyle = K.bg; ctx.fillRect(lx - 4, ly - 9, tw + 8, 18);
      ctx.fillStyle = K.m; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(lab, lx, ly);
      }
      }
    }

    /* ---------- Doorsnede + spanningsdiagram ---------- */
    {
      const { ctx, w: wc, h } = prepCanvas(cvD);
      // tekening begrenzen in breedte en centreren, zodat het verloop niet uitgerekt wordt
      const w = Math.min(wc, 700);
      ctx.translate((wc - w) / 2, 0);
      const smal = w < 520;
      const lm = smal ? 70 : 100;
      const wl = Math.min(Math.max(w * 0.38, 150), 240);
      const top = 56, bot = h - 46;
      const k = Math.min((wl - lm - 14) / p.b, (bot - top) / p.h);
      const ph = p.h * k;
      const y0 = (top + bot) / 2 + ph / 2, yTop = y0 - ph;
      const px0 = lm + ((wl - lm - 6) - p.b * k) / 2;
      const PX = v => px0 + v * k, PY = v => y0 - v * k;
      const yNA = PY(p.yc);
      const nul = Math.abs(mHier) < 1e-9;
      const pad = () => { ctx.beginPath(); p.poly.forEach(([a, b], i) => i ? ctx.lineTo(PX(a), PY(b)) : ctx.moveTo(PX(a), PY(b))); ctx.closePath(); };

      // profiel met druk/trek-tint
      pad(); ctx.fillStyle = K.vul; ctx.fill();
      if (!nul) {
        ctx.save(); pad(); ctx.clip();
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = kleur(sHier.boven); ctx.fillRect(PX(0) - 1, yTop - 1, p.b * k + 2, yNA - yTop + 1);
        ctx.fillStyle = kleur(sHier.onder); ctx.fillRect(PX(0) - 1, yNA, p.b * k + 2, y0 - yNA + 1);
        ctx.restore();
      }
      pad(); ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.stroke();

      // maatlijnen e_boven en e_onder
      const xm = px0 - 12;
      ctx.strokeStyle = K.muted; ctx.lineWidth = 1;
      [[yTop, yNA], [yNA, y0]].forEach(([a, b]) => {
        ctx.beginPath(); ctx.moveTo(xm, a); ctx.lineTo(xm, b); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xm - 4, a); ctx.lineTo(xm + 4, a); ctx.moveTo(xm - 4, b); ctx.lineTo(xm + 4, b); ctx.stroke();
      });
      ctx.font = (smal ? '10px ' : '11px ') + css('--f-mono'); ctx.fillStyle = K.fg; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      if (yNA - yTop > 14) ctx.fillText(st.toonBer ? 'v = ' + fmt(p.eB, 1) + (smal ? '' : ' mm') : 'v', xm - 6, (yTop + yNA) / 2);
      if (y0 - yNA > 14) ctx.fillText(st.toonBer ? 'v = ' + fmt(p.eO, 1) + (smal ? '' : ' mm') : 'v', xm - 6, (yNA + y0) / 2);

      // neutrale lijn over de hele breedte
      ctx.setLineDash([6, 4]); ctx.strokeStyle = K.fg; ctx.globalAlpha = 0.7; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(4, yNA); ctx.lineTo(w - 6, yNA); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.font = '10px ' + css('--f-mono'); ctx.fillStyle = K.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText('neutrale lijn', w - 6, yNA - 3);

      // spanningsdiagram
      const xs0 = wl + 8, xs1 = w - 12;
      const xc = (xs0 + xs1) / 2, half = (xs1 - xs0) / 2 - 6;
      const sS = sigma(Mschaal(), p), sRef = Math.max(Math.abs(sS.boven), Math.abs(sS.onder));
      const sx = sRef > 0 ? half / sRef : 0;
      ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5;
      pijl(ctx, xc, y0 + 16, xc, yTop - 34, K.axis, 1.5);
      pijl(ctx, xs0, yNA, xs1 + 6, yNA, K.axis, 1.5);
      ctx.font = 'italic 600 13px ' + css('--f-mono'); ctx.fillStyle = K.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('h', xc + 8, yTop - 34);
      ctx.textBaseline = 'top'; ctx.textAlign = 'right'; ctx.fillText('σ', xs1 + 4, yNA + 6);

      if (nul) {
        ctx.font = '500 13px ' + css('--f-body'); ctx.fillStyle = K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = K.bg; const t = 'M = 0: geen buigspanning'; const tw = ctx.measureText(t).width;
        ctx.fillRect(xc - tw / 2 - 6, yTop + ph * 0.25 - 11, tw + 12, 22);
        ctx.fillStyle = K.fg; ctx.fillText(t, xc, yTop + ph * 0.25);
      } else {
        const n = Math.max(8, Math.round(ph / 11));
        for (let i = 0; i <= n; i++) {
          const yy = yTop + i * ph / n;
          const s = -mHier * 1e6 * ((yNA - yy) / k) / p.I;
          const len = s * sx;
          if (Math.abs(len) > 5) pijl(ctx, xc, yy, xc + len, yy, kleur(s), 1.5);
        }
        ctx.strokeStyle = K.lijn; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(xc + sHier.boven * sx, yTop); ctx.lineTo(xc + sHier.onder * sx, y0); ctx.stroke();
        const label = (s, y) => {
          if (Math.abs(s) < 1e-9) return;
          const rest = st.toonBer ? ' = ' + fmt(s, 1) + ' MPa' : '';
          ctx.font = '600 13px ' + css('--f-mono');
          const breed = ctx.measureText('σ' + rest).width + 30;
          let cx = xc + s * sx;
          cx = Math.min(Math.max(cx, Math.max(breed / 2 + 4, xs0 - 40 + breed / 2)), w - 4 - breed / 2);
          indexLabel(ctx, cx, y, 'σ', s < 0 ? 'druk' : 'trek', rest, kleur(s), K.bg);
        };
        label(sHier.boven, yTop - 12);
        label(sHier.onder, y0 + 14);
      }
    }

    /* ---------- Teksten ---------- */
    const z = s => `<b style="color:${kleur(s)}">${fmt(s, 1)} MPa</b> (${soort(s)})`;
    const I6 = fmt(p.I / 1e6, 2);
    $('rx').textContent = fmt(xS) + ' m';
    $('xlbl').textContent = st.toonX ? 'doorsnede op x = ' + fmt(xS) + ' m' : '';
    // in woorden: waar is de spanning maximaal?
    if (Math.abs(mm.M) < 1e-9) $('maxtekst').textContent = 'Er is geen buigend moment, dus ook geen buigspanning.';
    else {
      const midden = Math.abs(st.a - L / 2) < 1e-6;
      const waar = st.sit !== 'steun' ? 'ter hoogte van de inklemming'
        : st.type === 'q' ? 'in het midden van de ligger'
        : midden ? 'in het midden van de ligger, onder de kracht' : 'onder de kracht';
      const sym = Math.abs(p.eB - p.eO) < 1e-6;
      const w2 = s => st.toonBer ? ` (${fmt(s, 1)} MPa)` : '';
      let t = `De maximale buigspanning bevindt zich ${waar}, `;
      if (sym) t += `zowel in de bovenste als in de onderste vezel: bovenaan ${soort(sMax.boven)}${w2(sMax.boven)}, onderaan ${soort(sMax.onder)}${w2(sMax.onder)}.`;
      else {
        const vz = p.eB > p.eO ? 'boven' : 'onder', sv = vz === 'boven' ? sMax.boven : sMax.onder;
        t += `in de ${vz === 'boven' ? 'bovenste' : 'onderste'} vezel, die het verst van de neutrale lijn ligt. Daar treedt ${soort(sv)} op${w2(sv)}.`;
      }
      $('maxtekst').textContent = t;
    }
    $('rd').innerHTML =
      `M = <b class="c-a">${fmt(mHier)} kNm</b><br>` +
      `σ<sub>boven</sub> = M / W<sub>boven</sub> = ${z(sHier.boven)}<br>` +
      `σ<sub>onder</sub> = M / W<sub>onder</sub> = ${z(sHier.onder)}`;
    $('nd').textContent = Math.abs(mHier) < 1e-9
      ? 'In deze doorsnede is het buigend moment nul, dus er is geen buigspanning.'
      : mHier > 0 ? 'M > 0: de ligger buigt hol naar boven. Bovenaan druk, onderaan trek.'
      : 'M < 0: de ligger buigt bol naar boven. Bovenaan trek, onderaan druk.';
    $('rm').innerHTML =
      `M<sub>max</sub> = <b class="c-a">${fmt(mm.M)} kNm</b> op x = ${fmt(mm.x)} m<br>` +
      `σ<sub>boven</sub> = ${z(sMax.boven)}<br>σ<sub>onder</sub> = ${z(sMax.onder)}`;
    $('rp').innerHTML =
      `${p.naam}<br><span class="note">${p.info}</span><br>` +
      `A = ${fmt(p.A, 0)} mm²<br>I = ${I6}·10⁶ mm⁴<br>` +
      `v<sub>boven</sub> = ${fmt(p.eB, 1)} mm, v<sub>onder</sub> = ${fmt(p.eO, 1)} mm<br>` +
      `W<sub>boven</sub> = I / v<sub>boven</sub> = ${fmt(p.I / p.eB / 1e3, 1)}·10³ mm³<br>` +
      `W<sub>onder</sub> = I / v<sub>onder</sub> = ${fmt(p.I / p.eO / 1e3, 1)}·10³ mm³`;
    $('np').textContent = 'De neutrale lijn gaat door het zwaartepunt van de doorsnede. v is de afstand van de neutrale lijn tot de buitenste vezel. Spanningen in MPa (1 MPa = 1 N/mm²).';
  }

  kies();
  const ro = new ResizeObserver(() => teken());
  [cvBalk, cvD].forEach(c => ro.observe(c));
  teken();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(teken);
  return () => ro.disconnect();
}

/* ============================================================
   APPLET: D- en M-lijn van een ligger (6TWE)
   Afspraak: D(x) = som van de verticale krachten links van de doorsnede (omhoog positief).
             M(x) = som van de momenten van de krachten links van de doorsnede (hol naar boven positief).
   ============================================================ */
function renderDM(root) {
  const eps = 1e-9;
  const st = {
    type: 'steun', L: 5, xA: 0, xB: 5, kant: 'links', hover: null, uF: 'kN', uL: 'm',
    loads: [],
    volg: 1
  };

  const ctrl = (id, label, min, max, step, eenh) => `

  root.innerHTML = `

          </div>
        </div>
        <div class="groep eh-groep">
          <div class="gkop">Eenheden</div>

          <div class="eh-rij"><span class="lbl-klein">Afstand</span><div class="chips" id="dm-uL"><button type="button" class="sit" data-u="m">m</button><button type="button" class="sit" data-u="mm">mm</button></div></div>

            <button class="knop" type="button" id="dm-addQ">+ Verdeelde belasting</button>
            <button class="knop" type="button" id="dm-reset" title="Alle belastingen verwijderen">↺ Reset</button>
          </div>
        </div>
