      </div>
    </div>

    <div class="paneel graf">
      <div class="kop"><h2>Ligger</h2>
        <span class="legende"><span><i class="ln" style="border-color:var(--fg)"></i>belasting</span><span><i class="ln" style="border-color:var(--meet)"></i>reactie</span></span></div>
      <div class="dm-rij">
        <div class="doek dm-balk"><canvas id="dm-cb" role="img" aria-label="Ligger met belastingen en reactiekrachten"></canvas></div>
        <div class="kolom dm-uit">
          <div class="uit"><div class="titel"><h2 class="c-m">Reactiekrachten</h2></div><span class="val" id="dm-rr"></span><span class="note" id="dm-nr"></span></div>
          <div class="uit"><div class="titel"><h2>Grootste waarden</h2></div><span class="val" id="dm-ru"></span></div>
        </div>
      </div>
    </div>
    <div class="paneel graf">
      <div class="kop"><h2>D-lijn (dwarskracht)</h2><span class="legende">beweeg over de grafiek om D af te lezen</span></div>
      <div class="dm-rij">
        <div class="doek dm-lijn"><canvas id="dm-cd" role="img" aria-label="Dwarskrachtenlijn"></canvas></div>
        <div class="fv" id="dm-fvD"></div>
      </div>
    </div>
    <div class="paneel graf">
      <div class="kop"><h2>M-lijn (buigend moment)</h2><span class="legende">beweeg over de grafiek om M af te lezen</span></div>
      <div class="dm-rij">
        <div class="doek dm-lijn"><canvas id="dm-cm" role="img" aria-label="Momentenlijn"></canvas></div>
        <div class="fv" id="dm-fvM"></div>
      </div>
      <p class="uitleg klein"><span id="dm-noot"></span> Afspraak: D is de som van de verticale krachten links van de doorsnede (omhoog positief), M is de som van hun momenten (hol naar boven positief).</p>
    </div>
  </div>`;

  const $ = id => root.querySelector('#dm-' + id);
  const cvB = $('cb'), cvD = $('cd'), cvM = $('cm');

  /* ---------- ligger-instellingen ---------- */
  const E = () => eenhedenVan(st);
  function koppel(id, key, min, maxF, na) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(String(val).replace(',', '.'));
      if (!isFinite(x)) return;
      const c = E().cL;
      x = Math.min(maxF() * c, Math.max(min * c, x));
      st[key] = x / c;
      if (bron !== r) r.value = x;
      if (bron !== n) n.value = x;
      if (na) na();
      teken();
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = rondAf(st[key] * E().cL); });
    r.value = n.value = rondAf(st[key] * E().cL);
    return v => zet(v, null);
  }
  function zetBereik() {    // schuiven en vakjes van de ligger in de gekozen lengte-eenheid
    const c = E().cL;
    [['L', 1, 12, 0.5], ['xA', 0, st.L, 0.1], ['xB', 0, st.L, 0.1]].forEach(([k, mn, mx, sp]) => {
      [$(k), $(k + 'n')].forEach(el => { el.min = mn * c; el.max = mx * c; el.step = c === 1 ? sp : sp * 100; el.value = rondAf(st[k] * c); });
      $(k + 'n').nextElementSibling.textContent = E().uL;
    });
  }
  const maxL = () => st.L;
  const zetters = {};
  const nieuweLengte = () => {
    ['xA', 'xB'].forEach(k => {
      $(k).max = st.L * E().cL; $(k + 'n').max = st.L * E().cL;
      if (st[k] > st.L) { st[k] = st.L; $(k).value = $(k + 'n').value = rondAf(st.L * E().cL); }
    });
    st.loads.forEach(l => ['x', 's', 'e'].forEach(k => { if (k in l && l[k] > st.L) l[k] = st.L; }));
    tekenLasten();
  };
  koppel('L', 'L', 1, () => 12, nieuweLengte);
  zetters.xA = koppel('xA', 'xA', 0, maxL);
  zetters.xB = koppel('xB', 'xB', 0, maxL);
  zetBereik();
  function kiesEenheid() {
    root.querySelectorAll('#dm-uF button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === st.uF)));
    root.querySelectorAll('#dm-uL button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === st.uL)));
  }
  $('uF').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (!b) return; st.uF = b.dataset.u; kiesEenheid(); tekenLasten(); teken(); });
  $('uL').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (!b) return; st.uL = b.dataset.u; kiesEenheid(); zetBereik(); tekenLasten(); teken(); });
  kiesEenheid();

  function kies() {
    root.querySelectorAll('#dm-type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.type)));
    root.querySelectorAll('#dm-kant button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.kant)));
    $('steunen').hidden = st.type !== 'steun';
    $('inkl').hidden = st.type !== 'inkl';
  }
  $('type').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.type = b.dataset.id; kies(); teken(); });
  $('kant').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.kant = b.dataset.id; kies(); teken(); });

  /* ---------- belastingen-editor ---------- */
  function fac(key) { const u = E(); return key === 'F' ? u.cF : key === 'q' ? u.cF / u.cL : (key === 'x' || key === 's' || key === 'e') ? u.cL : 1; }
  function tekenLasten() {
    let nF = 0, nQ = 0;
    const veld = (l, key, label, min, max, step, eenh, metSchuif) => { const f = fac(key), sp = f === 1 ? step : 'any', spR = key === 'x' || key === 's' || key === 'e' ? (E().cL === 1 ? step : 10) : step * f; return `
      <div class="ctrl">
        <label for="dm-l${l.id}-${key}">${label}</label>
        <div class="rij">
          ${metSchuif ? `<input type="range" data-id="${l.id}" data-key="${key}" min="${min * f}" max="${max * f}" step="${spR}" value="${rondAf(l[key] * f)}" aria-label="${label}">` : ''}
          <input type="number" id="dm-l${l.id}-${key}" data-id="${l.id}" data-key="${key}" min="${min * f}" max="${max * f}" step="${sp}" value="${rondAf(l[key] * f)}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`; };
    const richting = l => `
      <div class="ctrl"><label for="dm-l${l.id}-dir">Richting</label>
        <select id="dm-l${l.id}-dir" data-id="${l.id}" data-key="dir">
          <option value="1" ${l.dir > 0 ? 'selected' : ''}>↓ naar omlaag</option>
          <option value="-1" ${l.dir < 0 ? 'selected' : ''}>↑ naar omhoog</option>
        </select></div>`;
    $('lasten').innerHTML = st.loads.length ? st.loads.map(l => {
      if (l.soort === 'F') {
        nF++;
        return `<div class="last">
          <div class="lkop"><b>F<sub>${nF}</sub></b><span>Puntkracht</span><button type="button" class="weg" data-del="${l.id}" aria-label="Verwijder F${nF}">Verwijderen</button></div>
          <div class="lrij">${richting(l)}${veld(l, 'F', 'Grootte', 0, 100, 0.5, E().uF, false)}${veld(l, 'x', 'Positie x', 0, st.L, 0.1, E().uL, true)}</div></div>`;
      }
      nQ++;
      return `<div class="last">
        <div class="lkop"><b>q<sub>${nQ}</sub></b><span>Gelijkmatig verdeelde belasting</span><button type="button" class="weg" data-del="${l.id}" aria-label="Verwijder q${nQ}">Verwijderen</button></div>
        <div class="lrij">${richting(l)}${veld(l, 'q', 'Grootte', 0, 50, 0.5, E().uq, false)}${veld(l, 's', 'Begint op', 0, st.L, 0.1, E().uL, true)}${veld(l, 'e', 'Eindigt op', 0, st.L, 0.1, E().uL, true)}</div></div>`;
    }).join('') : '<div class="leeg">Nog geen belastingen. Voeg een puntkracht of een verdeelde belasting toe.</div>';
  }
  $('lasten').addEventListener('input', e => {
    const t = e.target, key = t.dataset.key; if (!key) return;
    const l = st.loads.find(x => x.id === +t.dataset.id); if (!l) return;
    if (key === 'dir') { l.dir = +t.value; teken(); return; }
    let v = parseFloat(String(t.value).replace(',', '.')); if (!isFinite(v)) return;
    v = Math.min(+t.max, Math.max(+t.min, v));
    l[key] = v / fac(key);
    root.querySelectorAll(`#dm-lasten [data-id="${l.id}"][data-key="${key}"]`).forEach(o => { if (o !== t) o.value = v; });
    teken();
  });
  $('lasten').addEventListener('change', e => {
    const t = e.target; if (t.type !== 'number') return;
    const l = st.loads.find(x => x.id === +t.dataset.id); if (l) t.value = rondAf(l[t.dataset.key] * fac(t.dataset.key));
  });
  $('lasten').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    st.loads = st.loads.filter(l => l.id !== +b.dataset.del); tekenLasten(); teken();
  });
  // reset: alle belastingen verwijderen (ligger blijft zoals ingesteld)
  $('reset').addEventListener('click', () => { st.loads = []; tekenLasten(); teken(); });
  $('addF').addEventListener('click', () => { st.loads.push({ id: st.volg++, soort: 'F', dir: 1, F: 10, x: Math.round(st.L * 5) / 10 }); tekenLasten(); teken(); });
  $('addQ').addEventListener('click', () => { st.loads.push({ id: st.volg++, soort: 'q', dir: 1, q: 5, s: 0, e: st.L }); tekenLasten(); teken(); });

  /* ---------- rekenen ---------- */
  function bereken() {
    const L = st.L, kl = v => Math.min(L, Math.max(0, v));
    const P = [], Q = [];
    let nF = 0, nQ = 0;
    st.loads.forEach(l => {
      if (l.soort === 'F') { nF++; P.push({ x: kl(l.x), P: -l.dir * l.F, naam: 'F', nr: nF, F: l.F, dir: l.dir }); }
      else {
        nQ++;
        const s = kl(Math.min(l.s, l.e)), e = kl(Math.max(l.s, l.e));
        Q.push({ s, e, q: l.dir * l.q, nr: nQ, mag: l.q, dir: l.dir, leeg: e - s < eps });
      }
    });
    const Qa = Q.filter(q => !q.leeg);
    const W = P.reduce((t, p) => t - p.P, 0) + Qa.reduce((t, q) => t + q.q * (q.e - q.s), 0);
    const momOm = x0 => P.reduce((t, p) => t + (-p.P) * (p.x - x0), 0) + Qa.reduce((t, q) => t + q.q * (q.e - q.s) * ((q.s + q.e) / 2 - x0), 0);
    const res = { P: P.slice(), Q, W, reac: {}, fout: null };
    const bp = [0, L];
    const Pall = P.slice();
    if (st.type === 'steun') {
      const a = kl(st.xA), b = kl(st.xB);
      if (Math.abs(b - a) < eps) { res.fout = 'De twee steunpunten liggen op dezelfde plaats. Schuif steunpunt A of B opzij.'; return res; }
      const RB = momOm(a) / (b - a), RA = W - RB;
      Pall.push({ x: a, P: RA }, { x: b, P: RB });
      res.reac = { RA, RB, a, b };
      bp.push(a, b);
    } else if (st.kant === 'links') {
      Pall.push({ x: 0, P: W });
      res.reac = { R: W, xR: 0 };
    } else res.reac = { R: W, xR: L };
    P.forEach(p => bp.push(p.x)); Qa.forEach(q => bp.push(q.s, q.e));
    bp.sort((a, b) => a - b);
    const pts = bp.filter((v, i) => i === 0 || v - bp[i - 1] > eps);
    const iv = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], xm = (a + b) / 2;
      let d0 = 0, d1 = 0, m0 = 0, m1 = 0, m2 = 0;
      Pall.forEach(p => { if (p.x < xm) { d0 += p.P; m0 -= p.P * p.x; m1 += p.P; } });
      Qa.forEach(q => {
        if (q.s >= xm) return;
        if (q.e <= xm) { const R = q.q * (q.e - q.s), c = (q.s + q.e) / 2; d0 -= R; m0 += R * c; m1 -= R; }
        else { d0 += q.q * q.s; d1 -= q.q; m2 -= q.q / 2; m1 += q.q * q.s; m0 -= q.q * q.s * q.s / 2; }
      });
      iv.push({ a, b, d0, d1, m0, m1, m2 });
    }
    const Mpol = (v, x) => v.m0 + v.m1 * x + v.m2 * x * x;
    if (st.type === 'inkl') {
      const last = iv[iv.length - 1];
      if (st.kant === 'links') { const C = -Mpol(last, L); iv.forEach(v => { v.m0 += C; }); res.reac.Mk = C; }
      else res.reac.Mk = Mpol(last, L);
    }
    res.iv = iv;
    return res;
  }
  const Dv = (v, x) => v.d0 + v.d1 * x;
  const Mv = (v, x) => v.m0 + v.m1 * x + v.m2 * x * x;
  const zoek = (iv, x) => iv.find((v, i) => x >= v.a - eps && (x < v.b - eps || i === iv.length - 1)) || iv[iv.length - 1];

  function polyTekst(c2, c1, c0) {
    const t = [];
    const add = (c, v) => {
      const r = c;
      if (Math.abs(r) < 1e-9) return;
      const abs = Math.abs(r);
      t.push({ neg: r < 0, s: (v && Math.abs(abs - 1) < 1e-6 ? '' : fmtS(abs)) + v });
    };
    add(c2, 'x²'); add(c1, 'x'); add(c0, '');
    if (!t.length) return '0';
    return t.map((p, i) => i === 0 ? (p.neg ? '−' : '') + p.s : (p.neg ? ' − ' : ' + ') + p.s).join('');
  }
  const r2 = c => Math.round(c * 100) / 100;
  function samenvoegen(iv, sleutel) {
    const uit = [];
    iv.forEach(v => {
      const k = sleutel(v).map(r2).join('|');
      const vorige = uit[uit.length - 1];
      if (vorige && vorige.k === k) vorige.b = v.b; else uit.push({ ...v, k });
    });
    return uit;
  }

  /* ---------- tekenen ---------- */
  const MR = 34, mL = () => (st.uF === 'N' && st.uL === 'mm') ? 96 : 58;
  function teken() {
    const K = { fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel'), vul: css('--panel-2'), reac: css('--meet'), d: css('--b'), m: css('--a') };
    const L = st.L;
    const res = bereken();

    /* Ligger */
    {
      const { ctx, w, h } = prepCanvas(cvB);
      const ML = mL(), pw = w - ML - MR, X = x => ML + x / L * pw;
      const yb0 = 104, yb1 = 116, ymid = (yb0 + yb1) / 2;
      const f12 = '500 12px ' + css('--f-mono');
      const tekst = (t, x, y, kleur, uitlijn = 'center') => {
        ctx.font = f12; const tw = ctx.measureText(t).width;
        const x0 = uitlijn === 'center' ? x - tw / 2 : uitlijn === 'right' ? x - tw : x;
        const xc = Math.min(Math.max(x0, 2), w - tw - 2);
        ctx.fillStyle = K.bg; ctx.fillRect(xc - 3, y - 8, tw + 6, 16);
        ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, xc, y);
      };
      // maatas
      const yAs = h - 20;
      ctx.font = '11px ' + css('--f-mono');
      const stap = L > 8 ? 2 : L > 3 ? 1 : 0.5;
      ctx.strokeStyle = K.axis; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(0), yAs - 8); ctx.lineTo(X(L), yAs - 8); ctx.stroke();
      for (let x = 0; x <= L + eps; x += stap) {
        ctx.beginPath(); ctx.moveTo(X(x), yAs - 12); ctx.lineTo(X(x), yAs - 4); ctx.stroke();
        ctx.fillStyle = K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(fmtS(E().L(x)), X(x), yAs - 2);
      }
      ctx.fillStyle = K.fg; ctx.font = '600 12px ' + css('--f-mono'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(`x (${E().uL})`, w - 2, yAs - 14); ctx.font = '11px ' + css('--f-mono');
      // balk
      ctx.fillStyle = K.vul; ctx.fillRect(X(0), yb0, pw, yb1 - yb0);
      ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5; ctx.strokeRect(X(0), yb0, pw, yb1 - yb0);

      // verdeelde belastingen
      res.Q.forEach(q => {
        if (q.leeg) return;
        const omlaag = q.dir > 0;
        const yL = omlaag ? yb0 - 36 : yb1 + 36, yK = omlaag ? yb0 - 2 : yb1 + 2;
        ctx.fillStyle = K.fg; ctx.globalAlpha = 0.07;
        ctx.fillRect(X(q.s), Math.min(yL, yK), X(q.e) - X(q.s), Math.abs(yK - yL)); ctx.globalAlpha = 1;
        ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(X(q.s), yL); ctx.lineTo(X(q.e), yL); ctx.stroke();
        const n = Math.max(1, Math.round((X(q.e) - X(q.s)) / 20));
        for (let i = 0; i <= n; i++) { const xx = X(q.s) + (X(q.e) - X(q.s)) * i / n; pijl(ctx, xx, yL, xx, yK, K.fg, 1.2); }
        tekst(`q${sub(q.nr)} = ${fmtS(E().q(q.mag))} ${E().uq}`, (X(q.s) + X(q.e)) / 2, omlaag ? yL - 12 : yL + 12, K.fg);
      });
      // opleggingen + reacties
      if (!res.fout) {
        if (st.type === 'steun') {
          const { a, b, RA, RB } = res.reac;
          ctx.fillStyle = K.fg; ctx.strokeStyle = K.fg; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(X(a), yb1); ctx.lineTo(X(a) - 9, yb1 + 15); ctx.lineTo(X(a) + 9, yb1 + 15); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(X(b), yb1); ctx.lineTo(X(b) - 9, yb1 + 12); ctx.lineTo(X(b) + 9, yb1 + 12); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.arc(X(b) - 4, yb1 + 15, 2.6, 0, 7); ctx.arc(X(b) + 4, yb1 + 15, 2.6, 0, 7); ctx.fill();
          [[a, yb1 + 16], [b, yb1 + 18]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(X(x) - 13, y); ctx.lineTo(X(x) + 13, y); ctx.stroke(); });
          [['A', a, RA], ['B', b, RB]].forEach(([nm, x, R]) => {
            const y1 = yb1 + 66, y2 = yb1 + 24;
            if (Math.abs(R) > 1e-6) {
              if (R > 0) pijl(ctx, X(x) + 14, y1, X(x) + 14, y2, K.reac, 2.2); else pijl(ctx, X(x) + 14, y2, X(x) + 14, y1, K.reac, 2.2);
            }
            ctx.font = '600 12px ' + css('--f-mono'); ctx.fillStyle = K.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(nm, X(x) - 12, yb1 + 30);
            indexLabel(ctx, Math.min(Math.max(X(x) + 14, 70), w - 70), yb1 + 76, 'R', nm, ' = ' + fmtS(E().F(Math.abs(R))) + ' ' + E().uF, K.reac, K.bg);
          });
        } else {
          const links = st.kant === 'links', xw = links ? X(0) : X(L);
          ctx.fillStyle = K.axis; ctx.fillRect(links ? xw - 12 : xw, yb0 - 34, 12, yb1 - yb0 + 68);
          ctx.strokeStyle = K.fg; ctx.lineWidth = 1;
          for (let y = yb0 - 34; y < yb1 + 34; y += 7) { const xr = links ? xw - 12 : xw + 12; ctx.beginPath(); ctx.moveTo(xr, y); ctx.lineTo(xr + (links ? -6 : 6), y + 6); ctx.stroke(); }
          ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xw, yb0 - 34); ctx.lineTo(xw, yb1 + 34); ctx.stroke();
          const { R, Mk } = res.reac;
          const xr = links ? xw + 16 : xw - 16;
          if (Math.abs(R) > 1e-6) { if (R > 0) pijl(ctx, xr, yb1 + 66, xr, yb1 + 6, K.reac, 2.2); else pijl(ctx, xr, yb1 + 6, xr, yb1 + 66, K.reac, 2.2); }
          tekst(`R = ${fmtS(E().F(Math.abs(R)))} ${E().uF}`, xr, yb1 + 76, K.reac, links ? 'left' : 'right');
          if (Math.abs(Mk) > 1e-6) {
            // inklemmingsmoment als gebogen pijl
            const cx = xw, r = 30;
            const cw = links ? Mk > 0 : Mk > 0 ? false : true; // wijzerzin op het scherm
            const a0 = links ? -1.15 : Math.PI - 1.15, a1 = links ? 1.15 : Math.PI + 1.15;
            const [s, e] = links ? (cw ? [a0, a1] : [a1, a0]) : (cw ? [a0, a1] : [a1, a0]);
            ctx.strokeStyle = K.reac; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, ymid, r, Math.min(s, e), Math.max(s, e)); ctx.stroke();
            const ex = cx + r * Math.cos(e), ey = ymid + r * Math.sin(e);
            const tang = e > s ? e + Math.PI / 2 : e - Math.PI / 2;
            ctx.fillStyle = K.reac; ctx.beginPath(); ctx.moveTo(ex + 8 * Math.cos(tang), ey + 8 * Math.sin(tang));
            ctx.lineTo(ex + 5 * Math.cos(tang + 2.2), ey + 5 * Math.sin(tang + 2.2));
            ctx.lineTo(ex + 5 * Math.cos(tang - 2.2), ey + 5 * Math.sin(tang - 2.2)); ctx.closePath(); ctx.fill();
            tekst(`M = ${fmtS(E().M(Math.abs(Mk)))} ${E().uM}`, links ? xw + 40 : xw - 40, yb0 - 46, K.reac, links ? 'left' : 'right');
          }
        }
      }
      // puntkrachten
      res.P.forEach(p => {
        const omlaag = p.dir > 0, xx = X(p.x);
        if (omlaag) pijl(ctx, xx, yb0 - 70, xx, yb0 - 2, K.fg, 2.4); else pijl(ctx, xx, yb1 + 70, xx, yb1 + 2, K.fg, 2.4);
        tekst(`F${sub(p.nr)} = ${fmtS(E().F(p.F))} ${E().uF}`, xx, omlaag ? yb0 - 80 : yb1 + 80, K.fg);
      });
      // doorsnede
      if (st.hover != null) {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = K.muted; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(st.hover), 6); ctx.lineTo(X(st.hover), yAs - 12); ctx.stroke(); ctx.setLineDash([]);
      }
    }

    /* D- en M-lijn */
    const lijn = (cv, soort) => {
      const { ctx, w, h } = prepCanvas(cv);
      const ML = mL(), pw = w - ML - MR, X = x => ML + x / L * pw;
      if (res.fout) {
        ctx.font = '500 13px ' + css('--f-body'); ctx.fillStyle = K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(res.fout, w / 2, h / 2); return;
      }
      const iv = res.iv, isD = soort === 'D';
      const f = isD ? Dv : Mv, kleur = isD ? K.d : K.m;
      // waarden voor de schaal en labels
      const vals = [0], labels = [];
      iv.forEach(v => {
        const va = f(v, v.a), vb = f(v, v.b);
        vals.push(va, vb);
        if (isD) {
          if (Math.abs(v.d1) < 1e-9) labels.push({ x: (v.a + v.b) / 2, v: va });
          else { labels.push({ x: v.a, v: va, kant: 1 }); labels.push({ x: v.b, v: vb, kant: -1 }); }
        } else {
          labels.push({ x: v.a, v: va }); labels.push({ x: v.b, v: vb });
          if (Math.abs(v.m2) > 1e-9) {
            const xs = -v.m1 / (2 * v.m2);
            if (xs > v.a + 1e-6 && xs < v.b - 1e-6) { const vs = f(v, xs); vals.push(vs); labels.push({ x: xs, v: vs, top: true }); }
          }
        }
      });
      const R = niceRange(Math.min(...vals), Math.max(...vals));
      const y0 = 30, y1 = h - 30;
      const Y = v => y0 + (R.max - v) / (R.max - R.min) * (y1 - y0);
      ctx.font = '11px ' + css('--f-mono'); ctx.lineWidth = 1;
      for (let i = Math.ceil(R.min / R.step - 1e-9); i * R.step <= R.max + 1e-9; i++) {
        const v = i * R.step;
        ctx.strokeStyle = K.grid; ctx.beginPath(); ctx.moveTo(X(0), Y(v) + .5); ctx.lineTo(X(L), Y(v) + .5); ctx.stroke();
        ctx.fillStyle = K.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(fmtS(isD ? E().F(v) : E().M(v)), X(0) - 8, Y(v));
      }
      const stap = L > 8 ? 2 : L > 3 ? 1 : 0.5;
      for (let x = 0; x <= L + eps; x += stap) {
        ctx.strokeStyle = K.grid; ctx.beginPath(); ctx.moveTo(X(x) + .5, y0); ctx.lineTo(X(x) + .5, y1); ctx.stroke();
        ctx.fillStyle = K.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(fmtS(E().L(x)), X(x), y1 + 6);
      }
      ctx.strokeStyle = K.axis; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(L) + 12, Y(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), y1); ctx.lineTo(X(0), y0 - 8); ctx.stroke();
      ctx.fillStyle = K.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = '600 13px ' + css('--f-mono');
      ctx.fillText(isD ? `D (${E().uF})` : `M (${E().uM})`, X(0) + 8, y0 - 10);
      ctx.textAlign = 'right'; ctx.fillText(`x (${E().uL})`, w - 2, Y(0) - 8);
      ctx.font = '11px ' + css('--f-mono');
      // kromme
      const pad = sluiten => {
        ctx.beginPath();
        if (sluiten) ctx.moveTo(X(0), Y(0));
        iv.forEach((v, i) => {
          const n = Math.abs(v.m2) > 1e-9 && !isD ? 40 : 1;
          for (let k = 0; k <= n; k++) {
            const x = v.a + (v.b - v.a) * k / n, px = X(x), py = Y(f(v, x));
            if (!sluiten && i === 0 && k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
        });
        if (sluiten) { ctx.lineTo(X(L), Y(0)); ctx.closePath(); }
      };
      pad(true); ctx.fillStyle = kleur; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1;
      // verticale sprongen aan de uiteinden
      pad(false); ctx.strokeStyle = kleur; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(f(iv[0], 0)));
      ctx.moveTo(X(L), Y(0)); ctx.lineTo(X(L), Y(f(iv[iv.length - 1], L))); ctx.stroke();
      // labels
      const geplaatst = [];
      ctx.font = '600 11px ' + css('--f-mono');
      labels.forEach(lb => {
        if (Math.abs(lb.v) < 0.005) return;
        const t = fmtS(isD ? E().F(lb.v) : E().M(lb.v));
        const tw = ctx.measureText(t).width;
        let x = X(lb.x) + (lb.kant === 1 ? 4 : lb.kant === -1 ? -4 - tw : -tw / 2);
        x = Math.min(Math.max(x, ML + 2), w - tw - 2);
        const y = Y(lb.v) + (lb.v >= 0 ? -10 : 12);
        if (geplaatst.some(g => Math.abs(g.x - x) < (g.w + tw) / 2 + 4 && Math.abs(g.y - y) < 14)) return;
        geplaatst.push({ x, y, w: tw });
        ctx.fillStyle = K.bg; ctx.fillRect(x - 2, y - 7, tw + 4, 14);
        ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
        if (lb.top) { ctx.beginPath(); ctx.arc(X(lb.x), Y(lb.v), 3.5, 0, 7); ctx.fill(); }
      });
      // aflezen met de muis
      if (st.hover != null) {
        const xh = st.hover, v = zoek(iv, xh), val = f(v, xh), px = X(xh), py = Y(val);
        ctx.setLineDash([4, 4]); ctx.strokeStyle = K.fg; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, y0 - 8); ctx.lineTo(px, y1); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
        ctx.fillStyle = kleur; ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fill();
        ctx.strokeStyle = K.bg; ctx.lineWidth = 2; ctx.stroke();
        const t1 = 'x = ' + fmtS(E().L(xh)) + ' ' + E().uL, t2 = (isD ? 'D = ' : 'M = ') + fmtS(isD ? E().F(val) : E().M(val)) + ' ' + (isD ? E().uF : E().uM);
        ctx.font = '600 12px ' + css('--f-mono');
        const bw = Math.max(ctx.measureText(t1).width, ctx.measureText(t2).width) + 16, bh = 40;
        let bx = px + 12; if (bx + bw > w - 4) bx = px - 12 - bw;
        let by = Math.min(Math.max(py - bh - 10, 4), h - bh - 4);
        ctx.fillStyle = K.vul; ctx.strokeStyle = kleur; ctx.lineWidth = 1;
        ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx + .5, by + .5, bw - 1, bh - 1);
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillStyle = K.muted; ctx.font = '500 11px ' + css('--f-mono'); ctx.fillText(t1, bx + 8, by + 13);
        ctx.fillStyle = kleur; ctx.font = '600 12px ' + css('--f-mono'); ctx.fillText(t2, bx + 8, by + 28);
      }
    };
    lijn(cvD, 'D');
    lijn(cvM, 'M');

    /* Teksten */
    $('noot').textContent = `x in ${E().uL} (gemeten vanaf het linkeruiteinde), D in ${E().uF}, M in ${E().uM}.`;
    if (res.fout) {
      $('rr').textContent = '—'; $('nr').textContent = res.fout; $('ru').textContent = '—';
      $('fvD').innerHTML = ''; $('fvM').innerHTML = '';
      return;
    }
    const pijlT = R => R >= 0 ? '↑' : '↓';
    if (st.type === 'steun') {
      const { RA, RB } = res.reac;
      $('rr').innerHTML = `R<sub>A</sub> = <b class="c-m">${fmtS(E().F(Math.abs(RA)))} ${E().uF}</b> ${pijlT(RA)}<br>R<sub>B</sub> = <b class="c-m">${fmtS(E().F(Math.abs(RB)))} ${E().uF}</b> ${pijlT(RB)}`;
      $('nr').textContent = 'Uit ΣM = 0 rond A volgt R_B, daarna uit ΣF = 0 volgt R_A.' + ((RA < -1e-9 || RB < -1e-9) ? ' Een reactie naar omlaag betekent dat de oplegging de ligger moet tegenhouden om niet op te tillen.' : '');
    } else {
      const { R, Mk } = res.reac;
      $('rr').innerHTML = `R = <b class="c-m">${fmtS(E().F(Math.abs(R)))} ${E().uF}</b> ${pijlT(R)}<br>M<sub>inklemming</sub> = <b class="c-m">${fmtS(E().M(Mk))} ${E().uM}</b>`;
      $('nr').textContent = `De inklemming neemt zowel een kracht als een moment op. Het moment in de ligger aan de inklemming is ${fmtS(E().M(Mk))} ${E().uM}.`;
    }
    // uitersten
    let dMax = { v: 0, x: 0 }, mMax = { v: -Infinity, x: 0 }, mMin = { v: Infinity, x: 0 };
    res.iv.forEach(v => {
      [v.a + 1e-9, v.b - 1e-9].forEach(x => { const d = Dv(v, x); if (Math.abs(d) > Math.abs(dMax.v) + 1e-9) dMax = { v: d, x }; });
      const kand = [v.a, v.b];
      if (Math.abs(v.m2) > 1e-9) { const xs = -v.m1 / (2 * v.m2); if (xs > v.a && xs < v.b) kand.push(xs); }
      kand.forEach(x => { const m = Mv(v, x); if (m > mMax.v) mMax = { v: m, x }; if (m < mMin.v) mMin = { v: m, x }; });
    });
    const rx = x => fmtS(E().L(Math.round(x * 1000) / 1000)) + ' ' + E().uL;
    $('ru').innerHTML =
      `|D|<sub>max</sub> = <b style="color:var(--b)">${fmtS(E().F(Math.abs(dMax.v)))} ${E().uF}</b> bij x = ${rx(dMax.x)}<br>` +
      (mMax.v > 0.005 ? `M<sub>max</sub> = <b class="c-a">${fmtS(E().M(mMax.v))} ${E().uM}</b> bij x = ${rx(mMax.x)}<br>` : '') +
      (mMin.v < -0.005 ? `M<sub>min</sub> = <b class="c-a">${fmtS(E().M(mMin.v))} ${E().uM}</b> bij x = ${rx(mMin.x)}` : '');

    // functievoorschriften
    const Dst = samenvoegen(res.iv, v => [v.d0, v.d1]);
    const Mst = samenvoegen(res.iv, v => [v.m0, v.m1, v.m2]);
    const blok = (naam, stukken, f, dom) => `
      <div class="voorschrift"><span class="vnaam">${naam}(x) =</span>
        <div class="stukken">${stukken.map(v => `<span class="vf">${f(v)}</span><span class="vd">${dom(v)}</span>`).join('')}</div></div>`;
    const u = E();
    $('fvD').innerHTML = blok('D', Dst, v => polyTekst(0, v.d1 * u.cF / u.cL, v.d0 * u.cF), v => `voor ${fmtS(u.L(v.a))} &lt; x &lt; ${fmtS(u.L(v.b))}`);
    $('fvM').innerHTML = blok('M', Mst, v => polyTekst(v.m2 * u.cF / u.cL, v.m1 * u.cF, v.m0 * u.cF * u.cL), v => `voor ${fmtS(u.L(v.a))} ≤ x ≤ ${fmtS(u.L(v.b))}`);
  }
  function sub(t) { return String(t).replace(/[0-9]/g, c => '₀₁₂₃₄₅₆₇₈₉'[c]); }

  kies();
  tekenLasten();
  const ro = new ResizeObserver(() => teken());
  [cvB, cvD, cvM].forEach(c => ro.observe(c));
  // muis of vinger over de D- of M-lijn: waarde aflezen
  [cvD, cvM].forEach(cv => {
    const zet = e => {
      const r = cv.getBoundingClientRect(), pw = r.width - ML - MR;
      const xm = (e.clientX - r.left - ML) / pw * st.L;
      const nieuw = (xm < -0.02 * st.L || xm > 1.02 * st.L) ? null : Math.min(st.L, Math.max(0, Math.round(xm * 100) / 100));
      if (nieuw !== st.hover) { st.hover = nieuw; teken(); }
    };
    cv.addEventListener('pointermove', zet);
    cv.addEventListener('pointerdown', zet);
    cv.addEventListener('pointerleave', () => { if (st.hover != null) { st.hover = null; teken(); } });
  });
  teken();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(teken);
  return () => ro.disconnect();
}

/* ============================================================
   APPLET: Coördinaten en positievectoren (3TEW)
   Vlak: 5 oefeningen op een rooster + 5 oefeningen met maataanduiding.
   Ruimte: 5 isometrische werkstukken met maataanduiding. Alle maten in mm.
   ============================================================ */
function renderCoord(root) {
  const R = 6; // straal van de gaten bij de maatoefeningen (mm)

  /* --- vlak, op een rooster (coördinaten in vakjes, u = mm per vakje) --- */
  const RASTER = [
    { soort: 'raster', u: 25, wat: 'hoekpunten',
      pad: [[-4, 4, 'A'], [2, 4, 'B'], { boog: [4, 2], c: [2, 2], naam: 'C' }, [4, -3, 'D'], [-2, -3, 'E'], [-4, -1, 'F']],
      gaten: [[1, 1, 0.6]] },
    { soort: 'raster', u: 10, wat: 'hoekpunten',
      pad: [[-6, 4, 'A'], [-1, 4, 'B'], [-1, 1, 'C'], [5, 1, 'D'], [5, -3, 'E'], [-6, -3, 'F']],

    { soort: 'raster', u: 20, wat: 'hoekpunten',

      gaten: [[-1, 2, 0.6]] },
    { soort: 'raster', u: 5, wat: 'hoekpunten',
      pad: [[-8, -4, 'A'], [6, -4, 'B'], [6, 5, 'C'], [1, 5, 'D'], [-2, 2, 'E'], [-8, 2, 'F']],

    { soort: 'raster', u: 12.5, wat: 'hoekpunten',

      gaten: [[2, 1, 0.6]] }
  ];
  /* --- vlak, met maatkettingen (middelpunten van gaten) --- */
  const MATEN = [
    { soort: 'maten', poly: [[-50, -50], [90, -50], [90, 30], [50, 70], [-50, 70]],
      pts: { A: [-30, 50], B: [20, 40], C: [65, 15], D: [-15, -30], E: [40, -20] } },

  /* --- ruimte: prisma's. vlak 'xy' = profiel (x,y), uitgetrokken langs z; 'zy' = profiel (z,y), uitgetrokken langs x --- */
  const RUIMTE = [

  // punten van de rasteroefeningen omzetten naar mm
  RASTER.forEach(o => {

  });
  const VLAK = [...RASTER, ...MATEN];
  const st = { soort: 'vlak', idx: 0 };
  const lijst = () => st.soort === 'vlak' ? VLAK : RUIMTE;

  root.innerHTML = `
  <div class="erb">
    <div class="paneel co-kop">
      <div class="kolom co-kopl">
        <h2>Oefeningen</h2>
        <div class="chips" id="co-soort">

      </div>

    </div>
    <div class="co-lay">
      <div class="paneel"><div class="co-fig" id="co-fig"></div></div>

  </div>`;
  const $ = id => root.querySelector('#co-' + id);
  const uniek = arr => [...new Set(arr.map(v => Math.round(v * 1000) / 1000))].sort((a, b) => a - b);
  const pijlkop = (x, y, dx, dy, cls = 'co-mp') => {
    const l = 8, b = 3;
    return `<polygon class="${cls}" points="${x},${y} ${x - dx * l - dy * b},${y - dy * l + dx * b} ${x - dx * l + dy * b},${y - dy * l - dx * b}"/>`;
  };
  const lijn = (x1, y1, x2, y2, cls) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
  const tekst = (x, y, t, extra = '') => `<text x="${x}" y="${y}" class="co-t" ${extra}>${t}</text>`;

  /* ---------- vlak met rooster ---------- */
  function tekenRaster(o) {
    const pts = o.pad.map(p => Array.isArray(p) ? p : [p.boog[0], p.boog[1], p.naam]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const gx0 = Math.min(...xs, 0) - 2, gx1 = Math.max(...xs, 0) + 3, gy0 = Math.min(...ys, 0) - 2, gy1 = Math.max(...ys, 0) + 2;
    const g = Math.min(620 / (gx1 - gx0), 380 / (gy1 - gy0));
    const L = 20, T = 20, W = (gx1 - gx0) * g + 2 * L, H = (gy1 - gy0) * g + 2 * T;
    const X = x => L + (x - gx0) * g, Y = y => T + (gy1 - y) * g;
    let svg = '';
    for (let x = gx0; x <= gx1; x++) svg += lijn(X(x), Y(gy0), X(x), Y(gy1), 'co-rooster');
    for (let y = gy0; y <= gy1; y++) svg += lijn(X(gx0), Y(y), X(gx1), Y(y), 'co-rooster');
    // werkstuk
    let d = '';
    o.pad.forEach((p, i) => {
      if (Array.isArray(p)) d += (i ? 'L' : 'M') + X(p[0]) + ' ' + Y(p[1]) + ' ';
      else {
        const prev = o.pad[i - 1], s0 = Array.isArray(prev) ? prev : prev.boog;
        const sx = X(s0[0]) - X(p.c[0]), sy = Y(s0[1]) - Y(p.c[1]), ex = X(p.boog[0]) - X(p.c[0]), ey = Y(p.boog[1]) - Y(p.c[1]);
        const r = Math.hypot(sx, sy), sweep = (sx * ey - sy * ex) > 0 ? 1 : 0;
        d += `A${r} ${r} 0 0 ${sweep} ${X(p.boog[0])} ${Y(p.boog[1])} `;
      }
    });
    svg += `<path d="${d}Z" class="co-plaat"/>`;
    (o.gaten || []).forEach(([x, y, r]) => { svg += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r * g}" class="co-gat"/>`; });
    // assen
    svg += lijn(X(gx0), Y(0), X(gx1) - 2, Y(0), 'co-as') + pijlkop(X(gx1), Y(0), 1, 0, 'co-ap');
    svg += tekst(X(gx1) - 6, Y(0) - 10, 'x', 'class="co-t co-asnaam" text-anchor="end"');
    svg += lijn(X(0), Y(gy0), X(0), Y(gy1) + 2, 'co-as') + pijlkop(X(0), Y(gy1), 0, -1, 'co-ap');
    svg += tekst(X(0) - 10, Y(gy1) + 14, 'y', 'class="co-t co-asnaam" text-anchor="end"');
    svg += tekst(X(0) - 8, Y(0) + 18, 'O', 'class="co-t co-asnaam" text-anchor="end"');
    // schaal: maatgetal bij 2 vakjes

    svg += tekst(X(2), Y(0) + 20, fmt(2 * o.u), 'text-anchor="middle"');
    // hoekpunten
    const cx = xs.reduce((a, b) => a + b, 0) / xs.length, cy = ys.reduce((a, b) => a + b, 0) / ys.length;
    pts.forEach(([x, y, n]) => {
      if (!n) return;
      let dx = x - cx, dy = y - cy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      svg += `<circle cx="${X(x)}" cy="${Y(y)}" r="4" class="co-punt"/>`;
      svg += tekst(X(x) + dx * 18, Y(y) - dy * 18 + 5, n, 'class="co-t co-naam" text-anchor="middle"');
    });
    return `<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" role="img" aria-label="Werkstuk op een rooster">${svg}</svg>`;
  }

  function tekenMaten(o) {
    const xsP = o.poly.map(p => p[0]), ysP = o.poly.map(p => p[1]);
    const minx = Math.min(...xsP), maxx = Math.max(...xsP), miny = Math.min(...ysP), maxy = Math.max(...ysP);
    const pts = Object.entries(o.pts);
    const s = Math.min(600 / (maxx - minx), 330 / (maxy - miny));
    const L = 70, T = 56, Rm = 150, B = 112;
    const W = L + (maxx - minx) * s + Rm, H = T + (maxy - miny) * s + B;
    const X = x => L + (x - minx) * s, Y = y => T + (maxy - y) * s;
    const uniek = arr => [...new Set(arr.map(v => Math.round(v * 1000) / 1000))].sort((a, b) => a - b);
    const xs = uniek([minx, maxx, 0, ...pts.map(p => p[1][0])]);
    const ys = uniek([miny, maxy, 0, ...pts.map(p => p[1][1])]);
    let svg = '';
    const lijn = (x1, y1, x2, y2, cls) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
    const pijlkop = (x, y, dx, dy) => { // punt op (x,y), wijst in richting (dx,dy)

    };

    const maatV = (y1, y2, x, t) => lijn(x, y1, x, y2, 'co-m') + pijlkop(x, y1, 0, -1) + pijlkop(x, y2, 0, 1) +
      tekst(x - 6, (y1 + y2) / 2, t, `text-anchor="middle" transform="rotate(-90 ${x - 6} ${(y1 + y2) / 2})"`);

    // plaat
    svg += `<polygon class="co-plaat" points="${o.poly.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
    // maatketting onder de plaat (x-waarden)
    const yc = Y(miny) + 40, yo = yc + 32;
    xs.forEach(v => {
      const opV = pts.filter(p => Math.abs(p[1][0] - v) < 1e-6);
      const y0 = opV.length ? Math.max(...opV.map(p => Y(p[1][1]))) + R * s : (Math.abs(v) < 1e-9 ? Y(0) : Y(miny));
      svg += lijn(X(v), y0 + 2, X(v), (v === minx || v === maxx) ? yo + 6 : yc + 6, 'co-hulp');
    });
    for (let i = 0; i < xs.length - 1; i++) svg += maatH(X(xs[i]), X(xs[i + 1]), yc, fmt(xs[i + 1] - xs[i]));
    svg += maatH(X(minx), X(maxx), yo, fmt(maxx - minx));
    // maatketting rechts van de plaat (y-waarden)
    const xc = X(maxx) + 44, xo = xc + 34;
    ys.forEach(v => {
      const opV = pts.filter(p => Math.abs(p[1][1] - v) < 1e-6);
      const x0 = opV.length ? Math.max(...opV.map(p => X(p[1][0]))) + R * s : (Math.abs(v) < 1e-9 ? X(maxx) : X(maxx));
      svg += lijn(x0 + 2, Y(v), (v === miny || v === maxy) ? xo + 6 : xc + 6, Y(v), 'co-hulp');
    });
    for (let i = 0; i < ys.length - 1; i++) svg += maatV(Y(ys[i + 1]), Y(ys[i]), xc, fmt(ys[i + 1] - ys[i]));
    svg += maatV(Y(maxy), Y(miny), xo, fmt(maxy - miny));
    // assen
    const ax0 = X(Math.min(minx, 0)) - 24, ax1 = xo + 34;
    svg += lijn(ax0, Y(0), ax1, Y(0), 'co-as') + pijlkop(ax1 + 2, Y(0), 1, 0).replace('co-mp', 'co-ap');
    svg += tekst(ax1 - 4, Y(0) - 10, 'x', 'class="co-t co-asnaam" text-anchor="end"');
    const ay0 = Y(Math.min(miny, 0)) + 22, ay1 = Y(maxy) - 32;
    svg += lijn(X(0), ay0, X(0), ay1, 'co-as') + pijlkop(X(0), ay1 - 2, 0, -1).replace('co-mp', 'co-ap');
    svg += tekst(X(0) - 12, ay1 + 4, 'y', 'class="co-t co-asnaam" text-anchor="end"');

    // gaten
    pts.forEach(([naam, [x, y]]) => {
      const cx = X(x), cy = Y(y), r = R * s, e = r + 6;

      svg += lijn(cx - e, cy, cx + e, cy, 'co-hart') + lijn(cx, cy - e, cx, cy + e, 'co-hart');

    });
    return `<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" role="img" aria-label="Plaat met gaten en maataanduiding">${svg}</svg>`;
  }


  /* ---------- ruimte (isometrisch) ---------- */
  function tekenRuimte(o) {
    const s = 4, c = Math.cos(Math.PI / 6), sn = Math.sin(Math.PI / 6);
    const P = ([x, y, z]) => [(x - z) * c * s, (-y + (x + z) * sn) * s];
    const naar3D = (u, v, w) => o.vlak === 'xy' ? [u, v, w] : [w, v, u];
    const n = o.profiel.length;
    const vlakken = [];
    // zijvlakken met buitenwaartse normaal (profiel is tegen de klok in)
    for (let i = 0; i < n; i++) {
      const [u1, v1] = o.profiel[i], [u2, v2] = o.profiel[(i + 1) % n];
      const nu = v2 - v1, nv = -(u2 - u1);
      const norm = o.vlak === 'xy' ? [nu, nv, 0] : [0, nv, nu];
      vlakken.push({ pts: [naar3D(u1, v1, 0), naar3D(u2, v2, 0), naar3D(u2, v2, o.diep), naar3D(u1, v1, o.diep)], norm, soort: nv > 0 ? 'boven' : 'zij' });
    }
    const kap = o.profiel.map(([u, v]) => naar3D(u, v, o.diep));
    vlakken.push({ pts: kap, norm: o.vlak === 'xy' ? [0, 0, 1] : [1, 0, 0], soort: 'kap' });
    const zichtbaar = vlakken.filter(f => f.norm[0] + f.norm[1] + f.norm[2] > 1e-9);
    const diepte = f => f.pts.reduce((a, p) => a + p[0] + p[1] + p[2], 0) / f.pts.length;
    zichtbaar.sort((a, b) => diepte(a) - diepte(b));
    const alle = o.profiel.flatMap(([u, v]) => [naar3D(u, v, 0), naar3D(u, v, o.diep)]);
    const mx = Math.max(...alle.map(p => p[0])), my = Math.max(...alle.map(p => p[1])), mz = Math.max(...alle.map(p => p[2]));
    const asEind = { x: [mx + 40, 0, 0], y: [0, my + 25, 0], z: [0, 0, mz + 40] };
    let svg = '';
    const L2 = (a, b, cls) => { const [x1, y1] = P(a), [x2, y2] = P(b); return lijn(x1, y1, x2, y2, cls); };
    // vlakken
    zichtbaar.forEach(f => {
      const kl = f.soort === 'boven' ? 'co-v1' : f.soort === 'kap' ? 'co-v3' : 'co-v2';
      svg += `<polygon class="co-vlak ${kl}" points="${f.pts.map(p => P(p).join(',')).join(' ')}"/>`;
    });
    // assen binnen/achter het werkstuk: gestippeld (verborgen lijnen)
    svg += L2([0, 0, 0], [mx, 0, 0], 'co-as co-verborgen') + L2([0, 0, 0], [0, my, 0], 'co-as co-verborgen') + L2([0, 0, 0], [0, 0, mz], 'co-as co-verborgen');
    // assen buiten het werkstuk
    const asStuk = (van, tot, naam, dxl, dyl) => {
      const [x1, y1] = P(van), [x2, y2] = P(tot);
      const l = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / l, uy = (y2 - y1) / l;
      return lijn(x1, y1, x2 - ux * 2, y2 - uy * 2, 'co-as') + pijlkop(x2, y2, ux, uy, 'co-ap') + tekst(x2 + dxl, y2 + dyl, naam, 'class="co-t co-asnaam" text-anchor="middle"');
    };
    svg += asStuk([mx, 0, 0], asEind.x, 'x', 8, 18) + asStuk([0, my, 0], asEind.y, 'y', 12, 4) + asStuk([0, 0, mz], asEind.z, 'z', -8, 18);
    // maten
    o.maten.forEach(m => {
      const a2 = m.a.map((v, i) => v + m.off[i]), b2 = m.b.map((v, i) => v + m.off[i]);
      const a3 = m.a.map((v, i) => v + m.off[i] * 1.25), b3 = m.b.map((v, i) => v + m.off[i] * 1.25);
      svg += L2(m.a, a3, 'co-hulp') + L2(m.b, b3, 'co-hulp');
      const [x1, y1] = P(a2), [x2, y2] = P(b2);
      const l = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / l, uy = (y2 - y1) / l;
      svg += lijn(x1, y1, x2, y2, 'co-m') + pijlkop(x1, y1, -ux, -uy) + pijlkop(x2, y2, ux, uy);
      const [ox, oy] = (() => { const [p0x, p0y] = P([0, 0, 0]), [p1x, p1y] = P(m.off); const d = Math.hypot(p1x - p0x, p1y - p0y) || 1; return [(p1x - p0x) / d, (p1y - p0y) / d]; })();
      svg += tekst((x1 + x2) / 2 + ox * 13, (y1 + y2) / 2 + oy * 13 + 4, m.t, 'text-anchor="middle" class="co-t co-maat"');
    });
    // punten
    Object.entries(o.pts).forEach(([naam, p]) => {
      const [x, y] = P(p);
      svg += `<circle cx="${x}" cy="${y}" r="4" class="co-punt"/>`;
      svg += tekst(x - 10, y - 9, naam, 'class="co-t co-naam" text-anchor="middle"');
    });
    // viewBox uit alle getekende punten
    const xsS = [], ysS = [];
    const neem = p => { const [x, y] = P(p); xsS.push(x); ysS.push(y); };
    alle.forEach(neem); Object.values(asEind).forEach(neem);
    o.maten.forEach(m => { neem(m.a.map((v, i) => v + m.off[i] * 1.6)); neem(m.b.map((v, i) => v + m.off[i] * 1.6)); });
    const x0 = Math.min(...xsS) - 30, x1 = Math.max(...xsS) + 30, y0 = Math.min(...ysS) - 30, y1 = Math.max(...ysS) + 30;
    return `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${(x1 - x0).toFixed(1)} ${(y1 - y0).toFixed(1)}" role="img" aria-label="Werkstuk in de ruimte">${svg}</svg>`;
  }

  /* ---------- antwoordvelden ---------- */
  const vec = l => `<span class="vec${l === 'i' || l === 'j' ? ' punt' : l === 'k' ? ' hoog' : ''}">${l}</span>`;
  function velden(o) {
    const drie = o.soort === 'ruimte';
    const veld = (naam, k, label) => `<input class="co-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-p="${naam}" data-k="${k}" aria-label="${label}">`;
    return Object.keys(o.pts).map(n => `
      <div class="co-rij" data-rij="${n}">
        <span class="co-coord"><i>${n}</i>(${veld(n, 'x', 'x-coördinaat van ' + n)} ; ${veld(n, 'y', 'y-coördinaat van ' + n)}${drie ? ' ; ' + veld(n, 'z', 'z-coördinaat van ' + n) : ''})</span>
        <span class="co-vec"><span class="co-r">${vec('r')}<sub>${n}</sub> =</span> (${veld(n, 'rx', 'x-component van de positievector van ' + n)}) ${vec('i')} + (${veld(n, 'ry', 'y-component van de positievector van ' + n)}) ${vec('j')}${drie ? ` + (${veld(n, 'rz', 'z-component van de positievector van ' + n)}) ${vec('k')}` : ''}</span>
        <span class="co-hint" data-hint="${n}"></span>
      </div>`).join('');
  }

  function laad() {
    const o = lijst()[st.idx];
    root.querySelectorAll('#co-soort button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === st.soort)));
    $('nrs').innerHTML = lijst().map((x, i) => `<button type="button" class="sit co-nr" data-i="${i}" aria-pressed="${i === st.idx}">${i + 1}</button>`).join('');
    const komma = ' Gebruik een <b>komma</b> voor decimale getallen, bijvoorbeeld 12,5.';
    $('opgave').innerHTML = o.soort === 'raster'
      ? `Om dit werkstuk te maken met een waterstraalsnijder heb je de coördinaten van de hoekpunten nodig. Bepaal de coördinaten en de positievectoren van de hoekpunten. <b>1 vakje = ${fmt(o.u)} mm.</b>${komma}`
      : o.soort === 'maten'
        ? `Om de gaten in de plaat te maken met een lasersnijmachine heb je de positie van de middelpunten nodig. Bepaal de coördinaten en de positievectoren van de middelpunten. Alle maten zijn in mm.${komma}`
        : `Bepaal de coördinaten en de positievectoren van de punten ${Object.keys(o.pts).join(', ').replace(/, ([^,]*)$/, ' en $1')}. De oorsprong ligt in de achterste hoek, waar de drie assen samenkomen. Alle maten zijn in mm.`;
    root.querySelector('.co-lay').classList.toggle('ruimte', o.soort === 'ruimte');
    $('fig').innerHTML = o.soort === 'raster' ? tekenRaster(o) : o.soort === 'maten' ? tekenMaten(o) : tekenRuimte(o);
    $('antw').innerHTML = velden(o);
    $('score').textContent = '';
  }

  /* ---------- controleren ---------- */
  function lees(t) {
    const v = t.trim().replace(/[−–]/g, '-').replace(/\s+/g, '');
    if (v === '') return { leeg: true };
    if (v.includes('.')) return { punt: true };
    if (!/^[+-]?\d+(,\d+)?$/.test(v)) return { ongeldig: true };
    return { waarde: parseFloat(v.replace(',', '.')) };
  }
  function controleer() {
    const o = lijst()[st.idx];
    let goed = 0, totaal = 0;
    Object.entries(o.pts).forEach(([n, p]) => {
      const verwacht = { x: p[0], y: p[1], z: p[2], rx: p[0], ry: p[1], rz: p[2] };
      const meldingen = new Set();
      root.querySelectorAll(`.co-in[data-p="${n}"]`).forEach(inp => {
        totaal++;
        const r = lees(inp.value);
        inp.classList.remove('goed', 'fout');
        if (r.leeg) { inp.classList.add('fout'); meldingen.add('Vul alle velden in.'); return; }
        if (r.punt) { inp.classList.add('fout'); meldingen.add('Gebruik een komma in plaats van een punt.'); return; }
        if (r.ongeldig) { inp.classList.add('fout'); meldingen.add('Schrijf enkel een getal, bijvoorbeeld −12,5.'); return; }
        if (Math.abs(r.waarde - verwacht[inp.dataset.k]) < 1e-9) { inp.classList.add('goed'); goed++; }
        else inp.classList.add('fout');
      });
      root.querySelector(`[data-hint="${n}"]`).textContent = [...meldingen].join(' ');
    });
    $('score').innerHTML = goed === totaal
      ? `<b class="c-goed">Proficiat, alles is juist!</b> (${goed} van ${totaal})`
      : `<b>${goed} van ${totaal}</b> velden zijn juist. Verbeter de rode velden en controleer opnieuw.`;
  }
  function wis() {
    root.querySelectorAll('.co-in').forEach(inp => { inp.value = ''; inp.classList.remove('goed', 'fout'); });
    root.querySelectorAll('.co-hint').forEach(h => { h.textContent = ''; });
    $('score').textContent = '';
  }

  $('check').addEventListener('click', controleer);
  $('wis').addEventListener('click', wis);
  $('soort').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.s === st.soort) return; st.soort = b.dataset.s; st.idx = 0; laad(); });
  $('nrs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.idx = +b.dataset.i; laad(); } });
  $('antw').addEventListener('input', e => { if (e.target.classList.contains('co-in')) e.target.classList.remove('goed', 'fout'); });
  $('antw').addEventListener('keydown', e => { if (e.key === 'Enter') controleer(); });

  laad();
  return () => {};
}

/* ============================================================
   APPLET: Reactiekrachten berekenen van liggers (5TWE)
   Afspraak: x naar rechts +, y naar boven +, momenten in tegenwijzerzin (↺) +.
   Onbekende reacties worden aangenomen in positieve zin (Ax →, Ay ↑, By ↑, MA ↺).
   ============================================================ */
function renderReac(root) {
  const eps = 1e-9;
  const RICHT = {
    down: { t: '↓ verticaal omlaag', u: () => [0, -1] },
    up: { t: '↑ verticaal omhoog', u: () => [0, 1] },
    right: { t: '→ horizontaal naar rechts', u: () => [1, 0] },
    left: { t: '← horizontaal naar links', u: () => [-1, 0] },
    dr: { t: '↘ schuin omlaag, naar rechts', u: a => [Math.cos(a), -Math.sin(a)], schuin: true },
    dl: { t: '↙ schuin omlaag, naar links', u: a => [-Math.cos(a), -Math.sin(a)], schuin: true },
    ur: { t: '↗ schuin omhoog, naar rechts', u: a => [Math.cos(a), Math.sin(a)], schuin: true },
    ul: { t: '↖ schuin omhoog, naar links', u: a => [-Math.cos(a), Math.sin(a)], schuin: true }
  };
  const st = {
    type: 'steun', L: 5, xA: 0, xB: 5, kant: 'links', rond: 'A', opl: false, uF: 'kN', uL: 'm',
    loads: [],
    volg: 1
  };

  const ctrl = (id, label, min, max, step, eenh) => `

          <span class="eenh">${eenh}</span>
        </div>
      </div>`;

  root.innerHTML = `
  <div class="erb">
    <div class="dm-top">
      <div class="paneel bediening dm-ligger">
        <div class="groep">
          <div class="gkop">Ligger</div>
