<!doctype html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PneumaLab – pneumatische schakelingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe5e3;--panel:#f3f6f5;--paper:#fbfcfb;--ink:#1e2a32;--muted:#5f6e77;--line:#cdd6d3;--dot:#bfcac6;
  --accent:#1c6fe0;--accent-ink:#ffffff;--air:#1c6fe0;--airsoft:#a8c6ee;--cham:rgba(28,111,224,.17);--actbg:#edf3fc;
  --sel:#d9480f;--danger:#b42318;--btn:#ffffff;--signal:#f2b705;--sc-cyl:#e6ebee;--sc-rod:#cfd6db;--sc-frame:#5f6c75;--sc-metal:#b9c3c9;--sc-box:#d9a95e;--sc-belt:#3f484e;--sc-wood:#e2c99a;--sc-ground:#cdd5d1;--sc-wall:#d9d3c7;--sc-gate:#7a8a95;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1316;--panel:#151b1f;--paper:#11171a;--ink:#d6e0e4;--muted:#8b9aa1;--line:#28323a;--dot:#2a353b;
  --accent:#5a9cff;--accent-ink:#08111d;--air:#5a9cff;--airsoft:#2b4c78;--cham:rgba(90,156,255,.2);--actbg:#16263a;
  --sel:#ff8a3d;--danger:#ff6b5e;--btn:#1b2227;--signal:#f2b705;--sc-cyl:#28323a;--sc-rod:#58656e;--sc-frame:#7b8992;--sc-metal:#5f6c74;--sc-box:#a87a3a;--sc-belt:#1e2529;--sc-wood:#8c7550;--sc-ground:#232b2f;--sc-wall:#3a3631;--sc-gate:#5b6a74;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1316;--panel:#151b1f;--paper:#11171a;--ink:#d6e0e4;--muted:#8b9aa1;--line:#28323a;--dot:#2a353b;
  --accent:#5a9cff;--accent-ink:#08111d;--air:#5a9cff;--airsoft:#2b4c78;--cham:rgba(90,156,255,.2);--actbg:#16263a;
  --sel:#ff8a3d;--danger:#ff6b5e;--btn:#1b2227;--signal:#f2b705;--sc-cyl:#28323a;--sc-rod:#58656e;--sc-frame:#7b8992;--sc-metal:#5f6c74;--sc-box:#a87a3a;--sc-belt:#1e2529;--sc-wood:#8c7550;--sc-ground:#232b2f;--sc-wall:#3a3631;--sc-gate:#5b6a74;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
*{box-sizing:border-box}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-right:6px}
.brand svg{width:26px;height:26px}
button.brand{background:none;border:0;padding:2px 6px;border-radius:6px;color:var(--ink);font:inherit;font-weight:700;font-size:17px}
button.brand:hover{background:var(--btn)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--btn);box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:2}
.zoom button{border:0;border-radius:0;padding:6px 13px}
.zoom button+button{border-left:1px solid var(--line)}
.start{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.start[hidden]{display:none}
.sc{width:min(920px,100%)}
.st-h{text-align:center;margin-bottom:28px}
.st-h svg{width:54px;height:54px}
.st-h h1{font-size:36px;margin:6px 0 4px}
.st-h p{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;white-space:normal}
.card:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(0,0,0,.08)}
.card svg{width:100%;height:92px}
.card b{font-size:20px}
.card span{color:var(--muted);font-size:14px}
.start h2{font-size:26px;margin:0 0 16px}
.start .back{margin-bottom:16px}
.who2{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.sp{flex:1}
.grp{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.pi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--btn)}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.who{font-size:12px;color:var(--muted);margin-left:4px}
.main{display:grid;grid-template-columns:220px 1fr 270px;min-height:0}
aside{background:var(--panel);overflow:auto;padding:10px 12px}
#pal{border-right:1px solid var(--line)}
#props{border-left:1px solid var(--line)}
#pal h3{margin:0 0 2px}
.ph{display:flex;width:100%;align-items:center;gap:6px;background:none;border:0;border-radius:5px;padding:7px 4px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;white-space:normal}
.ph:hover{background:var(--btn)}
.ph i{font-style:normal;color:var(--muted);width:1em;flex:none}
.pgrid{margin:2px 0 10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid[hidden]{display:none}
.pi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:6px;cursor:grab;background:var(--paper);user-select:none;touch-action:none}
.pi:hover{border-color:var(--accent)}
.pi.wide{grid-column:span 2}
.pi svg{width:100%;height:46px;pointer-events:none}
.sym .hit,.sym .acthit{fill:transparent}
.pi .sym .ln,.pi .sym .box,.pi .sym .body,.pi .sym .src,.pi .sym .rod,.pi .sym .knop,.pi .sym .rol{stroke-width:2}
.pi span{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.sim #pal{opacity:.35;pointer-events:none}
#wrap{position:relative;overflow:hidden;background:var(--paper)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.panning{cursor:grabbing}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted);text-align:center;padding:20px}
.empty div{max-width:36ch}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
footer{padding:6px 12px;font-size:13px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
#props h2{font-size:17px;margin:2px 0 10px}
#props p{margin:0 0 10px;color:var(--muted);font-size:14px}
#props label{display:block;font-size:13px;color:var(--muted);margin:0 0 10px}
#props select,#props input{display:block;width:100%;margin-top:3px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--btn)}
#props .danger{color:var(--danger);margin-top:6px}
#props ul{margin:0 0 10px;padding-left:18px;color:var(--muted);font-size:14px}
#props li{margin-bottom:4px}
.leg{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
.leg i{display:inline-block;width:28px;height:0;border-top:3px solid var(--air)}
.leg i.s{border-top:2px solid var(--airsoft)}
.leg i.k{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:7px;background:var(--signal)}
kbd{font:12px system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--btn)}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.8;transform:translate(-50%,-50%)}
.ghost svg{display:block}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:90%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh b{font-size:17px}
.db{padding:14px 16px}
.db p{margin:0 0 10px;color:var(--muted)}
.db textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:6px;background:var(--btn);padding:6px;font:12px ui-monospace,Consolas,monospace}
.db input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--btn)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1}
.row .t small{display:block;color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.err{color:var(--danger);font-size:14px;min-height:1.2em}
/* symbols */
.sym .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.sym .fl{stroke:var(--ink);stroke-width:1.3}
.sym .ah{fill:var(--ink)}
.sym .ah.air{fill:var(--air)}
.sym .air{stroke:var(--air);stroke-width:2.4}
.sym .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.sym .box.act{fill:var(--actbg)}
.sym .exh{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.sym .pil{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.sym .pil.air{stroke:var(--air);stroke-width:2}
.sym .tri{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.sym .tri.on{fill:var(--air);stroke:var(--air)}
.sym .knop{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.sym .knop.on{fill:var(--signal)}
.sym .knop.lat{stroke:var(--sel);stroke-width:2.2}
.sym .rol{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.sym .rol.on{fill:var(--signal)}
.sym .body{fill:none;stroke:var(--ink);stroke-width:1.7}
.sym .cham{fill:var(--cham)}
.sym .rod{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.sym .piston{fill:var(--ink)}
.sym .src{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.sym .srct{fill:var(--ink)}
.sym .ball{fill:var(--ink)}
.sym .tick{stroke:var(--muted);stroke-width:1.4}
.sym .tick.on{stroke:var(--signal);stroke-width:3}
.sym .zone{fill:var(--accent);opacity:.4}
.sym .eln{stroke:var(--ink);stroke-width:1.4;fill:none}
.sym .eln.ep,.sym .rail.ep{stroke:#e03131}
.sym .rail{stroke:var(--ink);stroke-width:3}
.sym .dsh{stroke:var(--ink);stroke-width:1.1;stroke-dasharray:3 2;fill:none}
.sym .coil{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.sym .coil.on{fill:var(--signal)}
.sym .sbox{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.sym .sbox.on{fill:#fff3bf}
#cv .tube.el{stroke-width:1.4}
#cv .tube.el.ep{stroke:#e03131;stroke-width:2.3}
#cv .jn.ep{fill:#e03131}
#cv .port.pe{stroke:#e03131}
.sym text{font:10px "Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--muted)}
.sym .cname{font-size:13px;font-weight:700;fill:var(--ink)}
.sym .mk{font-size:11px;font-weight:700;fill:var(--accent)}
.sym .lg{font-size:12px;font-weight:700;fill:var(--ink)}
#cv .gdot{fill:var(--dot)}
#cv .hit{fill:transparent;cursor:move}
#cv .acthit{fill:transparent}
#cv .tube{stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linejoin:round}
#cv .tube.noair{stroke:var(--airsoft)}
#cv .tube.air{stroke:var(--air);stroke-width:3}
#cv .tube.sel{stroke:var(--sel);stroke-width:2.6}
#cv .tubehit{stroke:transparent;stroke-width:11;fill:none;pointer-events:stroke;cursor:move}
#cv .porthit{fill:transparent;cursor:crosshair}
#cv .porthit:hover{fill:var(--accent);fill-opacity:.3}
#cv .port{fill:var(--paper);stroke:var(--accent);stroke-width:1.5;pointer-events:none}
#cv .port.hot{fill:var(--accent)}
#cv .jn{fill:var(--ink)}
#cv .jn.air{fill:var(--air);stroke:none}
#cv .selr{fill:none;stroke:var(--sel);stroke-width:1.3;stroke-dasharray:5 4;pointer-events:none}
#cv .wire{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 4;fill:none;pointer-events:none}
#cv .rsz{fill:var(--accent);opacity:.6;cursor:ew-resize}
#cv .rsz:hover{opacity:1}
.sim #cv .hit{cursor:default}
.sim #cv .acthit{cursor:pointer}
.sim #cv .tubehit{pointer-events:none}
.lpmode .main{grid-template-columns:220px 1fr 340px}
.lpc{margin:-2px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.lph small{display:block;color:var(--muted);font-size:12px}
.lph b{font-size:18px;line-height:1.25}
.scene{width:100%;height:auto;display:block;margin:8px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
#props .opd{color:var(--ink)}
.req{font-size:14px;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.req b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.req div{display:flex;gap:6px;color:var(--muted);line-height:1.35;margin-bottom:2px}
.req div.ok{color:var(--ink)}
.req span{width:1em;flex:none}
.req div.ok span{color:#2f9e44;font-weight:700}
#props details{margin:0 0 10px}
#props summary{cursor:pointer;font-weight:700}
#props details p{margin-top:6px}
.lpn{display:flex;gap:6px;margin-bottom:6px}
.lpn button{flex:1;padding:5px 4px}
.lpl{width:100%;margin-top:4px}
.lvl{color:var(--accent);letter-spacing:1px;font-size:11px}
footer.warn{color:var(--danger);font-weight:700}
.scene .sc-bg{fill:var(--paper)}
.scene .sc-gr{fill:var(--sc-ground)}
.scene .sc-fr{fill:var(--sc-frame)}
.scene .sc-m{fill:var(--sc-metal);stroke:var(--ink);stroke-width:1}
.scene .sc-cylf{fill:var(--sc-cyl)}
.scene .sc-cylo{fill:none;stroke:var(--ink);stroke-width:1.5}
.scene .sc-air{fill:var(--cham)}
.scene .sc-rod{fill:var(--sc-rod);stroke:var(--ink);stroke-width:1}
.scene .sc-pis{fill:var(--ink)}
.scene .sc-wp{fill:var(--sc-wood);stroke:var(--ink);stroke-width:1}
.scene .sc-ink{fill:#d63939}
.scene .sc-gate{fill:var(--sc-gate);stroke:var(--ink);stroke-width:1}
.scene .sc-wall{fill:var(--sc-wall);stroke:var(--ink);stroke-width:1}
.scene .sc-bl{fill:var(--sc-belt)}
.scene .sc-stripe{stroke:var(--sc-metal);stroke-width:1.5;opacity:.55}
.scene .sc-bx{fill:var(--sc-box);stroke:var(--ink);stroke-width:1}
.scene .sc-bin{fill:none;stroke:var(--ink);stroke-width:2}
.scene .sc-sheet{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.scene .sc-ln{fill:none;stroke:var(--ink);stroke-width:1.2}
.scene .sc-dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.scene .sc-btn{fill:#d64545;stroke:var(--ink);stroke-width:1}
.scene .sc-rl{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.scene .sc-rl.on{fill:var(--signal)}
.scene .sc-glue{fill:var(--signal)}
.scene .sc-grain{fill:var(--sc-box)}
.scene .sc-hole{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.scene .sc-t{font:11px "Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--muted)}
.scene .sc-b{font-weight:700;fill:var(--ink)}
.scene .sc-warn{font:700 11px "Atkinson Hyperlegible",system-ui,sans-serif;fill:#fff}
.scene .sc-wbg{fill:var(--danger)}
@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #pal{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  #pal h3{display:none}
  #pal .pgrid[hidden]{display:contents}
  .pgrid{display:contents}
  .pi{flex:none;width:104px}
  #props{border-left:0;border-top:1px solid var(--line);max-height:34vh}
  .lpmode #props{max-height:55vh}
  .who,.brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <button class="brand" id="bHome" title="Terug naar het startscherm">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="8" width="16" height="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="9.5" width="2.5" height="7" fill="currentColor"/><rect x="11.5" y="12" width="13" height="2" fill="var(--air)"/></svg>
    PneumaLab
  </button>
  <div class="seg" role="group" aria-label="Modus">
    <button id="bEdit" class="on">Bewerken</button><button id="bSim">▶ Simuleren</button>
  </div>
  <button id="bPause" hidden>⏸ Pauze</button>
  <button id="bReset" hidden>↺ Opnieuw starten</button>
  <span class="sp"></span>
  <div class="grp" id="fileGrp">
    <button id="bUndo" title="Ongedaan maken (Ctrl+Z)">↶ Ongedaan</button>
    <button id="bNew">Nieuw</button>
    <button id="bOpen">Openen</button>
    <button id="bExport" class="primary">Exporteren</button>
  </div>
  <span class="who">VDSTH</span>
</header>
<div class="main">
  <aside id="pal" aria-label="Componenten"></aside>
  <div id="wrap">
    <svg id="cv" class="sym">
      <defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gdot" cx="0" cy="0" r="1.1"/><circle class="gdot" cx="16" cy="0" r="1.1"/><circle class="gdot" cx="0" cy="16" r="1.1"/><circle class="gdot" cx="16" cy="16" r="1.1"/></pattern></defs>
      <g id="world"></g>
    </svg>
    <div class="zoom" role="group" aria-label="Zoomen"><button id="zOut" title="Uitzoomen" aria-label="Uitzoomen">−</button><button id="zFit">Passend</button><button id="zIn" title="Inzoomen" aria-label="Inzoomen">+</button></div>
    <div class="empty" id="empty"><div><b>Het raster is leeg</b>Sleep een drukbron, een ventiel en een cilinder uit de lijst links, of open een voorbeeld.</div></div>
  </div>
  <aside id="props" aria-label="Eigenschappen"></aside>
</div>
<footer id="status"></footer>
</div>
<div id="modal" class="modal" hidden></div>
<div id="start" class="start" hidden></div>

<script>
(()=>{
const G=16;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const KEY_CUR='pneumalab.current', KEY_SAVES='pneumalab.saves';

let comps=[],tubes=[],nid=1;
let sel=null,mode='edit',running=false;
let P={},ST={},pressed={},latched={};
let view={x:60,y:60,z:1};
let drag=null,hoverPort=null,undoStack=[],conn={};
let NET={adj:new Map(),src:new Set(),vent:new Set()};
let FULL={};
let lp=null,scMem={},LEAK=false,lastLeak=false,lpTip=false;
let EL={E:{},on:{},short:false,sig:''};
let appMode='pneu',lpWork={},freeWork=null,curName='schakeling';
const svg=$('#cv'),world=$('#world'),wrap=$('#wrap');

/* ---------- component definitions ---------- */
const P5=[{n:'4',x:1,s:'t',r:'work'},{n:'2',x:3,s:'t',r:'work'},{n:'5',x:1,s:'b',r:'exh'},{n:'1',x:2,s:'b',r:'supply'},{n:'3',x:3,s:'b',r:'exh'}];
const VT={
  v32:{W:3,n:2,p:1,ports:[{n:'2',x:1,s:'t',r:'work'},{n:'1',x:1,s:'b',r:'supply'},{n:'3',x:2,s:'b',r:'exh'}]},
  v52:{W:4,n:2,p:1,ports:P5},
  v53:{W:4,n:3,p:1,ports:P5}
};
const TYPES=['source','cyl_ew','cyl_dw','v32','v52','v53','or','and','thr','thr_chk','e_rail','e_contact','e_relay','e_sol','e_lamp','e_sensor'];
const TITLES={source:'Drukbron',cyl_ew:'Enkelwerkende cilinder',cyl_dw:'Dubbelwerkende cilinder',v32:'3/2-ventiel',v52:'5/2-ventiel',v53:'5/3-ventiel',or:'OF-ventiel (wisselventiel)',and:'EN-ventiel (tweedrukventiel)',thr:'Smoorventiel',thr_chk:'Smoorterugslagventiel',e_rail:'Voedingsrail',e_contact:'Contact',e_relay:'Relaisspoel',e_sol:'Ventielspoel',e_lamp:'Signaallamp',e_sensor:'Naderingsschakelaar'};
const isValve=c=>!!VT[c.type];
const isCyl=c=>c.type==='cyl_dw'||c.type==='cyl_ew';
const PIL=new Set(['piloot','druk','tijd']);
const isThr=c=>c.type==='thr'||c.type==='thr_chk';
const isEl=c=>c.type.startsWith('e_');
const nm=v=>String(v??'').trim().toUpperCase();
const byId=id=>comps.find(c=>c.id===id);

function defProps(t){
  switch(t){
    case 'cyl_dw':case 'cyl_ew':return {label:'A',time:1.5,stroke:100,zMode:'%',z0:2,z1:2,rest:'in'};
    case 'v32':return {name:'',left:'knop',right:'veer',normal:'NC',leftMark:'',rightMark:'',leftSol:'',rightSol:'',delay:2,init:'1'};
    case 'v52':return {name:'',left:'knop',right:'veer',leftMark:'',rightMark:'',leftSol:'',rightSol:'',delay:2,init:'1'};
    case 'v53':return {name:'',left:'knop',right:'knop',mid:'gesloten',leftMark:'',rightMark:'',leftSol:'',rightSol:'',delay:2};
    case 'e_rail':return {pol:'+',len:30};
    case 'e_contact':return {kind:'knop',contact:'NO',name:'S1',mark:''};
    case 'e_relay':return {name:'K1'};
    case 'e_sol':return {name:'Y1'};
    case 'e_lamp':return {name:'H1'};
    case 'e_sensor':return {mark:'',kind:'ind'};
    case 'thr':return {name:'',open:50,rot:'v'};
    case 'thr_chk':return {name:'',open:50,rot:'v',dir:'12'};
    default:return {};
  }
}
function nextLabel(){
  const used=new Set(comps.filter(isCyl).map(c=>String(c.props.label).toUpperCase()));
  for(const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') if(!used.has(L)) return L;
  return 'Z';
}
function boxes(c){
  if(c.type==='v32') return c.props.normal==='NO'
    ?[{f:[['2','3']],b:['1']},{f:[['1','2']],b:['3']}]
    :[{f:[['1','2']],b:['3']},{f:[['2','3']],b:['1']}];
  const a={f:[['1','4'],['2','3']],b:['5']},z={f:[['1','2'],['4','5']],b:['3']};
  if(c.type==='v52') return [a,z];
  const mid=c.props.mid==='ontlucht'?{f:[['4','5'],['2','3']],b:['1']}
    :c.props.mid==='belucht'?{f:[['1','4'],['1','2']],b:['5','3']}
    :{f:[],b:['4','2','5','1','3']};
  return [a,mid,z];
}
function vgeo(c){
  const t=VT[c.type],W=t.W,n=t.n,p=t.p,A=2;
  const minDx=(p-(n-1))*W,maxDx=p*W;
  return {W,n,p,A,minDx,maxDx,portBox:p*W-minDx+A,total:maxDx-minDx+2*A+n*W};
}
function pilLabel(c,side){
  if(c.type==='v32') return (c.props.normal==='NO')===(side==='L')?'10':'12';
  return side==='L'?'14':'12';
}
function restPos(c){
  if(c.type==='v53') return 1;
  if(c.props.right==='veer') return 1;
  return Number(c.props.init)===0?0:1;
}
function initState(c){c.state={pos:isValve(c)?restPos(c):0,s:(c.type==='cyl_ew'&&c.props.rest==='uit')?1:0,ball:'X'};}
function rotOf(c){return (((Number(c.props&&c.props.rotation)||0)%360)+360)%360;}
function pivot(c){const b=compBox(c);return {x:Math.round(b.x+b.w/2),y:Math.round(b.y+b.h/2)};}
function rotPt(x,y,c){
  const r=rotOf(c)/90;if(!r) return [x,y];
  const pv=pivot(c);let dx=x-pv.x,dy=y-pv.y;
  for(let i=0;i<r;i++){const t=dx;dx=-dy;dy=t;}
  return [pv.x+dx,pv.y+dy];
}
function invRotX(x,y,c){const r=rotOf(c)/90,pv=pivot(c);let dx=x-pv.x,dy=y-pv.y;for(let i=0;i<r;i++){const t=dx;dx=dy;dy=-t;}return pv.x+dx;}
function rotN(nx,ny,c){const r=rotOf(c)/90;for(let i=0;i<r;i++){const t=nx;nx=-ny;ny=t;}return [nx+0,ny+0];}
function compBoxAbs(c){
  const b=compBox(c),pts=[[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].map(([x,y])=>rotPt(x,y,c));
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),x0=Math.min(...xs),y0=Math.min(...ys);
  return {x:c.x+x0,y:c.y+y0,w:Math.max(...xs)-x0,h:Math.max(...ys)-y0};
}
function rotWrap(c,inner){
  const ro=rotOf(c);if(!ro) return inner;
  const pv=pivot(c);
  inner=inner.replace(/<text x="([^"]+)" y="([^"]+)"/g,(m,x,y)=>`<text transform="rotate(${-ro} ${x} ${y})" x="${x}" y="${y}"`);
  return `<g transform="rotate(${ro} ${pv.x*G} ${pv.y*G})">${inner}</g>`;
}
function compPorts(c){
  const L=[],add=(n,x,y,nx,ny,r)=>{const [rx,ry]=rotPt(x,y,c),[a,b]=rotN(nx,ny,c);L.push({n,x:c.x+rx,y:c.y+ry,nx:a,ny:b,r});};
  switch(c.type){
    case 'source':add('P',1,0,0,-1,'source');break;
    case 'cyl_dw':add('A',1,3,0,1,'work');add('B',9,3,0,1,'work');break;
    case 'cyl_ew':add('A',c.props.rest==='uit'?9:1,3,0,1,'work');break;
    case 'or':case 'and':add('X',0,2,-1,0,'work');add('Y',4,2,1,0,'work');add('A',2,0,0,-1,'work');break;
    case 'e_rail':{const len=Number(c.props.len)||30;for(let k=2;k<=len;k+=2) add('p'+k,k,1,0,c.props.pol==='0'?-1:1,'el');break;}
    case 'e_contact':case 'e_relay':case 'e_sol':case 'e_lamp':add('a',2,0,0,-1,'el');add('b',2,4,0,1,'el');break;
    case 'e_sensor':add('+',2,0,0,-1,'el');add('-',2,6,0,1,'el');add('out',5,3,1,0,'el');break;
    case 'thr':case 'thr_chk':
      if(c.props.rot==='h'){add('1',0,2,-1,0,'work');add('2',4,2,1,0,'work');}
      else{add('1',2,4,0,1,'work');add('2',2,0,0,-1,'work');}
      break;
    default:{
      const g=vgeo(c),t=VT[c.type];
      for(const p of t.ports) add(p.n,g.portBox+p.x,p.s==='t'?0:4,0,p.s==='t'?-1:1,p.r);
      if(PIL.has(c.props.left)) add('pL',0,2,-1,0,'pilot');
      if(PIL.has(c.props.right)) add('pR',g.total,2,1,0,'pilot');
    }
  }
  return L;
}
function compBox(c){
  switch(c.type){
    case 'source':return {x:0,y:0,w:2,h:3};
    case 'cyl_dw':case 'cyl_ew':return {x:0,y:-1.4,w:20.4,h:4.4};
    case 'or':case 'and':return {x:0,y:0,w:4,h:4.2};
    case 'e_rail':return {x:-2.6,y:0,w:(Number(c.props.len)||30)+2.6,h:2};
    case 'e_contact':case 'e_relay':case 'e_sol':case 'e_lamp':return {x:0,y:0,w:4,h:4};
    case 'e_sensor':return {x:0,y:0,w:5,h:6};
    case 'thr':case 'thr_chk':return c.props.rot==='h'?{x:0,y:0,w:4,h:4.6}:{x:0,y:0,w:6,h:4};
    default:return {x:0,y:-0.6,w:vgeo(c).total,h:5.2};
  }
}
function marks(c){const l=String(c.props.label||'').toLowerCase();return [l+'0',l+'1'];}
function markOn(m){
  if(!m) return false;
  for(const c of comps) if(isCyl(c)){
    const [m0,m1]=marks(c);
    const [z0,z1]=zones(c);
    if(m===m0&&c.state.s<=z0+1e-9) return true;
    if(m===m1&&c.state.s>=1-z1-1e-9) return true;
  }
  return false;
}
function zones(c){
  const st=Math.max(1,Number(c.props.stroke)||100),f=c.props.zMode==='mm'?1/st:1/100;
  const cl=x=>Math.min(1,Math.max(0,(Number(x)||0)*f));
  return [cl(c.props.z0),cl(c.props.z1)];
}
function connCount(){
  const m={};
  for(const t of tubes){const a=t.a.c+':'+t.a.p,b=t.b.c+':'+t.b.p;m[a]=(m[a]||0)+1;m[b]=(m[b]||0)+1;}
  return m;
}
function portOf(ref){const c=byId(ref.c);if(!c) return null;return compPorts(c).find(p=>p.n===ref.p)||null;}

/* ---------- symbol drawing ---------- */
function arrow(x1,y1,x2,y2,air){
  const a=Math.atan2(y2-y1,x2-x1),L=7,w=3.3;
  const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a),px=-Math.sin(a)*w,py=Math.cos(a)*w;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" class="fl${air?' air':''}"/><path d="M${x2},${y2}L${bx+px},${by+py}L${bx-px},${by-py}Z" class="ah${air?' air':''}"/>`;
}
function act1(c,side,it,xi,dir,w,sim,mode){
  const xo=xi+dir*w,y=2*G;
  switch(it){
    case 'veer':{
      if(mode==='top'){
        const yt=y-12.5;let d=`M${xi},${yt}`;const N=5;
        for(let i=1;i<N;i++) d+=`L${xi+dir*w*i/N},${yt+(i%2?-3:3)}`;
        return `<path d="${d}L${xo},${yt}" class="ln" style="stroke-width:1.2"/>`;
      }
      let d=`M${xi},${y}`;const N=5;
      for(let i=1;i<N;i++) d+=`L${xi+dir*w*i/N},${y+(i%2?-6:6)}`;
      const oth=side==='R'?c.props.left:c.props.right;
      return `<path d="${d}L${xo},${y}" class="ln"/>`+(oth==='druk'||oth==='tijd'?arrow(xi+dir*0.1*w,y+9,xi+dir*0.95*w,y-10,false):'');
    }
    case 'knop':{
      const key=c.id+':'+side,on=sim&&(pressed[key]||latched[key]),lat=sim&&latched[key];
      const cx=xo-dir*7;
      return `<line x1="${xi}" y1="${y}" x2="${cx}" y2="${y}" class="ln"/><path d="M${cx},${y-7}A7,7 0 0 ${dir>0?1:0} ${cx},${y+7}Z" class="knop${on?' on':''}${lat?' lat':''}"/><rect data-act="${key}" x="${Math.min(xi,xo)-4}" y="${G-2}" width="${w+8}" height="${2*G+4}" class="acthit"/>`;
    }
    case 'piloot':{
      const on=sim&&P[c.id+':p'+side],tb=xi+dir*10;
      return `<path d="M${xi},${y}L${tb},${y-5}L${tb},${y+5}Z" class="tri${on?' on':''}"/><line x1="${tb}" y1="${y}" x2="${xo}" y2="${y}" class="ln${on?' air':''}" style="stroke-width:1.2"/>`;
    }
    case 'elek':{
      const sn=side==='L'?c.props.leftSol:c.props.rightSol,on=sim&&!!EL.on[nm(sn)];
      const lab=`<text x="${xo+dir*3}" y="${y+4}" text-anchor="${dir<0?'end':'start'}" class="lg">${esc(sn)}</text>`;
      if(w<2*G){
        const a=xi+dir*0.15*w,b=xi+dir*0.92*w,x1=Math.min(a,b),x2=Math.max(a,b);
        return `<line x1="${xi}" y1="${y}" x2="${a}" y2="${y}" class="ln"/><rect x="${x1}" y="${y-8}" width="${x2-x1}" height="16" class="knop${on?' on':''}"/><line x1="${x1}" y1="${y+8}" x2="${x2}" y2="${y-8}" class="ln"/>`+lab;
      }
      const p2=xi+dir*13,s2=xi+dir*(w-1),px=Math.min(xi,p2),sx=Math.min(p2,s2),sw=Math.abs(s2-p2);
      const t1=xi+dir*3,t2=p2-dir*3;
      const mo=(p2+s2)/2;
      return `<rect x="${px}" y="${y-8}" width="13" height="16" class="box"/><path d="M${t1},${y}L${t2},${y-4.5}L${t2},${y+4.5}Z" class="exh"/>`+
        `<rect x="${sx}" y="${y-8}" width="${sw}" height="16" class="knop${on?' on':''}"/><line x1="${sx}" y1="${y+8}" x2="${sx+sw}" y2="${y-8}" class="ln"/>`+
        `<path d="${mode==='v53'?`M${mo-3},${y+8}V${y+14}M${mo+3},${y+8}V${y+14}M${mo-6},${y+14}H${mo+6}`:`M${mo-3},${y-8}V${y-14}M${mo+3},${y-8}V${y-14}M${mo-6},${y-14}H${mo+6}`}" class="ln" style="stroke-width:1.2"/>`+lab;
    }
    case 'druk':case 'tijd':{
      const on=sim&&P[c.id+':p'+side],tr=sim&&sig(c,side),tb=xi+dir*10;
      let r=`<path d="M${xi},${y}L${tb},${y-5}L${tb},${y+5}Z" class="tri${tr?' on':''}"/><line x1="${tb}" y1="${y}" x2="${xo}" y2="${y}" class="ln${on?' air':''}" style="stroke-width:1.2"/>`;
      if(it==='tijd'){const rx=xi+dir*20;r+=`<rect x="${rx-5}" y="${y-5}" width="10" height="10" class="box"/><text x="${rx}" y="${y-8}" text-anchor="middle" class="mk">${esc(String(Number(c.props.delay)||0).replace('.',','))} s</text>`;}
      else r+=`<text x="${xi+dir*17}" y="${y-8}" text-anchor="middle" class="mk">p</text>`;
      return r;
    }
    case 'mag':{
      const key=c.id+':'+side,mk=side==='L'?c.props.leftMark:c.props.rightMark,on=sim&&(markOn(mk)||pressed[key]||latched[key]),cx=xo-dir*6;
      return `<line x1="${xi}" y1="${y}" x2="${cx}" y2="${y}" class="ln"/><rect x="${cx-5}" y="${y-7}" width="10" height="14" class="rol${on?' on':''}"/><line x1="${cx-5}" y1="${y}" x2="${cx+5}" y2="${y}" class="ln" style="stroke-width:1"/><text x="${cx}" y="${y-10}" text-anchor="middle" class="mk">${esc(mk)}</text><rect data-act="${key}" x="${Math.min(xi,xo)-4}" y="${G-2}" width="${w+8}" height="${2*G+4}" class="acthit"/>`;
    }
    case 'rol':{
      const key=c.id+':'+side,mk=side==='L'?c.props.leftMark:c.props.rightMark,on=sim&&(markOn(mk)||pressed[key]||latched[key]),cx=xo-dir*5;
      return `<path d="M${xi},${y-2.5}H${cx}M${xi},${y+2.5}H${cx}" class="ln" style="stroke-width:1.2"/><circle cx="${cx}" cy="${y}" r="5" class="rol${on?' on':''}"/><circle cx="${cx}" cy="${y}" r="1.8" class="ln" style="stroke-width:1.2"/><text x="${cx}" y="${y-9}" text-anchor="middle" class="mk">${esc(mk)}</text><rect data-act="${key}" x="${Math.min(xi,xo)-4}" y="${G-2}" width="${w+8}" height="${2*G+4}" class="acthit"/>`;
    }
  }
  return '';
}
function acts(c,side,xe,dir,sim){
  const a=side==='L'?c.props.left:c.props.right;
  if(c.type==='v53') return act1(c,side,'veer',xe,dir,2*G,sim,'top')+act1(c,side,a,xe,dir,2*G,sim,'v53');
  return act1(c,side,a,xe,dir,2*G,sim,'');
}
function svgValve(c,sim){
  const g=vgeo(c),t=VT[c.type],bx=boxes(c),pos=c.state.pos;
  const bs=(g.p-pos)*g.W-g.minDx+g.A;
  let s=`<rect class="hit" x="0" y="0" width="${g.total*G}" height="${4.6*G}"/>`;
  if(c.props.name) s+=`<text x="0" y="-3" class="lg">${esc(c.props.name)}</text>`;
  for(const p of t.ports){
    const x=(g.portBox+p.x)*G,top=p.s==='t',air=sim&&P[c.id+':'+p.n];
    s+=`<line x1="${x}" y1="${top?0:4*G}" x2="${x}" y2="${top?G:3*G}" class="ln${air?' air':''}"/>`;
    s+=`<text x="${x+3}" y="${top?G*0.72:G*3.78}">${p.n}</text>`;
    if(p.r==='exh'&&!conn[c.id+':'+p.n]) s+=`<path d="M${x-5},${4*G}L${x+5},${4*G}L${x},${4*G+8}Z" class="exh"/>`;
  }
  for(let i=0;i<g.n;i++){
    const x0=(bs+i*g.W)*G,active=i===pos;
    s+=`<rect x="${x0}" y="${G}" width="${g.W*G}" height="${2*G}" class="box${active&&sim?' act':''}"/>`;
    for(const [a,b] of bx[i].f){
      const pa=t.ports.find(q=>q.n===a),pb=t.ports.find(q=>q.n===b);
      const air=sim&&active&&(P[c.id+':'+a]||P[c.id+':'+b]);
      s+=arrow(x0+pa.x*G,pa.s==='t'?G+2:3*G-2,x0+pb.x*G,pb.s==='t'?G+2:3*G-2,air);
    }
    for(const n of bx[i].b){
      const pb=t.ports.find(q=>q.n===n),x=x0+pb.x*G,top=pb.s==='t',ye=top?G:3*G,yb=top?G*1.5:G*2.5;
      s+=`<line x1="${x}" y1="${ye}" x2="${x}" y2="${yb}" class="ln"/><line x1="${x-5}" y1="${yb}" x2="${x+5}" y2="${yb}" class="ln"/>`;
    }
  }
  s+=acts(c,'L',bs*G,-1,sim)+acts(c,'R',(bs+g.n*g.W)*G,1,sim);
  if(PIL.has(c.props.left)){
    const on=sim&&P[c.id+':pL'],xe=(bs-g.A)*G;
    if(xe>0) s+=`<line x1="0" y1="${2*G}" x2="${xe}" y2="${2*G}" class="pil${on?' air':''}"/>`;
    s+=`<text x="1" y="${2*G-5}">${pilLabel(c,'L')}</text>`;
  }
  if(PIL.has(c.props.right)){
    const on=sim&&P[c.id+':pR'],xs=(bs+g.n*g.W+g.A)*G;
    if(xs<g.total*G) s+=`<line x1="${xs}" y1="${2*G}" x2="${g.total*G}" y2="${2*G}" class="pil${on?' air':''}"/>`;
    s+=`<text x="${g.total*G-1}" y="${2*G-5}" text-anchor="end">${pilLabel(c,'R')}</text>`;
  }
  return s;
}
function svgCyl(c,sim){

  const pA=sim&&P[c.id+':A'],pB=sim&&dw&&P[c.id+':B'],ru=!dw&&c.props.rest==='uit';
  let o=`<rect class="hit" x="0" y="${-1.4*G}" width="${20.4*G}" height="${4.4*G}"/>`;

  if(pA&&ru) o+=`<rect x="${px+0.2*G}" y="0" width="${10*G-px-0.2*G}" height="${2*G}" class="cham"/>`;

  }

  o+=`<rect x="${px-0.2*G}" y="2" width="${0.4*G}" height="${2*G-4}" class="piston"/>`;
  const ax=ru?9*G:G;
  o+=`<line x1="${ax}" y1="${2*G}" x2="${ax}" y2="${3*G}" class="ln${pA?' air':''}"/><text x="${ax+3}" y="${2.8*G}">A</text>`;

  }
}
function dij(starts,goal){
  const d=new Map(),done=new Set();
  for(const s of starts) d.set(s,0);
  while(true){
    let u=null,best=Infinity;
    for(const [n,x] of d) if(!done.has(n)&&x<best){best=x;u=n;}
    if(u===null) return Infinity;
    if(goal(u)) return best;
    done.add(u);
    for(const [w,r] of NET.adj.get(u)||[]){const nd=best+r;if(nd<(d.has(w)?d.get(w):Infinity)) d.set(w,nd);}
  }
}
const fin=x=>Number.isFinite(x)?x:0;
const sup=id=>fin(dij(NET.src,n=>n===id)),exh=id=>fin(dij([id],n=>NET.vent.has(n)));
function stepCyl(dt){
  for(const c of comps) if(isValve(c)) for(const sd of ['L','R']){
    if((sd==='L'?c.props.left:c.props.right)!=='tijd') continue;
    c.state.tm=c.state.tm||{L:0,R:0};
    c.state.tm[sd]=P[c.id+':p'+sd]?c.state.tm[sd]+dt:0;
  }
  for(const c of comps) if(isCyl(c)){
    const A=c.id+':A',B=c.id+':B',a=ST[A],b=ST[B];let v=0;
    if(c.type==='cyl_dw'){
      if(a==='S'&&b==='V') v=1/(1+sup(A)+exh(B));
      else if(b==='S'&&a==='V') v=-1/(1+sup(B)+exh(A));
      else if(a==='S'&&b==='S') v=0.25/(1+sup(A));
    } else { const ru=c.props.rest==='uit'; if(a==='S') v=(ru?-1:1)/(1+sup(A)); else if(a==='V') v=(ru?1:-1)/(1+exh(A)); }
    const T=Math.max(0.2,Number(c.props.time)||1.5);
    c.state.s=Math.min(1,Math.max(0,c.state.s+v*dt/T));
  }
}
function resetSim(){
  comps.forEach(initState);P={};ST={};pressed={};latched={};scMem={};LEAK=false;EL={E:{},on:{},short:false,sig:''};
  if(mode==='sim') solve();
}
let lastT=0;
function loop(ts){
  if(mode!=='sim'){lastT=0;return;}
  const dt=lastT?Math.min(0.05,(ts-lastT)/1000):0;lastT=ts;
  if(running){solve();stepCyl(dt);solve();}
  {const w=(LEAK?1:0)+(EL.short?2:0);if(w!==lastLeak){lastLeak=w;setStatus();}}
  render();
  requestAnimationFrame(loop);
}

function applyView(){world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.z})`);}
function render(){
  conn=connCount();

  for(const t of tubes){
    const pts=route(t);if(!pts) continue;

    const ida=t.a.c+':'+t.a.p,pa=portOf(t.a),isE=pa&&pa.r==='el';

  }

    const id=c.id+':'+p.n,n=conn[id]||0,x=p.x*G,y=p.y*G;
    if(n>=2||(n>=1&&c.type==='e_rail')) s+=`<circle cx="${x}" cy="${y}" r="3.4" class="jn${p.r==='el'?(sim&&EL.E[id]==='+'?' ep':''):(sim&&P[id]?' air':'')}"/>`;
    if(!sim){
      const hot=hoverPort&&hoverPort.c===c.id&&hoverPort.p===p.n;
      const open=!n&&p.r!=='exh'&&c.type!=='e_rail';
      s+=(hot||open?`<circle cx="${x}" cy="${y}" r="${hot?5:3.6}" class="port${hot?' hot':''}${p.r==='el'?' pe':''}"/>`:'')+`<circle cx="${x}" cy="${y}" r="8" class="porthit" data-port="${id}"/>`;
    }

  if(drag&&drag.k==='wire'){

    if(a&&b) s+=`<polyline points="${a.x*G},${a.y*G} ${a.x*G},${b.y*G} ${b.x*G},${b.y*G}" class="wire"/>`;
  }

}

function load(data){
  const d=typeof data==='string'?JSON.parse(data):data;
  if(!d||!Array.isArray(d.comps)) throw new Error('Dit is geen geldige schakeling.');
  const cs=d.comps.filter(c=>TYPES.includes(c.type)&&Number.isFinite(c.x)&&Number.isFinite(c.y)).map(c=>({id:Number(c.id),type:c.type,x:Math.round(c.x),y:Math.round(c.y),props:Object.assign(defProps(c.type),c.props||{})}));
  comps=cs;comps.forEach(initState);
  tubes=(d.tubes||[]).filter(t=>t&&t.a&&t.b).map(t=>({id:Number(t.id),a:{c:Number(t.a.c),p:String(t.a.p)},b:{c:Number(t.b.c),p:String(t.b.p)},...(Number.isFinite(t.m)?{m:t.m}:{})}));
  const maxId=Math.max(0,...comps.map(c=>c.id),...tubes.map(t=>t.id));

function cleanup(){tubes=tubes.filter(t=>portOf(t.a)&&portOf(t.b));}

function pushUndo(){undoStack.push(snapshot());if(undoStack.length>100) undoStack.shift();updButtons();}

function rotateSel(d){

function delSel(){

function nearestPort(w,ex){
  let best=null,bd=0.9;
  for(const c of comps) for(const p of compPorts(c)){
    if(ex&&ex.c===c.id&&ex.p===p.n) continue;
    const d=Math.hypot(p.x-w.x,p.y-w.y);
    if(d<bd){bd=d;best={c:c.id,p:p.n};}
  }
  return best;

function nextName(pre,flt){const used=new Set(comps.filter(flt).map(x=>nm(x.props.name)));for(let i=1;;i++) if(!used.has(pre+i)) return pre+i;}
function addTube(a,b){
  if(a.c===b.c&&a.p===b.p) return;
  const pa=portOf(a),pb=portOf(b);
  if(pa&&pb&&(pa.r==='el')!==(pb.r==='el')){$('#status').textContent='Een elektrische draad kan je niet met een luchtaansluiting verbinden.';return;}
  const same=(x,y)=>x.c===y.c&&x.p===y.p;
  if(tubes.some(t=>(same(t.a,a)&&same(t.b,b))||(same(t.a,b)&&same(t.b,a)))) return;
  pushUndo();tubes.push({id:nid++,a,b});save();
}

      initState(c);
      changed();
    };

  });

/* ---------- pointer handling ---------- */
function startPan(e){drag={k:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};svg.classList.add('panning');}
svg.addEventListener('contextmenu',e=>e.preventDefault());
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0){startPan(e);return;}
  const t=e.target,w=toWorld(e);
  if(mode==='sim'){
    const a=t.closest('[data-act]');
    if(a){
      e.preventDefault();const key=a.dataset.act;
      if(e.shiftKey||e.ctrlKey||e.metaKey) latched[key]=!latched[key];
      else{pressed[key]=true;drag={k:'press',key};}
      return;
    }
    const ce=t.closest('[data-comp]'),tc=ce&&byId(Number(ce.dataset.comp));
    if(tc&&isThr(tc)){sel={k:'comp',id:tc.id};renderProps();return;}
    if(sel){sel=null;renderProps();}
    startPan(e);return;
  }
  const rz=t.closest('[data-resize]');
  if(rz){const id=Number(rz.dataset.resize);sel={k:'comp',id};drag={k:'resize',id,moved:false};render();renderProps();return;}
  const pe=t.closest('[data-port]');
  if(pe){const i=pe.dataset.port.indexOf(':');drag={k:'wire',from:{c:Number(pe.dataset.port.slice(0,i)),p:pe.dataset.port.slice(i+1)},cur:w};render();return;}
  const te=t.closest('[data-tube]');
  if(te){
    const id=Number(te.dataset.tube),tb=tubes.find(x=>x.id===id),a=portOf(tb.a);
    sel={k:'tube',id};drag={k:'tube',id,axis:a&&a.ny!==0?'y':'x',moved:false};
    render();renderProps();return;
  }
  const ce=t.closest('[data-comp]');
  if(ce){
    const id=Number(ce.dataset.comp),c=byId(id);
    sel={k:'comp',id};drag={k:'move',id,ox:w.x-c.x,oy:w.y-c.y,moved:false};
    render();renderProps();return;
  }
  if(sel){sel=null;render();renderProps();}
  startPan(e);
});
window.addEventListener('pointermove',e=>{
  if(!drag) return;
  const w=toWorld(e);
  switch(drag.k){
    case 'pan':view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);applyView();break;
    case 'move':{
      const c=byId(drag.id);if(!c) break;
      const nx=Math.round(w.x-drag.ox),ny=Math.round(w.y-drag.oy);
      if(nx!==c.x||ny!==c.y){
        if(!drag.moved){pushUndo();drag.moved=true;}
        c.x=nx;c.y=ny;
        tubes.forEach(t=>{if(t.a.c===c.id||t.b.c===c.id) delete t.m;});
        render();
      }
      break;
    }
    case 'resize':{
      const c=byId(drag.id);if(!c) break;
      const nl=Math.max(6,Math.min(120,Math.round(invRotX(w.x-c.x,w.y-c.y,c)/2)*2));
      if(nl!==Number(c.props.len)){if(!drag.moved){pushUndo();drag.moved=true;}c.props.len=nl;render();}
      break;
    }
    case 'wire':drag.cur=w;hoverPort=nearestPort(w,drag.from);render();break;
    case 'tube':{
      const t=tubes.find(x=>x.id===drag.id);if(!t) break;
      const a=portOf(t.a),b=portOf(t.b);if(!a||!b) break;
      const v=drag.axis==='y'?Math.round(w.y):Math.round(w.x);
      if(v!==tubeM(t,a,b)){if(!drag.moved){pushUndo();drag.moved=true;}t.m=v;render();}
      break;
    }
    case 'new':{
      if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5){
        drag.moved=true;const gh=document.createElement('div');gh.className='ghost';
        const c=tmpComp(drag.it),b=compBox(c);
        gh.innerHTML=palSvg(drag.it,(b.h+1)*G*view.z);document.body.appendChild(gh);drag.ghost=gh;
      }
      if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';}
      break;
    }
  }
});
function endDrag(e){
  if(!drag) return;
  const d=drag;drag=null;svg.classList.remove('panning');
  if(d.k==='wire'){const p=nearestPort(toWorld(e),d.from);hoverPort=null;if(p) addTube(d.from,p);render();renderProps();}
  else if(d.k==='press'){delete pressed[d.key];}
  else if(d.k==='new'){
    if(d.ghost) d.ghost.remove();
    if(!d.moved){addComp(d.it,null);return;}
    const r=wrap.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) addComp(d.it,toWorld(e));
  }
  else if((d.k==='move'||d.k==='tube')&&d.moved){save();}
  else if(d.k==='resize'&&d.moved){cleanup();render();renderProps();save();}
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  zoomAt(mx,my,view.z*Math.exp(-e.deltaY*0.0015));
},{passive:false});
function zoomAt(mx,my,z){
  z=Math.min(3,Math.max(0.3,z));
  view.x=mx-(mx-view.x)*z/view.z;view.y=my-(my-view.y)*z/view.z;view.z=z;applyView();
}
function fit(){
  if(!comps.length){view={x:60,y:60,z:1};applyView();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of comps){const b=compBoxAbs(c);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const r=svg.getBoundingClientRect(),pad=40,w=(x1-x0)*G,h=(y1-y0)*G;
  const z=Math.min(1.6,Math.max(0.3,Math.min((r.width-2*pad)/w,(r.height-2*pad)/h)));
  view.z=z;view.x=(r.width-w*z)/2-x0*G*z;view.y=(r.height-h*z)/2-y0*G*z;applyView();
}
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(!$('#modal').hidden){if(e.key==='Escape') closeModal();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&mode==='edit'&&sel){e.preventDefault();delSel();}

  else if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&mode==='edit'&&sel&&sel.k==='comp'){e.preventDefault();rotateSel(e.shiftKey?-90:90);}
});

let DL=null;
(async()=>{
  for(let i=0;i<60&&!window.claude;i++) await new Promise(r=>setTimeout(r,100));
  try{DL=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){DL=null;}
})();
async function saveFile(filename,data){
  if(DL){
    try{await DL.save({filename,data});return 'ok';}
    catch(e){return e&&e.code==='declined'?'declined':'err';}
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);return 'ok';
  }catch(e){return 'err';}
}
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
function exportCss(){
  const cs=getComputedStyle(document.documentElement);let out='';
  for(const sh of document.styleSheets){
    let rules;try{rules=sh.cssRules;}catch(e){continue;}
    for(const r of rules) if(r.selectorText&&/^(\.sym|#cv)\b/.test(r.selectorText)) out+=r.cssText+'\n';
  }
  return out.replace(/var\((--[\w-]+)\)/g,(_,v)=>cs.getPropertyValue(v).trim()||'#000');
}
function circuitSVG(){
  const cnt=connCount();conn=cnt;
  let s='',x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const ext=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  for(const t of tubes){
    const pts=route(t);if(!pts) continue;
    pts.forEach(p=>ext(p.x,p.y));
    const pa=portOf(t.a);
    s+=`<polyline points="${pts.map(p=>`${p.x*G},${p.y*G}`).join(' ')}" class="tube${pa&&pa.r==='el'?' el':''}"/>`;
  }
  for(const c of comps){
    const b=compBoxAbs(c);ext(b.x,b.y);ext(b.x+b.w,b.y+b.h);
    s+=`<g transform="translate(${c.x*G},${c.y*G})">${rotWrap(c,sym(c,false))}</g>`;
  }
  for(const c of comps) for(const p of compPorts(c)){
    const n=cnt[c.id+':'+p.n]||0;
    if(n>=2||(n>=1&&c.type==='e_rail')) s+=`<circle cx="${p.x*G}" cy="${p.y*G}" r="3.4" class="jn"/>`;
  }
  const pad=1.6,X=(x0-pad)*G,Y=(y0-pad)*G,W=(x1-x0+2*pad)*G,H=(y1-y0+2*pad)*G;
  const svgS=`<svg xmlns="http://www.w3.org/2000/svg" id="cv" class="sym" viewBox="${X} ${Y} ${W} ${H}" width="${W}" height="${H}"><style>${exportCss()}</style><rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#ffffff"/>${s}</svg>`;
  return {svg:svgS,w:W,h:H};
}
async function makePdf(title){
  if(mode!=='edit') setMode('edit');
  if(!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {svg:str,w,h}=circuitSVG();
  const sc=Math.max(1,Math.min(4,5000/Math.max(w,h)));
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);});
  const cv=document.createElement('canvas');cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
  const png=cv.toDataURL('image/png');
  const doc=new window.jspdf.jsPDF({orientation:w>=h?'landscape':'portrait',unit:'mm',format:'a4'});
  const PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),m=12,top=22,bot=12;
  const clean=t=>t.replace(/[−–—]/g,'-').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'');
  doc.setFontSize(16);doc.text(clean(title),m,15);
  doc.setFontSize(9);doc.setTextColor(110);doc.text('Schakeling in rusttoestand',PW-m,15,{align:'right'});
  const aw=PW-2*m,ah=PH-top-bot,f=Math.min(aw/w,ah/h,0.35),iw=w*f,ih=h*f;
  doc.addImage(png,'PNG',m+(aw-iw)/2,top+(ah-ih)/2,iw,ih);
  doc.setFontSize(8);doc.text('PneumaLab - VDSTH',PW-m,PH-6,{align:'right'});
  return doc.output('blob');
}

function scCyl(x,y,L,stroke,cy,dir,vert,name){
  const s=cy.s;
  const R=(a1,a2,b1,b2,cls)=>{
    const p1=vert?[x+b1,y+dir*a1]:[x+dir*a1,y+b1],p2=vert?[x+b2,y+dir*a2]:[x+dir*a2,y+b2];
    return `<rect x="${Math.min(p1[0],p2[0])}" y="${Math.min(p1[1],p2[1])}" width="${Math.abs(p2[0]-p1[0])}" height="${Math.abs(p2[1]-p1[1])}" class="${cls}"/>`;
  };
  const b0=Math.min(0,L-stroke-12),pist=b0+5+s*stroke,tip=L+14+s*stroke;
  let g=R(b0,L,-9,9,'sc-cylf');
  if(cy.pA) g+=R(b0+1,pist,-8,8,'sc-air');
  if(cy.pB) g+=R(pist+3,L-1,-8,8,'sc-air');
  g+=R(pist+3,tip,-2.5,2.5,'sc-rod')+R(b0,L,-9,9,'sc-cylo')+R(pist,pist+3,-8,8,'sc-pis');
  if(name){const q=vert?[x+13,y+dir*L/2+4]:[x+dir*L/2,y-13];g+=`<text x="${q[0]}" y="${q[1]}" text-anchor="${vert?'start':'middle'}" class="sc-t sc-b">${name}</text>`;}
  return {g,x:vert?x:x+dir*tip,y:vert?y+dir*tip:y};
}

function scCy(label){
  const c=comps.find(k=>isCyl(k)&&String(k.props.label).toUpperCase()===label),sim=mode==='sim';
  if(!c) return {s:0,ok:false,pA:false,pB:false};
  return {s:c.state.s,ok:true,pA:sim&&!!P[c.id+':A'],pB:sim&&!!P[c.id+':B']};
}
function drawScene(){
  const el=$('#scene');if(!el||!lp) return;
  const ex=EXS[lp.idx],A=scCy('A');
  let s=`<rect x="0" y="0" width="300" height="170" class="sc-bg"/>`+ex.sc(A,scMem,performance.now()/1000);
  if(!A.ok) s+=`<rect x="0" y="150" width="300" height="20" class="sc-wbg"/><text x="150" y="164" text-anchor="middle" class="sc-warn">Noem je cilinder A om hem hier te zien bewegen</text>`;
  el.innerHTML=s;
}
function lpReqs(ex){
  return ex.req.map(([n,t,p,txt])=>{
    const have=comps.filter(c=>c.type===t&&Object.entries(p||{}).every(([k,v])=>String(c.props[k])===String(v))).length;
    return {ok:have>=n,txt};
  });
}
function lpCard(){
  const ex=EXS[lp.idx],rq=lpReqs(ex);
  return `<div class="lpc"><div class="lph"><small>Leerpad 3EMT · oefening ${lp.idx+1} van ${EXS.length}</small><b>${esc(ex.t)}</b></div>
  <svg id="scene" class="sym scene" viewBox="0 0 300 170" role="img" aria-label="Illustratie: ${esc(ex.t)}"></svg>
  <p class="opd"><b>Opdracht:</b> ${ex.sit} ${ex.opd}</p>
  <div class="req"><b>Nodig</b>${rq.map(r=>`<div class="${r.ok?'ok':''}"><span>${r.ok?'✓':'○'}</span>${r.txt}</div>`).join('')}</div>
  
  <div class="lpn"><button data-lp="prev"${lp.idx===0?' disabled':''}>◀ Vorige</button><button data-lp="next"${lp.idx===EXS.length-1?' disabled':''}>Volgende ▶</button></div>
  <button data-lp="list" class="lpl">Alle oefeningen</button><button data-lp="close" class="lpl">Leerpad verlaten</button></div>`;
}
function renderProps(){
  renderPropsInner();
  if(!lp) return;
  const el=$('#props');
  el.insertAdjacentHTML('afterbegin',lpCard());
  el.querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>lpAction(b.dataset.lp));
  const d=el.querySelector('.lpc details');
  if(d){d.open=lpTip;d.ontoggle=()=>{lpTip=d.open;};}
  drawScene();
}
function lpAction(a){
  if(a==='prev') lpGo(lp.idx-1);
  else if(a==='next') lpGo(lp.idx+1);
  else if(a==='list') lpModal();
  else if(a==='close'){lpExit();showStart('home');}
  else if(a==='sol') modal('Oplossing tonen','<p>Je eigen schakeling wordt vervangen door een mogelijke oplossing. Met <b>Ongedaan</b> haal je je eigen schakeling terug.</p><div class="acts"><button data-x2>Annuleren</button><button class="primary" data-ok>Oplossing tonen</button></div>',m=>{
    m.querySelector('[data-x2]').onclick=closeModal;
    m.querySelector('[data-ok]').onclick=()=>{closeModal();openCircuit(EXS[lp.idx].sol);};
  });
}
function lpGo(i){
  if(i<0||i>=EXS.length) return;
  if(mode!=='edit') setMode('edit');
  if(lp) lpWork[lp.idx]=snapshot(); else freeWork=snapshot();
  lp={idx:i};
  if(appMode!=='pneu'){appMode='pneu';buildPalette();}
  document.body.classList.add('lpmode');
  try{if(lpWork[i]) load(lpWork[i]); else {comps=[];tubes=[];nid=1;}}catch(e){comps=[];tubes=[];nid=1;}
  sel=null;undoStack=[];scMem={};lpTip=false;
  render();renderProps();updButtons();setStatus();requestAnimationFrame(fit);
}
function lpExit(){
  if(mode!=='edit') setMode('edit');
  if(lp) lpWork[lp.idx]=snapshot();
  lp=null;document.body.classList.remove('lpmode');
  try{if(freeWork) load(freeWork); else {comps=[];tubes=[];nid=1;}}catch(e){comps=[];tubes=[];nid=1;}
  sel=null;undoStack=[];render();renderProps();updButtons();setStatus();requestAnimationFrame(fit);
}
function lpModal(){
  const has=i=>{try{return !!(lpWork[i]&&JSON.parse(lpWork[i]).comps.length);}catch(e){return false;}};
  modal('Leerpaden',`<p><b style="color:var(--ink)">3EMT · Pneumatica</b><br>Van een enkelwerkende cilinder tot een automatische cyclus. Bij elke oefening hoort een machine die meebeweegt met je simulatie. Je werk blijft per oefening bewaard zolang dit venster open is. Wil je het bijhouden, exporteer het dan als .json-bestand.</p>`+
    EXS.map((x,i)=>`<div class="row"><div class="t"><span class="lvl" aria-label="niveau ${x.lvl} van 5">${'●'.repeat(x.lvl)}${'○'.repeat(5-x.lvl)}</span><br>${i+1}. ${esc(x.t)}<small>${esc(x.k)}</small></div><button class="primary" data-go="${i}">${lp&&lp.idx===i?'Bezig':has(i)?'Verder':'Start'}</button></div>`).join(''),m=>{
    m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeModal();if(!(lp&&lp.idx===Number(b.dataset.go))) lpGo(Number(b.dataset.go));});
  });
}

/* ---------- toolbar ---------- */
$('#bEdit').onclick=()=>setMode('edit');
$('#bSim').onclick=()=>setMode('sim');
$('#bPause').onclick=()=>{running=!running;$('#bPause').textContent=running?'⏸ Pauze':'▶ Verder';setStatus();};
$('#bReset').onclick=()=>{resetSim();render();};
$('#bUndo').onclick=undo;
$('#zIn').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.z*1.2);};
$('#zOut').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.z/1.2);};
$('#zFit').onclick=fit;

/* ---------- start ---------- */
buildPalette();
render();renderProps();setStatus();updButtons();
showStart('home');
requestAnimationFrame(fit);
})();
</script>
