<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tools voor mechanica, elektriciteit en fysica, per klas. Tools door VDSTH.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230c0e12%27/%3E%3Cpath d=%27M6 24 L13 14 L19 19 L26 8%27 fill=%27none%27 stroke=%27%23f2b544%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<title>Tools voor mechanica, elektriciteit en fysica</title>
<script>try { if (localStorage.getItem('tools-thema') === 'licht') document.documentElement.dataset.theme = 'light'; } catch (e) { }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@1,500&display=swap">
<style>
/* Layout: smalle kop, rij klastegels als navigatie, daaronder de inhoud (lijst of applet). Standaard donker, met een knop voor de lichte opmaak. */
:root {
  color-scheme: dark;
  --bg: #0c0e12;
  --panel: #14181f;
  --panel-2: #1a1f28;
  --line: #262d38;
  --grid: #1e242e;
  --axis: #5b6576;
  --fg: #e7eaf0;
  --muted: #8b95a5;
  --a: #f2b544;      /* beweging A */
  --b: #5cc6e3;      /* beweging B */
  --meet: #ff8a6b;   /* ontmoetingspunt */
  --druk: #5fcf86;   /* drukspanning */
  --trek: #ff6b6b;   /* trekspanning */
  --focus: #9fb8ff;
  --geel: #ffd166;    /* waarschuwing (knik, overbelast) */
  --vw-trek: #ff6b6b;
  --vw-druk: #5b9bff;
  --ok: #3fb37f;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* lichte opmaak */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e3e8e6;
  --panel: #f6f8f7;
  --panel-2: #edf1ef;
  --line: #c9d2cf;
  --grid: #dde3e1;
  --axis: #7c8a93;
  --fg: #1e2a32;
  --muted: #5a6972;
  --a: #c27c0e;
  --b: #0b7fb0;
  --meet: #d9480f;
  --druk: #2b8a3e;
  --trek: #d63939;
  --focus: #1c6fe0;
  --geel: #b7791f;
  --vw-trek: #e03131;
  --vw-druk: #1c6fe0;
  --ok: #2b8a3e;
}
.thema-knop { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); font: 600 .85rem var(--f-body); cursor: pointer; }
.thema-knop:hover { border-color: var(--axis); background: var(--panel-2); }
.thema-knop svg { width: 16px; height: 16px; }
.kop-rechts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body); }
.wrap { max-width: none; margin: 0 auto; padding-inline: clamp(16px, 2vw, 32px); padding-block: 28px 64px; display: flex; flex-direction: column; gap: 28px; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 700 1.5rem/1.1 var(--f-display); letter-spacing: -0.01em; text-decoration: none; }
.hint { color: var(--muted); font-size: .95rem; }

/* Klastegels */
nav.klassen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 760px) { nav.klassen { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.tegel {
  display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 12px; min-width: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  text-decoration: none; transition: border-color .15s, background .15s;
}
.tegel:hover { border-color: var(--axis); background: var(--panel-2); }
.tegel .naam { font: 700 1.3rem/1.1 var(--f-display); letter-spacing: .01em; }
.tegel .sub { font: 400 .78rem/1.3 var(--f-mono); color: var(--muted); }
.tegel[aria-current="page"] { border-color: var(--fg); background: var(--panel-2); }
.tegel.vak { border-style: dashed; }
.tegel.vak[aria-current="page"] { border-style: solid; }
.tegel.vak .naam { font-size: clamp(.75rem, 3.2vw, 1.1rem); padding-top: .12rem; white-space: nowrap; }
@media (min-width: 760px) { .tegel.vak .naam { font-size: clamp(.95rem, 1.5vw, 1.1rem); } }

/* Inhoud */
main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 { font: 700 clamp(1.4rem, 3vw, 1.9rem)/1.15 var(--f-display); margin: 0; text-wrap: balance; }
h2 { font: 600 1.05rem/1.2 var(--f-display); margin: 0; }
.kruimel { display: flex; gap: 8px; align-items: center; font: 400 .85rem var(--f-mono); color: var(--muted); }
.kruimel a { text-decoration: none; color: var(--fg); }
.kruimel a:hover { text-decoration: underline; }
.leeg { padding: 28px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }

.lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.kaart {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; text-decoration: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s;
}
.kaart:hover { border-color: var(--axis); }
.kaart .chip { align-self: flex-start; font: 500 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.kaart p { margin: 0; color: var(--muted); font-size: .95rem; }
.kaart .open { font: 500 .85rem var(--f-mono); color: var(--fg); margin-top: auto; }
.kaart svg { width: 100%; height: auto; display: block; }

/* ERB-applet */
.erb { display: flex; flex-direction: column; gap: 16px; }
.paneel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.lbl-klein { font: 500 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.situaties { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button.sit {
  font: 400 .92rem var(--f-body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
button.sit:hover { border-color: var(--axis); }
button.sit[aria-pressed="true"] { border-color: var(--fg); background: var(--panel-2); }
.uitleg { margin: 0; color: var(--muted); max-width: 70ch; }
.uitleg b { color: var(--fg); }

.bediening { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.groep { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.groep .gkop { display: flex; align-items: center; gap: 10px; font: 600 1rem var(--f-display); min-height: 24px; }
.groep.uit-b .ctrl { opacity: .4; }
.stip { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.stip.a { background: var(--a); }
.stip.b { background: var(--b); }
.ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ctrl label { font-size: .9rem; color: var(--muted); }
.ctrl .rij { display: flex; gap: 10px; align-items: center; }
.ctrl input[type=range] { flex: 1; min-width: 0; }
.ctrl input[type=number] {
  width: 5.2em; padding: 5px 6px; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; font: 400 .95rem var(--f-mono); text-align: right;
}
.ctrl .eenh { font: 400 .85rem var(--f-mono); color: var(--muted); width: 2.6em; }
.groep.ga input[type=range] { accent-color: var(--a); }
.groep.gb input[type=range] { accent-color: var(--b); }
.groep.gt input[type=range] { accent-color: var(--fg); }
.knoppen { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
button.knop {
  font: 600 .9rem var(--f-body); color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
}
button.knop:hover { border-color: var(--axis); }
.vink { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: .95rem; }
.vink input { width: 18px; height: 18px; accent-color: var(--fg); }
.gb .gkop .vink input { accent-color: var(--b); }
.vink .stipjes { display: inline-block; width: 14px; height: 14px; background: radial-gradient(circle, var(--a) 0 2px, transparent 2.5px) 0 50% / 5px 5px repeat-x; }
.vink .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--a) 0 2px, transparent 2px 5px); border: 1px solid var(--a); }

.grafieken { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 880px) { .grafieken { grid-template-columns: 1fr 1fr; } }
@media (min-width: 880px) { .grafieken.drie { grid-template-columns: 1fr; } }
@media (min-width: 1100px) { .grafieken.drie { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 600px) and (max-width: 1099px) { .grafieken.drie .doek { aspect-ratio: 2 / 1; } }
.graf { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.graf .kop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.legende { display: flex; gap: 14px; font: 400 .85rem var(--f-mono); color: var(--muted); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.ln { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--a); }
.ln.b { border-top: 3px solid var(--b); }
.doek { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; }
.doek.spoor { aspect-ratio: auto; height: 172px; }
.doek canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

button.sit.ico { display: inline-flex; align-items: center; gap: 8px; }
button.sit.ico svg { width: 22px; height: 16px; flex: none; }
.vlak { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.vlak.druk { background: var(--druk); } .vlak.trek { background: var(--trek); }
.doek.balk { aspect-ratio: auto; height: 340px; }
.doek.dsn { aspect-ratio: auto; height: 380px; }
.bz-onder { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .bz-onder { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
.kolom { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.voet { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font: 400 .85rem var(--f-mono); }
.voet b { color: var(--fg); font-weight: 500; }
.lasten-kop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.lasten { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.last { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.lkop { display: flex; align-items: baseline; gap: 10px; }
.lkop b { font: 700 1.05rem var(--f-display); }
.lkop span { color: var(--muted); font-size: .9rem; flex: 1; min-width: 0; }
button.weg { font: 400 .8rem var(--f-body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
button.weg:hover { color: var(--trek); border-color: var(--trek); }
.lrij { display: flex; flex-direction: column; gap: 8px; }
select { font: 400 .95rem var(--f-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; align-self: flex-start; }
.uitleg.klein { font-size: .9rem; }
.doek.dm-balk { aspect-ratio: auto; height: 250px; }
.doek.dm-lijn { aspect-ratio: auto; height: 240px; }
.fv { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; overflow-x: auto; }
.voorschrift { display: flex; align-items: center; gap: 10px; font: 400 .98rem var(--f-mono); font-variant-numeric: tabular-nums; }
.vnaam { white-space: nowrap; font-weight: 500; }
.stukken { display: grid; grid-template-columns: auto auto; gap: 4px 28px; border-left: 2px solid var(--fg); border-radius: 14px 0 0 14px; padding: 6px 4px 6px 16px; }
.vf { white-space: nowrap; }
.vd { white-space: nowrap; color: var(--muted); }
@media (max-width: 520px) { .stukken { grid-template-columns: auto; gap: 0; } .vd { font-size: .82rem; margin-bottom: 6px; } }
.uitlezing { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.uit { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.uit .titel { display: flex; align-items: center; gap: 8px; }
.uit .val { font: 400 .98rem/1.45 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.uit .note { font-size: .85rem; color: var(--muted); }
.uit.ra { border-color: color-mix(in srgb, var(--a) 40%, var(--line)); }
.uit.rb { border-color: color-mix(in srgb, var(--b) 40%, var(--line)); }
.uit.rm { border-color: color-mix(in srgb, var(--meet) 40%, var(--line)); }
.c-a { color: var(--a); } .c-b { color: var(--b); } .c-m { color: var(--meet); }
sub { font-size: .7em; }

.lay2 { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.hoofd2 { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.zij2 { min-width: 0; }
.zij2 .bediening { grid-template-columns: 1fr; }
.grafieken.stapel { grid-template-columns: 1fr; }
@media (min-width: 1000px) {
  .lay2 { grid-template-columns: minmax(0, 1fr) 340px; }
  .zij2 { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: thin; }
  .grafieken.erbg .doek { aspect-ratio: 16 / 9; }
  .grafieken.evbg .doek { aspect-ratio: 2.3 / 1; }
}
@media (min-width: 1100px) { .grafieken.drie.stapel { grid-template-columns: 1fr; } }
@media (min-width: 1500px) {
  .lay2 { grid-template-columns: minmax(0, 1fr) 380px; }
  .grafieken.erbg { grid-template-columns: 1fr 1fr; }
  .grafieken.erbg .doek { aspect-ratio: 4 / 3; }
  .grafieken.evbg, .grafieken.drie.stapel.evbg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grafieken.evbg .doek { aspect-ratio: 4 / 3; }
}
/* compacte instellingenkolom (ERB/EVB) */
.zij2 .bediening { gap: 10px; padding: 10px; }
.zij2 .groep { padding: 10px 12px; gap: 6px; }
.zij2 .groep.gt { order: -1; }
.zij2 .groep.uit-b .ctrl { display: none; }
.zij2 .gkop { font-size: .95rem; min-height: 20px; }
.zij2 .ctrl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0 6px; }
.zij2 .ctrl label { grid-column: 1; grid-row: 1; font-size: .85rem; }
.zij2 .ctrl .rij { display: contents; }
.zij2 .ctrl input[type=number] { grid-column: 2; grid-row: 1; width: 4.6em; padding: 2px 6px; font-size: .88rem; }
.zij2 .ctrl .eenh { grid-column: 3; grid-row: 1; width: 2.4em; font-size: .78rem; }
.zij2 .ctrl input[type=range] { grid-column: 1 / -1; grid-row: 2; margin: 2px 0 0; }
.zij2 .knoppen { gap: 10px; }
.zij2 button.knop { padding: 6px 12px; }
.zij2 .vink { font-size: .88rem; }
/* compacte klasbalk op applet-pagina's */
nav.klassen.compact .tegel { padding: 8px 12px; }
nav.klassen.compact .tegel .sub { display: none; }
nav.klassen.compact .tegel .naam { font-size: 1.05rem; }
nav.klassen.compact .tegel.vak .naam { font-size: clamp(.75rem, 1.4vw, 1rem); padding-top: 0; }
/* buigspanning: instellingen links */
.lay3 { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.hoofd3 { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hoofd3 > .uitleg { margin: 0; }
.zij3 { min-width: 0; }
@media (min-width: 1000px) {
  .lay3 { grid-template-columns: minmax(0, 1fr) 360px; }
  .zij3 { order: 2; }
  .zij3 { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: thin; }
}
.zij3 .bediening { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
.zij3 .groep { padding: 10px 12px; gap: 8px; }
.zij3 .gkop { font-size: .95rem; min-height: 20px; }
.zij3 .chips { gap: 6px; }
.zij3 button.sit { padding: 4px 10px; font-size: .86rem; }
.zij3 .ctrl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0 6px; }
.zij3 .ctrl label { grid-column: 1; grid-row: 1; font-size: .85rem; }
.zij3 .ctrl .rij { display: contents; }
.zij3 .ctrl input[type=number] { grid-column: 2; grid-row: 1; width: 4.6em; padding: 2px 6px; font-size: .88rem; }
.zij3 .ctrl .eenh { grid-column: 3; grid-row: 1; width: 2.6em; font-size: .78rem; }
.zij3 .ctrl input[type=range] { grid-column: 1 / -1; grid-row: 2; margin: 2px 0 0; }
.zij3 .vink { font-size: .88rem; }
.zij3 .kolom { gap: 8px; }
.zij3 button.knop { padding: 5px 10px; font-size: .85rem; }
.hoofd3 .doek.dsn { height: 430px; }
.zij3 .geavanceerd { gap: 0; }
.zij3 .geavanceerd .gkop { margin-bottom: 4px; }
.zij3 .optie { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.zij3 .optie .kolom:not([hidden]) { padding-bottom: 2px; }
@media (min-width: 900px) { .bz-onder.enkel { grid-template-columns: 1fr; } }
/* D- en M-lijn: indeling */
.dm-top { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 900px) { .dm-top { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); } }
.dm-ligger { grid-template-columns: 1fr; padding: 10px; }
.dm-ligger .groep { padding: 10px 12px; gap: 8px; }
.dm-ligger .ctrl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0 6px; }
.dm-ligger .ctrl label { grid-column: 1; grid-row: 1; font-size: .85rem; }
.dm-ligger .ctrl .rij { display: contents; }
.dm-ligger .ctrl input[type=number] { grid-column: 2; grid-row: 1; width: 4.6em; padding: 2px 6px; font-size: .88rem; }
.dm-ligger .ctrl .eenh { grid-column: 3; grid-row: 1; width: 2.4em; font-size: .78rem; }
.dm-ligger .ctrl input[type=range] { grid-column: 1 / -1; grid-row: 2; margin: 2px 0 0; }
.dm-ligger button.sit { padding: 4px 10px; font-size: .86rem; }
.dm-rij { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: center; }
@media (min-width: 1000px) { .dm-rij { grid-template-columns: minmax(0, 1fr) clamp(340px, 30%, 470px); } }
.dm-rij .fv { overflow-x: auto; }
.dm-uit .uit .val { font-size: .92rem; }
.dm-rij .fv { margin-top: 0; }
.dm-rij canvas { cursor: crosshair; touch-action: pan-y; }
.maxtekst { margin: -2px 0 0; color: var(--fg); font-size: .95rem; max-width: 75ch; }
/* coördinaten en positievectoren */
.co-kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.co-kop .kolom { gap: 6px; max-width: 80ch; }
.co-kop .uitleg { margin: 0; }
.co-rooster { stroke: var(--grid); stroke-width: 1; }
.co-punt { fill: var(--a); stroke: var(--panel); stroke-width: 1.5; }
.co-vlak { stroke: var(--focus); stroke-width: 1.4; stroke-linejoin: round; }
.co-v1 { fill: color-mix(in srgb, var(--focus) 34%, var(--panel)); }
.co-v2 { fill: color-mix(in srgb, var(--focus) 22%, var(--panel)); }

/* ============================================================
   ROUTER  (#4EMT = klas, #erb = applet)
   ============================================================ */
const nav = document.getElementById('nav');
const inhoud = document.getElementById('inhoud');
let opruimen = null;
let laatsteKlas = null;

function tekenNav(actief, compact) {
  nav.classList.toggle('compact', !!compact);
  nav.innerHTML = KLASSEN.map(k => {
    return `<a class="tegel${k.vak ? ' vak' : ''}" href="#${k.id}" ${k.id === actief ? 'aria-current="page"' : ''}>
      <span class="naam">${k.naam}</span></a>`;
  }).join('');
}

function route() {
  if (opruimen) { opruimen(); opruimen = null; }
  const h = decodeURIComponent(location.hash.slice(1));
  const klas = KLASSEN.find(k => k.id.toLowerCase() === h.toLowerCase());
  const applet = APPLETS.find(a => a.id === h && !a.verborgen);

  if (applet && applet.link) { location.href = applet.link; return; }
  if (applet) {
    const k = (laatsteKlas && applet.klassen.includes(laatsteKlas)) ? laatsteKlas : applet.klassen[0];
    tekenNav(k, true);
    inhoud.innerHTML = `
      <div class="kruimel"><a href="#${k}">← ${KLASSEN.find(x => x.id === k).naam}</a><span>/</span><span>${applet.vak}</span></div>
      <h1>${applet.titel}</h1>
      <div id="applet"></div>`;
    opruimen = applet.render(document.getElementById('applet'));
    document.title = applet.titel + ' · Tools';
    return;
  }

  if (klas) {
    laatsteKlas = klas.id;
    tekenNav(klas.id);
    // volgorde per klas: optioneel 'volgorde: { klas: nr }', anders de volgorde van de lijst
    const lijst = APPLETS.filter(a => a.klassen.includes(klas.id) && !a.verborgen)
      .map((a, i) => [a, a.volgorde && a.volgorde[klas.id] != null ? a.volgorde[klas.id] : 100 + i]).sort((p, q) => p[1] - q[1]).map(x => x[0]);
    inhoud.innerHTML = `
      <h1>${klas.naam}</h1>
      ${lijst.length ? `<div class="lijst">${lijst.map(a => `
        <a class="kaart" href="${a.link || '#' + a.id}">
          ${a.thumb || ''}
          <span class="chip">${a.vak}</span>
          <h2>${a.titel}</h2>
          <p>${a.beschrijving}</p>
          <span class="open">Openen →</span>
        </a>`).join('')}</div>`
      : `<div class="leeg">${klas.vak
          ? 'Er staan nog geen tools voor Engineering.'
          : 'Er staan nog geen tools voor ' + klas.naam + '.'}</div>`}`;
    document.title = klas.naam + ' · Tools';
    return;
  }

  tekenNav(null);
  inhoud.innerHTML = `<div class="leeg">Klik hierboven op je klas om de tools te zien.</div>`;
  document.title = 'Tools voor mechanica, elektriciteit en fysica';
}
window.addEventListener('hashchange', route);

/* ============================================================

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function fmt(x, d = 2) {
  const r = Math.round(x * 10 ** d) / 10 ** d;
  return (Object.is(r, -0) ? 0 : r).toLocaleString('nl-BE', { maximumFractionDigits: d }).replace('-', '−');
}
function pn(x) { return x < 0 ? `(${fmt(x)})` : fmt(x); }
// getal met ongeveer 4 beduidende cijfers (voor eenheden als N, mm, Nmm)
function fmtS(x) { if (!isFinite(x) || Math.abs(x) < 1e-9) return '0'; const d = Math.min(6, Math.max(0, 3 - Math.floor(Math.log10(Math.abs(x))))); return fmt(x, d); }
// eenheden: intern kN en m, weergave volgens st.uF (N/kN) en st.uL (m/mm)
function eenhedenVan(st) {
  const cF = st.uF === 'N' ? 1000 : 1, cL = st.uL === 'mm' ? 1000 : 1;
  return { cF, cL, F: v => v * cF, L: v => v * cL, M: v => v * cF * cL, q: v => v * cF / cL,
    uF: st.uF, uL: st.uL, uM: st.uF + st.uL, uq: st.uF + '/' + st.uL };
}
const rondAf = v => +(+v).toPrecision(10);
function par(x, eenh) { return x < 0 ? `(${fmt(x)} ${eenh})` : `${fmt(x)} ${eenh}`; }
function niceStep(x) {
  const p = 10 ** Math.floor(Math.log10(x)); const f = x / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
/* Geblokte schaal: as-grenzen springen in vaste stappen 1-2-5-10 × 10ⁿ */
function blokRange(lo, hi) {
  const blok = v => {
    if (v <= 1e-9) return 0;
    const p = 10 ** Math.floor(Math.log10(v)), f = v / p;
    return (f <= 1 + 1e-9 ? 1 : f <= 2 + 1e-9 ? 2 : f <= 5 + 1e-9 ? 5 : 10) * p;
  };
  let a = blok(Math.max(0, hi)), b = blok(Math.max(0, -lo));
  if (a === 0 && b === 0) { a = 1; b = 1; }
  const groot = Math.max(a, b);
  const lead = Math.round(groot / 10 ** Math.floor(Math.log10(groot) + 1e-9));
  const step = groot / (lead === 2 ? 4 : 5);
  const op = a === 0 ? 0 : Math.ceil(a / step - 1e-9) * step;
  const neer = b === 0 ? 0 : Math.ceil(b / step - 1e-9) * step;
  return { min: -neer, max: op, step };
}
function niceRange(lo, hi) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const span = hi - lo;
  const step = niceStep(span / 5);
  const a = lo === 0 ? 0 : lo - span * 0.08;
  const b = hi === 0 ? 0 : hi + span * 0.08;
  return { min: Math.floor(a / step) * step, max: Math.ceil(b / step) * step, step };

function prepCanvas(cv) {

function pijl(ctx, x1, y1, x2, y2, kleur, dikte = 2) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 1) return;
  ctx.setLineDash([]);
  ctx.strokeStyle = kleur; ctx.fillStyle = kleur; ctx.lineWidth = dikte;
  const kop = Math.min(9, len * 0.6);
  const a = Math.atan2(y2 - y1, x2 - x1);
  const xe = x2 - Math.cos(a) * kop * 0.8, ye = y2 - Math.sin(a) * kop * 0.8;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(xe, ye); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - kop * Math.cos(a - 0.45), y2 - kop * Math.sin(a - 0.45));

/* Label "Δs_A = 12 m" met echte index, gecentreerd, met achtergrondvlak */
function indexLabel(ctx, cx, cy, hoofd, index, rest, kleur, bg) {
  const fH = '600 13px ' + css('--f-mono'), fI = '600 10px ' + css('--f-mono');

  ctx.fillStyle = bg; ctx.fillRect(x - 5, cy - 10, tot + 10, 20);
  ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = fH; ctx.fillText(hoofd, x, cy); x += w1;
  if (index) { ctx.font = fI; ctx.fillText(index, x, cy + 4); x += w2; }
  ctx.font = fH; ctx.fillText(rest, x, cy);

}
function arceer(ctx, x0, x1, ya, yb, kleur, richting) {
