            <div class="chips" id="rk-kant">
              <button type="button" class="sit" data-id="links">Links ingeklemd</button>
              <button type="button" class="sit" data-id="rechts">Rechts ingeklemd</button>
            </div>
          </div>
        </div>
        <div class="groep eh-groep">
          <div class="gkop">Eenheden</div>
          <div class="eh-rij"><span class="lbl-klein">Kracht</span><div class="chips" id="rk-uF"><button type="button" class="sit" data-u="N">N</button><button type="button" class="sit" data-u="kN">kN</button></div></div>
          <div class="eh-rij"><span class="lbl-klein">Afstand</span><div class="chips" id="rk-uL"><button type="button" class="sit" data-u="m">m</button><button type="button" class="sit" data-u="mm">mm</button></div></div>
        </div>
      </div>
      <div class="paneel">
        <div class="lasten-kop">
          <h2>Belastingen</h2>
          <div class="knoppen">
            <button class="knop" type="button" id="rk-addF">+ Puntkracht</button>
            <button class="knop" type="button" id="rk-addQ">+ Verdeelde belasting</button>
            <button class="knop" type="button" id="rk-reset" title="Alle belastingen verwijderen">↺ Reset</button>
          </div>
        </div>
        <div class="lasten" id="rk-lasten"></div>
      </div>
    </div>

    <div class="rk-lay">
      <div class="rk-links">
        <div class="paneel graf">
          <div class="kop"><h2>Situatie</h2></div>
          <div class="doek rk-doek"><canvas id="rk-c1" role="img" aria-label="Ligger met opleggingen en belastingen"></canvas></div>
        </div>
        <div class="paneel graf">
          <div class="kop"><h2>1. Lichaam vrijmaken</h2>
            <span class="legende"><span><i class="ln" style="border-color:var(--fg)"></i>belasting</span><span><i class="ln" style="border-color:var(--a)"></i>vervangkracht</span><span><i class="ln" style="border-color:var(--meet)"></i>reactiekracht</span></span></div>
          <div class="doek rk-doek rk-doek2"><canvas id="rk-c2" role="img" aria-label="Vrijgemaakte ligger met alle krachten"></canvas></div>
        </div>
      </div>
      <div class="rk-rechts">
        <div class="paneel">
          <h2>2. Voorafgaande berekeningen</h2>
          <div class="rk-tekst" id="rk-voor"></div>
        </div>
        <div class="paneel">
          <h2>3. Evenwichtsvergelijkingen</h2>
          <p class="uitleg klein">Afspraak: naar rechts en naar boven positief, momenten in tegenwijzerzin (↺) positief. De onbekende reactiekrachten zijn in positieve zin aangenomen.</p>
          <div class="rk-tekst" id="rk-ev"></div>
        </div>
        <div class="paneel">
          <div class="lasten-kop"><h2>Resultaat</h2>
            <label class="vink"><input type="checkbox" id="rk-opl">Oplossingen tonen op het vrijgemaakte lichaam</label></div>
          <div class="rk-tekst" id="rk-res"></div>
        </div>
      </div>
    </div>
  </div>`;

  const $ = id => root.querySelector('#rk-' + id);
  const cv1 = $('c1'), cv2 = $('c2');

  /* ---------- ligger-instellingen ---------- */
  const E = () => eenhedenVan(st);
  function koppel(id, key, min, maxF, na) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(String(val).replace(',', '.'));
      if (!isFinite(x)) return;
      const c = E().cL;
      x = Math.min(maxF() * c, Math.max(min * c, x));
      st[key] = x / c;
      if (bron !== r) r.value = x;
      if (bron !== n) n.value = x;
      if (na) na();
      teken();
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = rondAf(st[key] * E().cL); });
    r.value = n.value = rondAf(st[key] * E().cL);
    return v => zet(v, null);
  }
  function zetBereik() {
    const c = E().cL;
    [['L', 1, 12, 0.5], ['xA', 0, st.L, 0.1], ['xB', 0, st.L, 0.1]].forEach(([k, mn, mx, sp]) => {
      [$(k), $(k + 'n')].forEach(el => { el.min = mn * c; el.max = mx * c; el.step = c === 1 ? sp : sp * 100; el.value = rondAf(st[k] * c); });
      $(k + 'n').nextElementSibling.textContent = E().uL;
    });
  }
  const maxL = () => st.L;
  const nieuweLengte = () => {
    ['xA', 'xB'].forEach(k => {
      $(k).max = st.L * E().cL; $(k + 'n').max = st.L * E().cL;
      if (st[k] > st.L) { st[k] = st.L; $(k).value = $(k + 'n').value = rondAf(st.L * E().cL); }
    });
    st.loads.forEach(l => ['x', 's', 'e'].forEach(k => { if (k in l && l[k] > st.L) l[k] = st.L; }));
    tekenLasten();
  };
  koppel('L', 'L', 1, () => 12, nieuweLengte);
  koppel('xA', 'xA', 0, maxL);
  koppel('xB', 'xB', 0, maxL);
  zetBereik();
  function kiesEenheid() {
    root.querySelectorAll('#rk-uF button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === st.uF)));
    root.querySelectorAll('#rk-uL button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === st.uL)));
  }
  $('uF').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (!b) return; st.uF = b.dataset.u; kiesEenheid(); tekenLasten(); teken(); });
  $('uL').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (!b) return; st.uL = b.dataset.u; kiesEenheid(); zetBereik(); tekenLasten(); teken(); });
  kiesEenheid();

  function kies() {
    root.querySelectorAll('#rk-type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.type)));
    root.querySelectorAll('#rk-kant button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === st.kant)));
    $('steunen').hidden = st.type !== 'steun';
    $('inkl').hidden = st.type !== 'inkl';
  }
  $('type').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.type = b.dataset.id; kies(); teken(); });
  $('kant').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.kant = b.dataset.id; kies(); teken(); });
  // keuze van het momentpunt (staat in de momentvergelijking zelf)
  $('opl').addEventListener('change', () => { st.opl = $('opl').checked; teken(); });
  $('ev').addEventListener('change', e => { if (e.target.name === 'rk-rond') { st.rond = e.target.value; teken(); } });

  /* ---------- belastingen-editor ---------- */
  function fac(key) { const u = E(); return key === 'F' ? u.cF : key === 'q' ? u.cF / u.cL : (key === 'x' || key === 's' || key === 'e') ? u.cL : 1; }
  function tekenLasten() {
    let nF = 0, nQ = 0;
    const veld = (l, key, label, min, max, step, eenh, metSchuif) => { const f = fac(key), sp = f === 1 ? step : 'any', spR = key === 'x' || key === 's' || key === 'e' ? (E().cL === 1 ? step : 10) : step * f; return `
      <div class="ctrl">
        <label for="rk-l${l.id}-${key}">${label}</label>
        <div class="rij">
          ${metSchuif ? `<input type="range" data-id="${l.id}" data-key="${key}" min="${min * f}" max="${max * f}" step="${spR}" value="${rondAf(l[key] * f)}" aria-label="${label}">` : ''}
          <input type="number" id="rk-l${l.id}-${key}" data-id="${l.id}" data-key="${key}" min="${min * f}" max="${max * f}" step="${sp}" value="${rondAf(l[key] * f)}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`; };
    $('lasten').innerHTML = st.loads.length ? st.loads.map(l => {
      if (l.soort === 'F') {
        nF++;
        const sel = `<div class="ctrl"><label for="rk-l${l.id}-dir">Richting</label>
          <select id="rk-l${l.id}-dir" data-id="${l.id}" data-key="dir">${Object.entries(RICHT).map(([k, r]) => `<option value="${k}" ${l.dir === k ? 'selected' : ''}>${r.t}</option>`).join('')}</select></div>`;
        const hoek = RICHT[l.dir].schuin ? veld(l, 'a', 'Hoek α met de ligger', 1, 89, 1, '°', true) : '';
        return `<div class="last">
          <div class="lkop"><b>F<sub>${nF}</sub></b><span>Puntkracht</span><button type="button" class="weg" data-del="${l.id}" aria-label="Verwijder F${nF}">Verwijderen</button></div>
          <div class="lrij">${sel}${hoek}${veld(l, 'F', 'Grootte', 0, 100, 0.5, E().uF, false)}${veld(l, 'x', 'Positie x', 0, st.L, 0.1, E().uL, true)}</div></div>`;
      }
      nQ++;
      const sel = `<div class="ctrl"><label for="rk-l${l.id}-qdir">Richting</label>
        <select id="rk-l${l.id}-qdir" data-id="${l.id}" data-key="qdir">
          <option value="1" ${l.qdir > 0 ? 'selected' : ''}>↓ naar omlaag</option>
          <option value="-1" ${l.qdir < 0 ? 'selected' : ''}>↑ naar omhoog</option></select></div>`;
      return `<div class="last">
        <div class="lkop"><b>q<sub>${nQ}</sub></b><span>Gelijkmatig verdeelde belasting</span><button type="button" class="weg" data-del="${l.id}" aria-label="Verwijder q${nQ}">Verwijderen</button></div>
        <div class="lrij">${sel}${veld(l, 'q', 'Grootte', 0, 50, 0.5, E().uq, false)}${veld(l, 's', 'Begint op', 0, st.L, 0.1, E().uL, true)}${veld(l, 'e', 'Eindigt op', 0, st.L, 0.1, E().uL, true)}</div></div>`;
    }).join('') : '<div class="leeg">Nog geen belastingen. Voeg een puntkracht of een verdeelde belasting toe.</div>';
  }
  $('lasten').addEventListener('input', e => {
    const t = e.target, key = t.dataset.key; if (!key) return;
    const l = st.loads.find(x => x.id === +t.dataset.id); if (!l) return;
    if (key === 'dir') { l.dir = t.value; tekenLasten(); teken(); return; }
    if (key === 'qdir') { l.qdir = +t.value; teken(); return; }
    let v = parseFloat(String(t.value).replace(',', '.')); if (!isFinite(v)) return;
    v = Math.min(+t.max, Math.max(+t.min, v));
    l[key] = v / fac(key);
    root.querySelectorAll(`#rk-lasten [data-id="${l.id}"][data-key="${key}"]`).forEach(o => { if (o !== t) o.value = v; });
    teken();
  });
  $('lasten').addEventListener('change', e => {
    const t = e.target; if (t.type !== 'number') return;
    const l = st.loads.find(x => x.id === +t.dataset.id); if (l) t.value = rondAf(l[t.dataset.key] * fac(t.dataset.key));
  });
  $('lasten').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    st.loads = st.loads.filter(l => l.id !== +b.dataset.del); tekenLasten(); teken();
  });
  $('addF').addEventListener('click', () => { st.loads.push({ id: st.volg++, soort: 'F', dir: 'down', F: 10, a: 45, x: Math.round(st.L * 5) / 10 }); tekenLasten(); teken(); });
  $('addQ').addEventListener('click', () => { st.loads.push({ id: st.volg++, soort: 'q', qdir: 1, q: 5, s: 0, e: st.L }); tekenLasten(); teken(); });
  $('reset').addEventListener('click', () => { st.loads = []; tekenLasten(); teken(); });

  /* ---------- rekenen ---------- */
  const r2 = v => Math.round(v * 100) / 100;
  function bereken() {
    const L = st.L, kl = v => Math.min(L, Math.max(0, v));
    const K = []; // gekende krachten: {naam (html), x, Fx, Fy, ...}
    let nF = 0, nQ = 0;
    st.loads.forEach(l => {
      if (l.soort === 'F') {
        nF++;
        const R = RICHT[l.dir], a = l.a * Math.PI / 180, [ux, uy] = R.u(a);
        K.push({ soort: 'F', nr: nF, naam: `F<sub>${nF}</sub>`, x: kl(l.x), F: l.F, Fx: r2(l.F * ux), Fy: r2(l.F * uy), schuin: !!R.schuin, hoek: l.a, dir: l.dir, ux, uy });
      } else {
        nQ++;
        const s = kl(Math.min(l.s, l.e)), e = kl(Math.max(l.s, l.e));
        if (e - s < eps) return;
        const Fq = r2(l.q * (e - s));
        K.push({ soort: 'q', nr: nQ, naam: `F<sub>q${nQ}</sub>`, x: (s + e) / 2, s, e, q: l.q, qdir: l.qdir, F: Fq, Fx: 0, Fy: -l.qdir * Fq });
      }
    });
    const res = { K, fout: null };
    const sFx = K.reduce((t, k) => t + k.Fx, 0), sFy = K.reduce((t, k) => t + k.Fy, 0);
    res.Ax = r2(-sFx);
    if (st.type === 'steun') {
      const a = kl(st.xA), b = kl(st.xB);
      if (Math.abs(a - b) < eps) { res.fout = 'Het scharnier en de rol liggen op dezelfde plaats. Schuif A of B opzij.'; return res; }
      const rondA = st.rond === 'A'; // standaard rond het linkse steunpunt
      res.a = a; res.b = b; res.rondA = rondA;
      const P = rondA ? a : b;
      const Smom = K.reduce((t, k) => t + k.Fy * (k.x - P), 0);
      if (rondA) { res.cU = b - a; res.By = r2(-Smom / (b - a)); res.Ay = r2(-sFy - res.By); }
      else { res.cU = a - b; res.Ay = r2(-Smom / (a - b)); res.By = r2(-sFy - res.Ay); }
      res.P = P; res.Smom = Smom;
    } else {
      const xk = st.kant === 'links' ? 0 : L;
      const Smom = K.reduce((t, k) => t + k.Fy * (k.x - xk), 0);
      res.xk = xk; res.P = xk; res.Smom = Smom;
      res.MA = r2(-Smom); res.Ay = r2(-sFy);
    }
    res.sFx = sFx; res.sFy = sFy;
    return res;
  }

  /* ---------- tekenen ---------- */
  const ML = 60, MR = 50;
  function teken() {
    const C = { fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel'), vul: css('--panel-2'), reac: css('--meet'), fq: css('--a') };
    const res = bereken();
    const L = st.L;

    const basis = (cv, vrij) => {
      const { ctx, w, h } = prepCanvas(cv);
      const pw = w - ML - MR, X = x => ML + x / L * pw;
      const yb0 = vrij ? 128 : 112, yb1 = yb0 + 12, ym = (yb0 + yb1) / 2;
      const tekst = (t, x, y, kleur, uitl = 'center', font = '500 12px ') => {
        ctx.font = font + css('--f-mono'); const tw = ctx.measureText(t).width;
        let x0 = uitl === 'center' ? x - tw / 2 : uitl === 'right' ? x - tw : x;
        x0 = Math.min(Math.max(x0, 2), w - tw - 2);
        ctx.fillStyle = C.bg; ctx.fillRect(x0 - 3, y - 8, tw + 6, 16);
        ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x0, y);
      };
      const label = (hoofd, idx, rest, x, y, kleur) => {
        // gecentreerd label met index, binnen het doek gehouden
        ctx.font = '600 13px ' + css('--f-mono');
        const bw = ctx.measureText(hoofd + idx + rest).width + 14;
        indexLabel(ctx, Math.min(Math.max(x, bw / 2 + 2), w - bw / 2 - 2), y, hoofd, idx, rest, kleur, C.bg);
      };
      // label met pijltje boven de letter (vector), index en rest
      const vlabel = (hoofd, idx, rest, x, y, kleur) => {
        // met een grootte erbij (bv. F1 = 10 kN) gaat het om de grootte: geen pijltje
        if (rest) return label(hoofd, idx, rest, x, y, kleur);
        const fH = 'italic 600 14px ' + css('--f-body'), fI = '600 10px ' + css('--f-mono'), fR = '600 13px ' + css('--f-mono');
        ctx.font = fH; const w1 = ctx.measureText(hoofd).width;
        ctx.font = fI; const w2 = idx ? ctx.measureText(idx).width + 1 : 0;
        ctx.font = fR; const w3 = ctx.measureText(rest).width;
        const tot = w1 + w2 + w3;
        const cx = Math.min(Math.max(x, tot / 2 + 6), w - tot / 2 - 6);
        let x0 = cx - tot / 2;
        ctx.fillStyle = C.bg; ctx.fillRect(x0 - 5, y - 14, tot + 10, 25);
        ctx.fillStyle = kleur; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = fH; ctx.fillText(hoofd, x0, y);
        // pijltje boven de letter
        ctx.strokeStyle = kleur; ctx.lineWidth = 1.2;
        const ay = y - 10, ax0 = x0 + 1, ax1 = x0 + w1 + 2;
        ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1, ay); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax1 - 3, ay - 2.5); ctx.lineTo(ax1, ay); ctx.lineTo(ax1 - 3, ay + 2.5); ctx.stroke();
        x0 += w1;
        if (idx) { ctx.font = fI; ctx.fillText(idx, x0 + 1, y + 5); x0 += w2; }
        ctx.font = fR; ctx.fillText(rest, x0, y);
      };
      if (!vrij) {
      // maatas
      const yAs = h - 18;
      const stap = L > 8 ? 2 : L > 3 ? 1 : 0.5;
      ctx.strokeStyle = C.axis; ctx.lineWidth = 1; ctx.font = '11px ' + css('--f-mono');
      ctx.beginPath(); ctx.moveTo(X(0), yAs - 8); ctx.lineTo(X(L), yAs - 8); ctx.stroke();
      for (let x = 0; x <= L + eps; x += stap) {
        ctx.beginPath(); ctx.moveTo(X(x), yAs - 12); ctx.lineTo(X(x), yAs - 4); ctx.stroke();
        ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(fmtS(E().L(x)), X(x), yAs - 2);
      }
      ctx.fillStyle = C.fg; ctx.font = '600 12px ' + css('--f-mono'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(`x (${E().uL})`, w - 2, yAs - 12); ctx.font = '11px ' + css('--f-mono');
      }
      // balk
      ctx.fillStyle = C.vul; ctx.fillRect(X(0), yb0, pw, yb1 - yb0);
      ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5; ctx.strokeRect(X(0), yb0, pw, yb1 - yb0);
      return { ctx, w, h, X, yb0, yb1, ym, tekst, label, vlabel, vrij, pw };
    };

    // puntkracht tekenen (eindigt op de ligger)
    const puntkracht = (g, k, kleur, metOntbinding) => {
      const { ctx, X, yb0, yb1, ym } = g;
      const len = 72, xx = X(k.x);
      let tip, ux = k.ux, uy = k.uy;
      if (Math.abs(uy) < 1e-9) tip = [xx, ym];
      else tip = [xx, uy < 0 ? yb0 - 2 : yb1 + 2];
      const tail = [tip[0] - ux * len, tip[1] + uy * len];
      pijl(ctx, tail[0], tail[1], tip[0], tip[1], kleur, 2.4);
      (g.vrij ? g.vlabel : g.label)('F', String(k.nr), ' = ' + fmtS(E().F(k.F)) + ' ' + E().uF, tail[0] + (ux > 0 ? -8 : ux < 0 ? 8 : 0), tail[1] + (uy < 0 ? -12 : uy > 0 ? 12 : -14), kleur);
      if (k.schuin) {
        // hoek α tussen ligger en kracht
        const th = tail[0] < tip[0] ? Math.PI : 0;
        const tt = Math.atan2(tail[1] - tip[1], tail[0] - tip[0]);
        ctx.setLineDash([3, 3]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(tip[0] + Math.cos(th) * 46, tip[1]); ctx.stroke(); ctx.setLineDash([]);
        let a0 = th, a1 = tt; if (th === Math.PI && tt < 0) a1 = tt + 2 * Math.PI;
        ctx.strokeStyle = kleur; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(tip[0], tip[1], 26, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
        const am = (a0 + a1) / 2;
        g.tekst(fmt(k.hoek) + '°', tip[0] + Math.cos(am) * 40, tip[1] + Math.sin(am) * 40, kleur, 'center', '500 11px ');
        if (metOntbinding) {
          // componenten gestippeld
          ctx.setLineDash([5, 4]);
          pijl(ctx, tip[0] - ux * len, tip[1], tip[0], tip[1], C.muted, 1.4);
          pijl(ctx, tip[0], tip[1] + uy * len, tip[0], tip[1], C.muted, 1.4);
          ctx.setLineDash([]);
        }
      }
    };
    const verdeeld = (g, k, vaag) => {
      const { ctx, X, yb0, yb1 } = g;
      const omlaag = k.qdir > 0, yL = omlaag ? yb0 - 34 : yb1 + 34, yK = omlaag ? yb0 - 2 : yb1 + 2;
      ctx.globalAlpha = vaag ? 0.3 : 1;
      ctx.fillStyle = C.fg; ctx.globalAlpha *= 0.08 / (vaag ? 1 : 1);
      ctx.fillRect(X(k.s), Math.min(yL, yK), X(k.e) - X(k.s), Math.abs(yK - yL));
      ctx.globalAlpha = vaag ? 0.3 : 1;
      ctx.strokeStyle = C.fg; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(X(k.s), yL); ctx.lineTo(X(k.e), yL); ctx.stroke();
      const n = Math.max(1, Math.round((X(k.e) - X(k.s)) / 20));
      for (let i = 0; i <= n; i++) { const xx = X(k.s) + (X(k.e) - X(k.s)) * i / n; pijl(ctx, xx, yL, xx, yK, C.fg, 1.1); }
      ctx.globalAlpha = 1;
      if (!vaag) g.label('q', String(k.nr), ' = ' + fmtS(E().q(k.q)) + ' ' + E().uq, (X(k.s) + X(k.e)) / 2, omlaag ? yL - 12 : yL + 12, C.fg);
      else g.label('q', String(k.nr), '', X(k.s) + 16, omlaag ? yL - 10 : yL + 10, C.muted);
    };

    /* 1. Ligger met opleggingen */
    {
      const g = basis(cv1, false);
      const { ctx, X, yb0, yb1 } = g;
      if (st.type === 'steun') {
        const a = Math.min(st.L, st.xA), b = Math.min(st.L, st.xB);
        ctx.fillStyle = C.fg; ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(X(a), yb1); ctx.lineTo(X(a) - 10, yb1 + 17); ctx.lineTo(X(a) + 10, yb1 + 17); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(X(b), yb1); ctx.lineTo(X(b) - 10, yb1 + 13); ctx.lineTo(X(b) + 10, yb1 + 13); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(X(b) - 5, yb1 + 17, 3, 0, 7); ctx.arc(X(b) + 5, yb1 + 17, 3, 0, 7); ctx.fill();
        [[a, yb1 + 18], [b, yb1 + 21]].forEach(([x, y]) => {
          ctx.beginPath(); ctx.moveTo(X(x) - 15, y); ctx.lineTo(X(x) + 15, y); ctx.stroke();
          for (let k = -13; k <= 11; k += 6) { ctx.beginPath(); ctx.moveTo(X(x) + k, y); ctx.lineTo(X(x) + k - 5, y + 6); ctx.stroke(); }
        });
        ctx.font = '600 13px ' + css('--f-body'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('A', X(a), yb1 + 30); ctx.fillText('B', X(b), yb1 + 30);
      } else {
        const links = st.kant === 'links', xw = links ? X(0) : X(L);
        ctx.fillStyle = C.axis; ctx.fillRect(links ? xw - 12 : xw, yb0 - 34, 12, yb1 - yb0 + 68);
        ctx.strokeStyle = C.fg; ctx.lineWidth = 1;
        for (let y = yb0 - 34; y < yb1 + 34; y += 7) { const xr = links ? xw - 12 : xw + 12; ctx.beginPath(); ctx.moveTo(xr, y); ctx.lineTo(xr + (links ? -6 : 6), y + 6); ctx.stroke(); }
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xw, yb0 - 34); ctx.lineTo(xw, yb1 + 34); ctx.stroke();
        ctx.font = '600 13px ' + css('--f-body'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('A', xw + (links ? 12 : -12), yb1 + 22);
      }
      res.K.filter(k => k.soort === 'q').forEach(k => verdeeld(g, k, false));
      res.K.filter(k => k.soort === 'F').forEach(k => puntkracht(g, k, C.fg, false));
    }

    /* 2. Vrijgemaakte ligger */
    {
      const g = basis(cv2, true);
      const { ctx, w, h, X, yb0, yb1, ym } = g;
      // maatketting: alle onderlinge afstanden tussen de aangrijpingspunten van de krachten
      {
        const pos = [0, L];
        res.K.forEach(k => pos.push(k.x));
        if (!res.fout) { if (st.type === 'steun') pos.push(res.a, res.b); else pos.push(res.xk); }
        const xs = [...new Set(pos.map(v => Math.round(v * 1000) / 1000))].sort((a, b) => a - b);
        const yD = h - 52, yT = h - 22;
        ctx.strokeStyle = C.muted; ctx.lineWidth = 0.8;
        xs.forEach(v => { ctx.beginPath(); ctx.moveTo(X(v), yb1 + 4); ctx.lineTo(X(v), (v === 0 || v === L) ? yT + 6 : yD + 6); ctx.stroke(); });
        const maat = (x1, x2, y, t) => {
          ctx.strokeStyle = C.fg; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(X(x1), y); ctx.lineTo(X(x2), y); ctx.stroke();
          [[X(x1), 1], [X(x2), -1]].forEach(([px, d]) => { ctx.fillStyle = C.fg; ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + d * 7, y - 3); ctx.lineTo(px + d * 7, y + 3); ctx.closePath(); ctx.fill(); });
          ctx.font = '500 12px ' + css('--f-mono'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          if (X(x2) - X(x1) > 22) ctx.fillText(t, (X(x1) + X(x2)) / 2, y - 3);
        };
        for (let i = 0; i < xs.length - 1; i++) maat(xs[i], xs[i + 1], yD, fmtS(E().L(r2(xs[i + 1] - xs[i]))));
        maat(0, L, yT, fmtS(E().L(L)));
        ctx.font = '11px ' + css('--f-mono'); ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(`maten in ${E().uL}`, X(0), yT + 6);
      }
      // referentieassenstelsel
      const ox = 22, oy = 64;
      pijl(ctx, ox, oy, ox + 34, oy, C.fg, 1.6); pijl(ctx, ox, oy, ox, oy - 34, C.fg, 1.6);
      ctx.font = 'italic 600 13px ' + css('--f-body'); ctx.fillStyle = C.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('x', ox + 38, oy); ctx.fillText('y', ox + 4, oy - 38);
      ctx.strokeStyle = C.fg; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(ox + 54, oy - 26, 9, -0.2 * Math.PI, 1.3 * Math.PI); ctx.stroke();
      const ea = -0.2 * Math.PI, ex = ox + 54 + 9 * Math.cos(ea), ey = oy - 26 + 9 * Math.sin(ea);
      ctx.fillStyle = C.fg; ctx.beginPath(); ctx.moveTo(ex + 4, ey + 2); ctx.lineTo(ex - 3, ey - 1); ctx.lineTo(ex + 2, ey - 6); ctx.closePath(); ctx.fill();
      ctx.font = '600 12px ' + css('--f-mono'); ctx.fillText('+', ox + 68, oy - 26);

      // verdeelde belastingen vaag + vervangkracht
      res.K.filter(k => k.soort === 'q').forEach(k => {
        verdeeld(g, k, true);
        const omlaag = k.qdir > 0, xx = X(k.x);
        if (omlaag) pijl(ctx, xx, yb0 - 80, xx, yb0 - 2, C.fq, 3); else pijl(ctx, xx, yb1 + 80, xx, yb1 + 2, C.fq, 3);
        g.vlabel('F', 'q' + k.nr, ' = ' + fmtS(E().F(k.F)) + ' ' + E().uF, xx, omlaag ? yb0 - 92 : yb1 + 92, C.fq);
      });
      res.K.filter(k => k.soort === 'F').forEach(k => puntkracht(g, k, C.fg, true));
      // reactiekrachten (aangenomen positieve zin, met de berekende waarde)
      if (!res.fout) {
        const reactie = (x, naam, idx, waarde, soort) => {
          const xx = X(x);
          // labels onder de oplegging gestapeld: eerst A_y/B_y, daaronder A_x
          if (soort === 'x') { pijl(ctx, xx - 46, yb1 + 18, xx - 2, yb1 + 18, C.reac, 2.4); g.vlabel('R', naam + idx, st.opl ? ' = ' + fmtS(E().F(waarde)) + ' ' + E().uF : '', xx, yb1 + 101, C.reac); }
          else { pijl(ctx, xx, yb1 + 58, xx, yb1 + 2, C.reac, 2.4); g.vlabel('R', naam + idx, st.opl ? ' = ' + fmtS(E().F(waarde)) + ' ' + E().uF : '', xx, yb1 + 72, C.reac); }
        };
        if (st.type === 'steun') {
          reactie(res.a, 'A', 'x', res.Ax, 'x');
          reactie(res.a, 'A', 'y', res.Ay, 'y');
          reactie(res.b, 'B', 'y', res.By, 'y');
          ctx.font = '600 13px ' + css('--f-body'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('A', X(res.a), yb0 - 4); ctx.fillText('B', X(res.b), yb0 - 4);
        } else {
          const xk = res.xk;
          reactie(xk, 'A', 'x', res.Ax, 'x');
          reactie(xk, 'A', 'y', res.Ay, 'y');
          // inklemmingsmoment (aangenomen in tegenwijzerzin)
          const cx = X(xk), r = 30, links = st.kant === 'links';
          const a0 = links ? -1.2 : Math.PI - 1.2, a1 = links ? 1.2 : Math.PI + 1.2;
          ctx.strokeStyle = C.reac; ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.arc(cx, ym, r, a0, a1); ctx.stroke();
          // tegenwijzerzin op het scherm = afnemende hoek: pijlpunt bij a0
          const e = a0, px = cx + r * Math.cos(e), py = ym + r * Math.sin(e), tang = e - Math.PI / 2;
          ctx.fillStyle = C.reac; ctx.beginPath(); ctx.moveTo(px + 8 * Math.cos(tang), py + 8 * Math.sin(tang));
          ctx.lineTo(px + 5 * Math.cos(tang + 2.2), py + 5 * Math.sin(tang + 2.2)); ctx.lineTo(px + 5 * Math.cos(tang - 2.2), py + 5 * Math.sin(tang - 2.2)); ctx.closePath(); ctx.fill();
          g.label('M', 'A', st.opl ? ' = ' + fmtS(E().M(res.MA)) + ' ' + E().uM : '', cx + (links ? 70 : -70), ym - 44, C.reac);
          ctx.font = '600 13px ' + css('--f-body'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('A', cx + (links ? 10 : -10), yb0 - 4);
        }
      }
    }

    /* 3. Voorafgaande berekeningen */
    const U = E(), kn = v => fmtS(U.F(Math.abs(v))), ln = v => fmtS(U.L(v)), mn = v => fmtS(U.M(v)), fF = v => fmtS(U.F(v));
    const voor = [];
    res.K.forEach(k => {
      if (k.soort === 'q') {
        voor.push(`<div class="rk-blok"><b>Vervangkracht van q<sub>${k.nr}</sub></b>
          <div>F<sub>q${k.nr}</sub> = q<sub>${k.nr}</sub> · l = ${fmtS(U.q(k.q))} · ${ln(r2(k.e - k.s))} = <b class="c-a">${fF(k.F)} ${U.uF}</b> ${k.qdir > 0 ? '↓' : '↑'}</div>
          <div class="note">Aangrijpingspunt: in het midden van de verdeelde belasting, op x = ${ln(r2(k.x))} ${U.uL}.</div></div>`);
      } else if (k.schuin) {
        voor.push(`<div class="rk-blok"><b>Ontbinding van F<sub>${k.nr}</sub></b> (α = ${fmt(k.hoek)}°)
          <div>F<sub>${k.nr}x</sub> = F<sub>${k.nr}</sub> · cos α = ${fF(k.F)} · cos ${fmt(k.hoek)}° = <b>${kn(k.Fx)} ${U.uF}</b> ${k.Fx > 0 ? '→' : '←'}</div>
          <div>F<sub>${k.nr}y</sub> = F<sub>${k.nr}</sub> · sin α = ${fF(k.F)} · sin ${fmt(k.hoek)}° = <b>${kn(k.Fy)} ${U.uF}</b> ${k.Fy > 0 ? '↑' : '↓'}</div></div>`);
      }
    });
    $('voor').innerHTML = voor.length ? voor.join('') : '<p class="note">Er zijn geen verdeelde belastingen of schuine krachten. Er is dus niets vooraf te berekenen.</p>';

    /* 4. Evenwichtsvergelijkingen */
    if (!st.loads.length) { $('voor').innerHTML = '<p class="note">Voeg eerst een puntkracht of een verdeelde belasting toe.</p>'; $('ev').innerHTML = '<div class="leeg">Voeg eerst een belasting toe. Daarna verschijnen hier de evenwichtsvergelijkingen.</div>'; $('res').innerHTML = ''; return; }
    if (res.fout) { $('ev').innerHTML = `<div class="leeg">${res.fout}</div>`; $('res').innerHTML = ''; return; }
    const term = (v, txt, eerste = false) => {
      const neg = v < 0;
      return eerste ? (neg ? '−' : '') + txt : (neg ? ' − ' : ' + ') + txt;
    };
    const naamComp = (k, c) => k.soort === 'q' ? `F<sub>q${k.nr}</sub>` : (k.schuin ? `F<sub>${k.nr}${c}</sub>` : `F<sub>${k.nr}</sub>`);
    const fxK = res.K.filter(k => Math.abs(k.Fx) > eps);
    const fyK = res.K.filter(k => Math.abs(k.Fy) > eps);
    const P = res.P;
    const momK = res.K.filter(k => Math.abs(k.Fy) > eps && Math.abs(k.x - P) > eps);
    const arm = k => ln(r2(Math.abs(k.x - P)));
    // momenttermen: eerst in symbolen (kracht · arm), daarna met getallen
    const momSym = (k) => term(k.Fy * (k.x - P), `${naamComp(k, 'y')} · ${arm(k)}`);
    const momNum = (k) => term(k.Fy * (k.x - P), `${kn(k.Fy)} · ${arm(k)}`);
    const horNoot = fxK.length ? ' Horizontale krachten liggen op de as van de ligger en geven geen moment.' : '';
    // ΣFx
    let blokFx = `<div class="rk-blok"><b>ΣF<sub>x</sub> = 0</b>`;
    if (!fxK.length) blokFx += `<div>R<sub>Ax</sub> = 0</div><div>R<sub>Ax</sub> = <b class="c-m">0 ${U.uF}</b></div><div class="note">Er werken geen horizontale krachten op de ligger.</div>`;
    else {
      blokFx += `<div>R<sub>Ax</sub>${fxK.map(k => term(k.Fx, naamComp(k, 'x'))).join('')} = 0</div>`;
      blokFx += `<div>R<sub>Ax</sub>${fxK.map(k => term(k.Fx, kn(k.Fx))).join('')} = 0</div>`;
      blokFx += `<div>R<sub>Ax</sub> = <b class="c-m">${fF(res.Ax)} ${U.uF}</b></div>`;
    }
    blokFx += '</div>';
    let ev = blokFx;
    if (st.type === 'steun') {
      const rondA = res.rondA, Un = rondA ? 'R<sub>By</sub>' : 'R<sub>Ay</sub>', punt = rondA ? 'A' : 'B';
      const cU = r2(res.cU), Uw = rondA ? res.By : res.Ay;
      const S = r2(res.Smom);
      const uTerm = term(cU, `${Un} · ${ln(Math.abs(cU))}`, true);
      ev += `<div class="rk-blok"><div class="rk-mkop"><b>ΣM<sub>${punt}</sub> = 0</b>
        <span class="rk-keuze"><label class="vink"><input type="radio" name="rk-rond" value="A" ${rondA ? 'checked' : ''}>Momenten rond A</label>
        <label class="vink"><input type="radio" name="rk-rond" value="B" ${rondA ? '' : 'checked'}>Momenten rond B</label></span></div>`;
      ev += `<div>${uTerm}${momK.map(momSym).join('')} = 0</div>`;
      if (momK.length) ev += `<div>${uTerm}${momK.map(momNum).join('')} = 0</div>`;
      ev += `<div>${Un} · ${cU < 0 ? '(' + ln(cU) + ')' : ln(cU)} = ${mn(r2(-S))}</div>`;
      ev += `<div>${Un} = ${mn(r2(-S))} / ${cU < 0 ? '(' + ln(cU) + ')' : ln(cU)} = <b class="c-m">${fF(Uw)} ${U.uF}</b></div>`;
      ev += `<div class="note">${punt} is gekozen als momentpunt: ${rondA ? 'R<sub>Ax</sub> en R<sub>Ay</sub>' : 'R<sub>Ax</sub> en R<sub>By</sub>'} geven daar geen moment.${horNoot}</div></div>`;
      const V = rondA ? 'R<sub>Ay</sub>' : 'R<sub>By</sub>', Vw = rondA ? res.Ay : res.By;
      ev += `<div class="rk-blok"><b>ΣF<sub>y</sub> = 0</b>`;
      ev += `<div>R<sub>Ay</sub> + R<sub>By</sub>${fyK.map(k => term(k.Fy, naamComp(k, 'y'))).join('')} = 0</div>`;
      ev += `<div>${rondA ? V + term(Uw, kn(Uw)) : term(Uw, kn(Uw), true) + ' + ' + V}${fyK.map(k => term(k.Fy, kn(k.Fy))).join('')} = 0</div>`;
      ev += `<div>${V} = <b class="c-m">${fF(Vw)} ${U.uF}</b></div></div>`;
    } else {
      // inklemming: ΣFx → ΣFy → ΣM
      ev += `<div class="rk-blok"><b>ΣF<sub>y</sub> = 0</b>`;
      ev += `<div>R<sub>Ay</sub>${fyK.map(k => term(k.Fy, naamComp(k, 'y'))).join('')} = 0</div>`;
      if (fyK.length) ev += `<div>R<sub>Ay</sub>${fyK.map(k => term(k.Fy, kn(k.Fy))).join('')} = 0</div>`;
      ev += `<div>R<sub>Ay</sub> = <b class="c-m">${fF(res.Ay)} ${U.uF}</b></div></div>`;
      ev += `<div class="rk-blok"><b>ΣM<sub>A</sub> = 0</b>`;
      ev += `<div>M<sub>A</sub>${momK.map(momSym).join('')} = 0</div>`;
      if (momK.length) ev += `<div>M<sub>A</sub>${momK.map(momNum).join('')} = 0</div>`;
      ev += `<div>M<sub>A</sub> = <b class="c-m">${mn(res.MA)} ${U.uM}</b></div>`;
      ev += `<div class="note">Het momentpunt is de inklemming A: R<sub>Ax</sub> en R<sub>Ay</sub> geven daar geen moment.${horNoot}</div></div>`;
    }
    $('ev').innerHTML = ev;

    /* Resultaat */
    const zin = (naam, v, pos, neg, eenh = U.uF) => `<div>${naam} = <b class="c-m">${eenh === U.uM ? mn(v) : fF(v)} ${eenh}</b>${Math.abs(v) < 0.005 ? '' : v > 0 ? ` → werkelijke zin: ${pos}` : ` → negatief: de werkelijke zin is ${neg}, tegengesteld aan de aangenomen zin`}</div>`;
    let rs = zin('R<sub>Ax</sub>', res.Ax, 'naar rechts', 'naar links') + zin('R<sub>Ay</sub>', res.Ay, 'naar boven', 'naar beneden');
    if (st.type === 'steun') rs += zin('R<sub>By</sub>', res.By, 'naar boven', 'naar beneden');
    else rs += zin('M<sub>A</sub>', res.MA, 'tegenwijzerzin ↺', 'wijzerzin ↻', U.uM);
    $('res').innerHTML = rs;
  }

  const tekenAlles = teken;
  const origTeken = teken;
  st.rond = st.xA <= st.xB ? 'A' : 'B';
  kies();
  tekenLasten();
  const ro = new ResizeObserver(() => origTeken());
  [cv1, cv2].forEach(c => ro.observe(c));
  tekenAlles();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tekenAlles);
  return () => ro.disconnect();
}

/* ============================================================
   APPLET: Het joule-effect (5BCT)
   Kring met regelbare bron, schakelaar en regelbare weerstand +
   deeltjessimulatie in de weerstand (elektronen botsen tegen ionen).
   Warmtemodel: C·dT/dt = P − k·(T − T0)
   ============================================================ */
function renderJoule(root) {
  const T0 = 20, CW = 10, KV = 0.5;            // omgevingstemperatuur (°C), warmtecapaciteit (J/K), warmteafgifte (W/K)
  const UMAX = 12, RMIN = 1, RMAX = 50, IMAX = UMAX / RMIN;
  const st = { U: 6, R: 10, dicht: false, T: T0, W: 0, t: 0, hist: [], botsingen: [] };

  const ctrl = (id, label, min, max, step, eenh) => `
      <div class="ctrl">
        <label for="jo-${id}">${label}</label>
        <div class="rij">
          <input type="range" id="jo-${id}" min="${min}" max="${max}" step="${step}">
          <input type="number" id="jo-${id}n" min="${min}" max="${max}" step="${step}" aria-label="${label.replace(/<[^>]+>/g, '')} in ${eenh}">
          <span class="eenh">${eenh}</span>
        </div>
      </div>`;

  root.innerHTML = `
  <div class="erb">
    <div class="jo-lay">
      <div class="paneel graf">
        <div class="kop"><h2>De elektrische kring</h2><span class="legende"><span><i class="jo-e"></i>elektron</span></span></div>
        <div class="jo-kringwrap">
          <div class="doek jo-kring"><canvas id="jo-kring" role="img" aria-label="Elektrische kring met bron, schakelaar en weerstand"></canvas></div>
          <div class="jo-instel jo-links">
            <span class="lbl-klein">Bron</span>
            ${ctrl('U', 'Spanning U', 0, UMAX, 0.5, 'V')}
          </div>
          <div class="jo-instel jo-rechts">
            <span class="lbl-klein">Weerstand</span>
            ${ctrl('R', 'Weerstand R', RMIN, RMAX, 1, 'Ω')}
          </div>
        </div>
        <p class="uitleg klein">Klik op de schakelaar om hem te sluiten of te openen.</p>
        <label class="vink"><input type="checkbox" id="jo-vber">Vermogen en opgewekte warmte berekenen</label>
        <div class="jo-ber" id="jo-ber" hidden>
          <div class="ctrl jo-dt"><label for="jo-dt">Tijdsinterval Δt</label>
            <div class="rij"><input type="number" id="jo-dt" min="1" max="36000" step="1" value="60"><span class="eenh">s</span></div></div>
          <div class="val" id="jo-berek"></div>
        </div>
      </div>
      <div class="paneel graf">
        <div class="kop"><h2>Wat gebeurt er in de weerstand?</h2><span class="legende"><span><i class="jo-e"></i>elektron</span><span><i class="jo-i"></i>ion (atoomkern)</span><span><i class="jo-b"></i>botsing</span></span></div>
        <div class="doek jo-micro"><canvas id="jo-micro" role="img" aria-label="Elektronen botsen tegen trillende ionen in de weerstand"></canvas></div>
        <div class="jo-stats">
          <span>Botsingen per seconde: <b id="jo-bps" class="c-a">0</b> <span class="jo-klein">(gemiddelde over 3 s)</span></span>
          <span>Temperatuur van de weerstand: <b id="jo-temp">20 °C</b></span>
        </div>
        <label class="vink"><input type="checkbox" id="jo-vuit">Uitleg tonen</label>
        <p class="uitleg klein" id="jo-uitleg" hidden></p>
      </div>
    </div>
  </div>`;

  const $ = id => root.querySelector('#jo-' + id);
  const cvK = $('kring'), cvM = $('micro');

  function koppel(id, key, min, max) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(val); if (!isFinite(x)) return;
      x = Math.min(max, Math.max(min, x)); st[key] = x;
      if (bron !== r) r.value = x; if (bron !== n) n.value = x;
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = st[key]; });
    r.value = n.value = st[key];
  }
  koppel('U', 'U', 0, UMAX);
  koppel('R', 'R', RMIN, RMAX);
  const schakel = () => { st.dicht = !st.dicht; };
  st.dt = 60;
  $('vuit').addEventListener('change', () => { $('uitleg').hidden = !$('vuit').checked; });
  $('vber').addEventListener('change', () => { $('ber').hidden = !$('vber').checked; teksten(); });
  $('dt').addEventListener('input', () => { const v = parseFloat($('dt').value); if (isFinite(v) && v > 0) { st.dt = v; teksten(); } });
  $('dt').addEventListener('change', () => { $('dt').value = st.dt; });

  const stroom = () => st.dicht ? st.U / st.R : 0;
  const vermogen = () => { const I = stroom(); return I * I * st.R; };

  /* ---------- deeltjes in de weerstand ---------- */
  const ionen = [], elek = [];
  let mw = 0, mh = 0;
  function maakDeeltjes(w, h) {
    ionen.length = 0; elek.length = 0;
    const kol = Math.max(6, Math.round(w / 70)), rij = 5;
    const dx = w / kol, dy = (h - 30) / rij;
    for (let i = 0; i < kol; i++) for (let j = 0; j < rij; j++) {
      ionen.push({ x0: dx * (i + 0.5) + (j % 2 ? dx * 0.25 : -dx * 0.25), y0: 15 + dy * (j + 0.5), kick: 0, fase: Math.random() * 6.28, fy: Math.random() * 6.28, flits: 0 });
    }
    const n = Math.round(kol * rij * 1.6);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28;
      elek.push({ x: Math.random() * w, y: 15 + Math.random() * (h - 30), vx: Math.cos(a) * 50, vy: Math.sin(a) * 50 });
    }
    mw = w; mh = h;
  }

  /* ---------- kleuren ---------- */
  const mix = (c1, c2, t) => c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
  function gloei(T) { // kleur van de weerstand volgens de temperatuur
    const s = Math.min(1, Math.max(0, (T - T0) / 280));
    const stops = [[70, 76, 90], [150, 40, 30], [235, 90, 30], [255, 190, 70]];
    const p = s * 3, i = Math.min(2, Math.floor(p));
    const c = mix(stops[i], stops[i + 1], p - i);
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  /* ---------- tekenen: kring ---------- */
  let eFase = 0;
  let schakelZone = null;
  function tekenKring() {
    const { ctx, w, h } = prepCanvas(cvK);
    const C = { fg: css('--fg'), muted: css('--muted'), bg: css('--panel'), e: css('--b'), I: css('--a') };
    const naast = window.matchMedia('(min-width: 640px)').matches; // instellingen naast de componenten
    const smal = !naast && w < 640, mg = naast ? Math.min(w * 0.28, 160) + 68 : 60;
    const x0 = mg, x1 = w - mg, y0 = 56, y1 = h - 48;
    const midY = (y0 + y1) / 2, midX = (x0 + x1) / 2;
    ctx.lineWidth = 3; ctx.strokeStyle = C.fg; ctx.lineCap = 'round';
    // draden met openingen voor de componenten
    const bronH = 34, wH = 90, sL = midX - 30, sR = midX + 30;
    const lijn = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
    lijn(x0, y0, sL, y0); lijn(sR, y0, x1, y0);
    lijn(x1, y0, x1, midY - wH / 2); lijn(x1, midY + wH / 2, x1, y1);
    lijn(x1, y1, x0, y1);
    lijn(x0, y1, x0, midY + bronH / 2); lijn(x0, midY - bronH / 2, x0, y0);
    // regelbare bron (lange plaat = +)
    ctx.lineWidth = 3; lijn(x0 - 24, midY - bronH / 2, x0 + 24, midY - bronH / 2);
    ctx.lineWidth = 7; lijn(x0 - 12, midY + bronH / 2, x0 + 12, midY + bronH / 2);
    ctx.lineWidth = 1.6; ctx.strokeStyle = C.fg;
    pijl(ctx, x0 - 30, midY + 28, x0 + 30, midY - 28, C.fg, 1.6);
    ctx.font = '600 13px ' + css('--f-mono'); ctx.fillStyle = C.fg; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('+', x0 - 30, midY - bronH / 2 - 8); ctx.fillText('−', x0 - 18, midY + bronH / 2 + 10);
    // schakelaar
    ctx.strokeStyle = C.fg; ctx.lineWidth = 3;
    ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(sL, y0, 4.5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(sR, y0, 4.5, 0, 7); ctx.fill();
    const hoek = st.dicht ? 0 : -0.55;
    lijn(sL, y0, sL + 60 * Math.cos(hoek), y0 + 60 * Math.sin(hoek));
    schakelZone = { x: sL - 10, y: y0 - 45, w: 80, h: 60 };
    ctx.font = '500 12px ' + css('--f-body'); ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(st.dicht ? 'gesloten' : 'open', midX, y0 - 34);
    // regelbare weerstand met gloed
    const rw = 30, ry0 = midY - wH / 2;
    ctx.save();
    ctx.shadowColor = gloei(st.T); ctx.shadowBlur = Math.min(40, Math.max(0, (st.T - 40) / 6));
    ctx.fillStyle = gloei(st.T); ctx.fillRect(x1 - rw / 2, ry0, rw, wH);
    ctx.restore();
    ctx.strokeStyle = C.fg; ctx.lineWidth = 2.5; ctx.strokeRect(x1 - rw / 2, ry0, rw, wH);
    pijl(ctx, x1 - 30, midY + 32, x1 + 30, midY - 32, C.fg, 1.6);
    // warmtegolfjes bij hoge temperatuur
    if (st.T > 35) {
      const a = Math.min(1, (st.T - 35) / 120);
      ctx.strokeStyle = gloei(st.T); ctx.globalAlpha = a; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        for (let y = 0; y <= 34; y += 2) { const xx = x1 + 30 + k * 0 + Math.sin((y + eFase * 40) / 5) * 4 + 26 * (k + 1) / 2 - 8; const yy = ry0 + 10 + y + k * 22; y === 0 ? ctx.moveTo(xx + 14, yy) : ctx.lineTo(xx + 14, yy); }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // stroomzin (conventioneel) en elektronen
    const I = stroom();
    if (I > 0) {
      ctx.font = '600 12px ' + css('--f-mono'); ctx.fillStyle = C.I; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      pijl(ctx, x0 + (sL - x0) * 0.35, y0 - 12, x0 + (sL - x0) * 0.65, y0 - 12, C.I, 2);
      ctx.fillText('I = ' + fmt(I) + ' A', x0 + (sL - x0) * 0.5, y0 - 18);
    }
    // elektronen langs de kring (tegen de stroomzin in)
    const pad = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
    const lens = [x1 - x0, y1 - y0, x1 - x0, y1 - y0], omtrek = lens.reduce((a, b) => a + b, 0);
    const punt = s => { s = ((s % omtrek) + omtrek) % omtrek; for (let i = 0; i < 4; i++) { if (s <= lens[i]) { const [ax, ay] = pad[i], [bx, by] = pad[(i + 1) % 4]; const t = s / lens[i]; return [ax + (bx - ax) * t, ay + (by - ay) * t]; } s -= lens[i]; } return pad[0]; };
    const n = Math.round(omtrek / 26);
    ctx.fillStyle = C.e;
    for (let k = 0; k < n; k++) {
      const [px, py] = punt(k * omtrek / n - eFase * 60);
      ctx.beginPath(); ctx.arc(px, py, 3.4, 0, 7); ctx.fill();
    }
    ctx.font = '500 11px ' + css('--f-body'); ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(I > 0 ? (smal ? 'Elektronen: van − naar +' : 'De elektronen bewegen van − naar +, tegen de (conventionele) stroomzin in.') : 'Schakelaar open: er loopt geen stroom.', midX, y1 + 14);
  }

  /* ---------- tekenen: binnenin de weerstand ---------- */
  function tekenMicro(dt) {
    const { ctx, w, h } = prepCanvas(cvM);
    if (Math.abs(w - mw) > 2 || Math.abs(h - mh) > 2) maakDeeltjes(w, h);
    const I = stroom(), sT = Math.min(1, (st.T - T0) / 280);
    // achtergrond kleurt warm mee
    ctx.fillStyle = gloei(st.T); ctx.globalAlpha = 0.08 + 0.22 * sT; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;
    const drift = I > 0 ? 18 + 130 * (I / IMAX) : 0;     // px/s naar rechts
    const amp = 0.8 + 7 * Math.sqrt(sT);                 // trillingsamplitude door temperatuur
    const t = st.t;
    // ionposities
    ionen.forEach(o => {
      o.kick *= Math.exp(-dt * 1.5); o.flits = Math.max(0, o.flits - dt * 3);
      const A = amp + o.kick;
      o.x = o.x0 + A * Math.sin(t * 22 + o.fase);
      o.y = o.y0 + A * Math.cos(t * 19 + o.fy);
    });
    // elektronen bewegen, botsen
    let bots = 0;
    elek.forEach(e => {
      e.vx += (drift - e.vx) * dt * 0.8;              // het elektrisch veld versnelt naar rechts
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y < 8) { e.y = 8; e.vy = Math.abs(e.vy); } if (e.y > h - 8) { e.y = h - 8; e.vy = -Math.abs(e.vy); }
      if (e.x > w + 4) e.x = -4; if (e.x < -4) e.x = w + 4;
      for (const o of ionen) {
        const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy);
        if (d < 13) {
          const snel = Math.hypot(e.vx, e.vy);
          // energie gaat naar het ion: extra trilling
          if (I > 0) { o.kick = Math.min(9, o.kick + 0.25 + snel / 140); o.flits = 1; bots++; }
          const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.6;
          e.x = o.x + Math.cos(a) * 14; e.y = o.y + Math.sin(a) * 14;
          e.vx = Math.cos(a) * 45; e.vy = Math.sin(a) * 45;
          break;
        }
      }
    });
    st.botsingen.push({ t, n: bots }); while (st.botsingen.length && st.botsingen[0].t < t - 3) st.botsingen.shift();
    // tekenen ionen
    const ionKleur = gloei(Math.max(T0 + 60, st.T));
    ionen.forEach(o => {
      if (o.flits > 0) { ctx.strokeStyle = css('--a'); ctx.globalAlpha = o.flits; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(o.x, o.y, 15 + (1 - o.flits) * 8, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.fillStyle = st.T > 40 ? ionKleur : css('--axis');
      ctx.beginPath(); ctx.arc(o.x, o.y, 10, 0, 7); ctx.fill();
      ctx.fillStyle = css('--fg'); ctx.font = '700 12px ' + css('--f-mono'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', o.x, o.y + 0.5);
    });
    ctx.fillStyle = css('--b');
    elek.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, 3.2, 0, 7); ctx.fill(); });
    // richting van de elektronen
    if (I > 0) {
      ctx.fillStyle = css('--panel'); ctx.globalAlpha = 0.85; ctx.fillRect(w - 236, h - 26, 230, 20); ctx.globalAlpha = 1;
      pijl(ctx, w - 226, h - 16, w - 186, h - 16, css('--b'), 2);
      ctx.font = '500 11px ' + css('--f-body'); ctx.fillStyle = css('--fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('beweging van de elektronen', w - 180, h - 16);
    }
  }

  function teksten() {
    // gemiddeld aantal botsingen per seconde over de laatste 3 seconden
    const bps = Math.round(st.botsingen.reduce((a, b) => a + b.n, 0) / Math.max(0.5, Math.min(3, st.t)));
    $('bps').textContent = bps;
    if (!$('ber').hidden) {
      const U = st.dicht ? st.U : 0, I = stroom(), P = U * I, Q = P * st.dt;
      $('berek').innerHTML = st.dicht
        ? `I = U / R = ${fmt(st.U)} / ${fmt(st.R)} = <b class="c-a">${fmt(I)} A</b><br>` +
          `P = U · I = ${fmt(st.U)} · ${fmt(I)} = <b class="c-m">${fmt(P)} W</b><br>` +
          `Q = P · Δt = ${fmt(P)} · ${fmt(st.dt)} = <b class="c-m">${fmt(Q)} J</b>` + (Q >= 1000 ? ` = ${fmt(Q / 1000)} kJ` : '')
        : 'De schakelaar is open: er loopt geen stroom (I = 0 A), dus P = 0 W en er wordt geen warmte opgewekt.';
    }
    $('temp').textContent = fmt(st.T, 1) + ' °C';
    $('temp').style.color = st.T > 30 ? gloei(Math.max(st.T, 120)) : '';
    $('uitleg').innerHTML = !st.dicht
      ? 'De schakelaar is open: de elektronen bewegen kriskras door elkaar, maar schuiven niet op. Er is geen stroom, dus ook geen joule-effect. De ionen trillen alleen een beetje door de temperatuur van de omgeving.'
      : 'De bron duwt de elektronen door de weerstand. Onderweg botsen ze tegen de ionen (de atoomkernen met hun vaste elektronen). Bij elke botsing geven ze energie af: de ionen gaan heviger <b>trillen</b>. Hevigere trillingen betekenen een hogere <b>temperatuur</b>: elektrische energie wordt omgezet in <b>warmte</b>. Dat is het joule-effect.';
  }

  /* ---------- lus ---------- */
  let raf = 0, vorige = null, laatsteGraf = 0, laatsteTekst = 0;
  function lus(ts) {
    if (vorige == null) vorige = ts;
    const dt = Math.min(0.05, (ts - vorige) / 1000); vorige = ts;
    st.t += dt;
    const P = vermogen();
    st.T += (P - KV * (st.T - T0)) / CW * dt;
    st.W += P * dt;
    eFase += dt * (stroom() / IMAX) * 3.2;
    tekenKring();
    tekenMicro(dt);
    if (st.t - laatsteTekst > 0.2) { teksten(); laatsteTekst = st.t; }
    raf = requestAnimationFrame(lus);
  }
  cvK.addEventListener('click', e => {
    if (!schakelZone) return;
    const r = cvK.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, z = schakelZone;
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) schakel();
  });
  cvK.addEventListener('mousemove', e => {
    if (!schakelZone) return;
    const r = cvK.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, z = schakelZone;
    cvK.style.cursor = (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) ? 'pointer' : 'default';
  });
  st.hist.push({ t: 0, T: T0 });
  teksten();
  raf = requestAnimationFrame(lus);
  return () => cancelAnimationFrame(raf);
}

/* ============================================================
   APPLET: De trekproef van staal (5TWE)
   Schematische σ-ε-curve van zacht staal (niet op schaal voor ε),
   trekstaafje l0 = 100 mm, d0 = 10 mm.
   ============================================================ */
function renderTrek(root) {
  const L0 = 100, D0 = 10, A0 = Math.PI * D0 * D0 / 4;
  // kenmerkende punten (ε [−], σ [MPa])
  const EP = 0.020, SP = 220, EA = 0.024, SA = 240, EV = 0.028, SV = 262, EPL = 0.075, SPL = 245, EM = 0.19, SM = 400, EB = 0.26, SB = 340;
  function sigma(e) {
    if (e <= EP) return SP * e / EP;
    if (e <= EA) { const f = (e - EP) / (EA - EP); return SP + (SA - SP) * (1 - (1 - f) * (1 - f)); }
    if (e <= EV) { const g = (e - EA) / (EV - EA); return SA + (SV - SA) * Math.sin(Math.PI / 2 * g); }
    if (e <= EPL) {
      const d = e - EV, per = (EPL - EV) / 6;
      return SPL + (SV - SPL) * Math.exp(-d / 0.0015) + 7 * Math.sin(2 * Math.PI * d / per) * (1 - Math.exp(-d / 0.003));
    }
    if (e <= EM) { const h = (e - EPL) / (EM - EPL); return SPL + (SM - SPL) * (1 - (1 - h) * (1 - h)); }
    return SM - (SM - SB) * Math.pow(Math.min(1, (e - EM) / (EB - EM)), 1.6);
  }
  const STAPPEN = [
    { e: 0.010, naam: 'Lineair gebied', titel: 'Stap 1 – Het lineaire (elastische) gebied',
      tekst: 'Bij het begin van de trekproef is er een recht evenredig verband tussen de spanning σ en de relatieve rek ε. Dat verband is de <b>wet van Hooke</b>. De evenredigheidsconstante, de richtingscoëfficiënt van de rechte, is de <b>elasticiteitsmodulus E</b> (voor staal ongeveer 210 000 MPa). Wordt het staafje nu ontlast, dan krijgt het zijn oorspronkelijke lengte terug.',
      formule: 'σ = E · ε' },
    { e: EP, naam: 'Proportionaliteitsgrens', titel: 'Stap 2 – De proportionaliteitsgrens R<sub>p</sub> (punt P)',
      tekst: 'Tot hier is de spanning recht evenredig met de relatieve rek. Boven de <b>proportionaliteitsgrens R<sub>p</sub></b> volgt het materiaal de wet van Hooke niet meer: de curve is geen rechte meer. Het staafje vervormt wel nog <b>elastisch</b>.',
      formule: 'tot R<sub>p</sub>: σ = E · ε' },
    { e: EA, naam: 'Elasticiteitsgrens', titel: 'Stap 3 – De elasticiteitsgrens R<sub>e</sub> (punt A)',
      tekst: 'Tot en met de <b>elasticiteitsgrens R<sub>e</sub></b> (ook rekgrens genoemd) is de vervorming elastisch: na ontlasting krijgt het staafje zijn oorspronkelijke afmetingen terug. Bij een grotere spanning treedt <b>plastische vervorming</b> op: die vervorming is blijvend, ook na het wegnemen van de last. Tussen R<sub>p</sub> en R<sub>e</sub> ligt een klein gebied waar de wet van Hooke niet meer geldt, maar de vervorming nog elastisch is.',
      formule: '' },
    { e: EV, naam: 'Vloeigrens', titel: 'Stap 4 – De vloeigrens R<sub>v</sub>',
      tekst: 'Bij het bereiken van de <b>vloeigrens R<sub>v</sub></b> gaat het materiaal <b>vloeien</b>: het staalrooster herstructureert zich om hogere spanningen te kunnen verdragen. Dat gaat gepaard met een golvende beweging: de verlenging neemt schoksgewijs toe. Je herkent het vloeien aan drie dingen: het staafje wordt merkbaar <b>warm</b> (de moleculen wrijven over elkaar), het oppervlak wordt <b>mat</b>, en de lengte neemt toe terwijl de doorsnede kleiner wordt (<b>contractie</b>).',
      formule: '' },
    { e: EM, naam: 'Treksterkte', titel: 'Stap 5 – De treksterkte R<sub>m</sub>',
      tekst: 'De <b>treksterkte R<sub>m</sub></b> is de maximale spanning die in het materiaal kan optreden. Daarna maakt de curve een duik: het staafje gaat op de zwakste plaats <b>insnoeren</b> en de doorsnede wordt daar kleiner. De trekbank meet dat niet, maar voelt wel dat hij minder kracht moet zetten. Daardoor lijkt het alsof de spanning daalt, terwijl ze in werkelijkheid in de insnoering niet daalt.',
      formule: 'R<sub>m</sub> = F<sub>m</sub> / A' },
    { e: EB, naam: 'Breekpunt', titel: 'Stap 6 – Het breekpunt',
      tekst: 'In de insnoering wordt de doorsnede zo klein dat het staafje <b>breekt</b>. De trekproef is gedaan. Uit de curve haal je de kenmerkende waarden van het staal: R<sub>p</sub>, R<sub>e</sub>, R<sub>v</sub>, R<sub>m</sub> en de rek bij breuk.',
      formule: '' }
  ];
  const st = { e: 0, loopt: false, stap: -1, doel: null };

  root.innerHTML = `
  <div class="erb">
    <div class="paneel tr-kop">
      <div class="chips" id="tr-stappen">${STAPPEN.map((s, i) => `<button type="button" class="sit tr-stap" data-i="${i}" disabled><span class="tr-nr">${i + 1}</span>${s.naam}</button>`).join('')}</div>
      <div class="knoppen">
        <button class="knop tr-hoofd" type="button" id="tr-start">▶ Start de trekproef</button>
        <button class="knop" type="button" id="tr-pauze" hidden>⏸ Pauze</button>
        <button class="knop" type="button" id="tr-opnieuw">↺ Opnieuw</button>
      </div>
    </div>
    <div class="tr-lay">
      <div class="paneel graf">
        <div class="kop"><h2>Trekbank</h2><span class="legende">trekstaafje vergroot getekend</span></div>
        <div class="doek tr-doek"><canvas id="tr-bank" role="img" aria-label="Trekbank met trekstaafje"></canvas></div>
      </div>
      <div class="paneel graf">
        <div class="kop"><h2>Trek-rekcurve</h2><span class="legende">ε niet op schaal</span></div>
        <div class="doek tr-doek"><canvas id="tr-curve" role="img" aria-label="Spanning in functie van de relatieve rek"></canvas></div>
      </div>
    </div>
    <div class="tr-onder">
      <div class="paneel tr-uitleg"><h2 id="tr-titel"></h2><p id="tr-tekst"></p><div class="tr-formule" id="tr-formule"></div></div>
      <div class="uit"><div class="titel"><h2>Metingen</h2></div><span class="val" id="tr-meet"></span>
        <span class="note">Trekstaafje: l<sub>0</sub> = ${L0} mm, d<sub>0</sub> = ${D0} mm, A = ${fmt(A0, 1)} mm². σ = F / A en ε = Δl / l<sub>0</sub>.</span></div>
    </div>
  </div>`;
  const $ = id => root.querySelector('#tr-' + id);
  const cvB = $('bank'), cvC = $('curve');

  /* ---------- bediening ---------- */
  const volgendeStop = () => STAPPEN.findIndex(s => s.e > st.e + 1e-9);
  function start() {
    const i = volgendeStop(); if (i < 0) return;
    st.doel = i; st.loopt = true; knoppen();
  }
  function knoppen() {
    const klaar = st.e >= EB - 1e-9;
    $('start').textContent = st.e === 0 ? '▶ Start de trekproef' : klaar ? 'Trekproef voltooid' : '▶ Volgende stap';
    $('start').disabled = st.loopt || klaar;
    $('pauze').hidden = !st.loopt && !st.gepauzeerd;
    $('pauze').textContent = st.loopt ? '⏸ Pauze' : '▶ Hervat';
    root.querySelectorAll('.tr-stap').forEach(b => {
      const i = +b.dataset.i;
      b.disabled = STAPPEN[i].e > st.e + 1e-9 && i !== st.doel;
      b.setAttribute('aria-pressed', String(i === st.stap));
      b.classList.toggle('bereikt', STAPPEN[i].e <= st.e + 1e-9);
    });
  }
  $('start').addEventListener('click', start);
  $('pauze').addEventListener('click', () => { if (st.loopt) { st.loopt = false; st.gepauzeerd = true; } else { st.loopt = true; st.gepauzeerd = false; } knoppen(); });
  $('opnieuw').addEventListener('click', () => { st.e = 0; st.loopt = false; st.gepauzeerd = false; st.stap = -1; st.doel = null; uitleg(); knoppen(); });
  $('stappen').addEventListener('click', ev => {
    const b = ev.target.closest('.tr-stap'); if (!b || b.disabled) return;
    const i = +b.dataset.i; st.e = STAPPEN[i].e; st.stap = i; st.loopt = false; st.gepauzeerd = false; st.doel = null; uitleg(); knoppen();
  });

  function uitleg() {
    if (st.stap < 0) {
      $('titel').textContent = 'De trekproef';
      $('tekst').innerHTML = 'In een trekbank wordt een trekstaafje steeds verder uitgerekt. De trekbank registreert de kracht F en de verlenging Δl. Daaruit berekenen we de spanning σ = F / A en de relatieve rek ε = Δl / l<sub>0</sub>, en tekenen we de trek-rekcurve. Druk op <b>Start</b>: de simulatie stopt telkens bij een belangrijk punt van de curve.';
      $('formule').innerHTML = 'σ = F / A &nbsp;&nbsp;&nbsp; ε = Δl / l<sub>0</sub>';
      return;
    }
    const s = STAPPEN[st.stap];
    $('titel').innerHTML = s.titel; $('tekst').innerHTML = s.tekst; $('formule').innerHTML = s.formule;
    $('formule').hidden = !s.formule;
  }

  /* ---------- tekenen: trekbank ---------- */
  const warmte = e => e < EV ? 0 : e < EPL ? (e - EV) / (EPL - EV) : Math.max(0, 1 - (e - EPL) / 0.06);
  const gebroken = () => st.e >= EB - 1e-9;
  function tekenBank() {
    const { ctx, w, h } = prepCanvas(cvB);
    const C = { fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), bg: css('--panel'), vul: css('--panel-2'), rood: css('--trek'), lijn: css('--line') };
    const cx = w / 2;
    const voetY = h - 30, voetH = 22;
    const GRIP = 30, OVERG = 12, DK = 18;            // mm: kop, overgang, kopdiameter
    const Lmax = 2 * GRIP + 2 * OVERG + L0 * (1 + EB);
    const s = (h - 150) / Lmax;                       // px per mm
    const l = L0 * (1 + st.e);
    // diameter in het meetgebied: contractie (volume constant) en insnoering na R_m
    const ePl = Math.max(0, st.e - EA);
    const dU = D0 / Math.sqrt(1 + ePl);
    const ins = st.e > EM ? 0.5 * Math.pow((st.e - EM) / (EB - EM), 1.3) : 0;
    const onder = voetY - voetH - 10;                // onderkant staafje
    const boven = onder - (2 * GRIP + 2 * OVERG + l) * s;
    // kolommen en dwarsbalk
    const kolX = Math.min(130, w * 0.32);
    ctx.fillStyle = C.vul; ctx.strokeStyle = C.axis; ctx.lineWidth = 1.5;
    ctx.fillRect(cx - kolX - 40, voetY - voetH, 2 * kolX + 80, voetH); ctx.strokeRect(cx - kolX - 40, voetY - voetH, 2 * kolX + 80, voetH);
    [cx - kolX, cx + kolX].forEach(x => { ctx.fillStyle = C.vul; ctx.fillRect(x - 9, 24, 18, voetY - voetH - 24); ctx.strokeRect(x - 9, 24, 18, voetY - voetH - 24);
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1; for (let y = 30; y < voetY - voetH; y += 8) { ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y + 4); ctx.stroke(); } ctx.strokeStyle = C.axis; ctx.lineWidth = 1.5; });
    const balkY = boven - 26;
    ctx.fillStyle = C.vul; ctx.fillRect(cx - kolX - 22, balkY - 24, 2 * kolX + 44, 24); ctx.strokeRect(cx - kolX - 22, balkY - 24, 2 * kolX + 44, 24);
    // klemmen
    const klem = (yTop, hgt) => { ctx.fillStyle = C.axis; ctx.fillRect(cx - 26, yTop, 52, hgt); ctx.strokeStyle = C.fg; ctx.lineWidth = 1; ctx.strokeRect(cx - 26, yTop, 52, hgt); };
    klem(balkY, GRIP * s + 4);
    klem(onder - GRIP * s - 4, GRIP * s + 4 + 10);
    // staafje
    const warm = warmte(st.e);
    const kleur = `rgb(${Math.round(170 + 85 * warm)},${Math.round(178 - 40 * warm)},${Math.round(190 - 110 * warm)})`;
    const stuk = (y0, y1, rechts) => { // contour van y0 (boven) tot y1 (onder) met straal-functie
      ctx.beginPath();
      const n = 120;
      for (let k = 0; k <= n; k++) { const y = y0 + (y1 - y0) * k / n; const r = rechts(y); k ? ctx.lineTo(cx + r, y) : ctx.moveTo(cx + r, y); }
      for (let k = n; k >= 0; k--) { const y = y0 + (y1 - y0) * k / n; ctx.lineTo(cx - rechts(y), y); }
      ctx.closePath();
    };
    const yMeetB = boven + (GRIP + OVERG) * s, yMeetO = onder - (GRIP + OVERG) * s, yMid = (yMeetB + yMeetO) / 2;
    const straal = y => {
      if (y < boven + GRIP * s || y > onder - GRIP * s) return DK / 2 * s;
      if (y < yMeetB) { const f = (y - boven - GRIP * s) / (OVERG * s); return (DK / 2 - (DK / 2 - dU / 2) * Math.sin(f * Math.PI / 2)) * s; }
      if (y > yMeetO) { const f = (onder - GRIP * s - y) / (OVERG * s); return (DK / 2 - (DK / 2 - dU / 2) * Math.sin(f * Math.PI / 2)) * s; }
      const z = (y - yMid) / (8 * s);
      return dU / 2 * (1 - ins * Math.exp(-z * z)) * s;
    };
    const vul = () => { ctx.fillStyle = kleur; ctx.fill(); ctx.strokeStyle = C.fg; ctx.lineWidth = 1.2; ctx.stroke(); };
    if (!gebroken()) { stuk(boven, onder, straal); vul(); }
    else {
      const gap = 10;
      ctx.save(); ctx.translate(0, -gap); stuk(boven, yMid - 1, straal); vul(); ctx.restore();
      stuk(yMid + 1, onder, straal); vul();
    }
    // mat oppervlak na het vloeien
    if (st.e > EV + 0.004) {
      const dicht = Math.min(1, (st.e - EV) / 0.04);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      for (let k = 0; k < 140 * dicht; k++) {
        const y = yMeetB + ((k * 37) % 100) / 100 * (yMeetO - yMeetB), r = straal(y) * 0.85;
        const x = cx + (((k * 53) % 100) / 50 - 1) * r;
        if (gebroken() && Math.abs(y - yMid) < 3) continue;
        ctx.fillRect(x, y - (gebroken() && y < yMid ? 10 : 0), 1.5, 1.5);
      }
    }
    // meetmerken l0 → l
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1;
    const mx = cx + DK / 2 * s + 26;
    [yMeetB - (gebroken() ? 10 : 0), yMeetO].forEach(y => { ctx.beginPath(); ctx.moveTo(cx + straal(y) + 3, y); ctx.lineTo(mx + 6, y); ctx.stroke(); });
    pijl(ctx, mx, (yMeetB + yMeetO) / 2, mx, yMeetB - (gebroken() ? 10 : 0) + 1, C.fg, 1);
    pijl(ctx, mx, (yMeetB + yMeetO) / 2, mx, yMeetO - 1, C.fg, 1);
    ctx.font = '600 12px ' + css('--f-mono'); ctx.fillStyle = C.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.save(); ctx.translate(mx + 6, (yMeetB + yMeetO) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('l = ' + fmt(l, 1) + ' mm', 0, 0); ctx.restore();
    // warmte en insnoering aanduiden
    if (warm > 0.15) {
      ctx.strokeStyle = css('--trek'); ctx.globalAlpha = Math.min(1, warm); ctx.lineWidth = 1.6;
      for (let k = -1; k <= 1; k += 2) { ctx.beginPath(); for (let y = 0; y <= 40; y += 2) { const xx = cx + k * (DK * s * 0.9) + Math.sin(y / 4 + st.e * 600) * 3; const yy = yMid - 20 + y; y ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    if (ins > 0.05 && !gebroken()) {
      ctx.font = '500 11px ' + css('--f-body'); ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('insnoering', cx - DK / 2 * s - 10, yMid);
    }
    // krachtpijlen
    const F = gebroken() ? 0 : sigma(st.e) * A0 / 1000;
    if (F > 0.01) {
      pijl(ctx, cx, balkY - 30, cx, balkY - 30 - Math.min(60, 10 + F * 1.4), C.rood, 3);
      ctx.font = '600 12px ' + css('--f-mono'); ctx.fillStyle = C.rood; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('F = ' + fmt(F, 1) + ' kN', cx + 10, balkY - 50);
    }
    ctx.font = '500 11px ' + css('--f-body'); ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(gebroken() ? 'Het staafje is gebroken.' : 'De bovenste dwarsbalk beweegt omhoog en rekt het staafje uit.', cx, voetY + 4);
  }

  /* ---------- tekenen: curve ---------- */
  function tekenCurve() {
    const { ctx, w, h } = prepCanvas(cvC);
    const C = { fg: css('--fg'), muted: css('--muted'), axis: css('--axis'), grid: css('--grid'), bg: css('--panel'), lijn: css('--b'), rood: css('--trek'), el: css('--druk'), pl: css('--focus') };
    const ml = 84, mr = 30, mt = 30, mb = 50, pw = w - ml - mr, ph = h - mt - mb;
    const EMAX = 0.28, SMAX = 450;
    const X = e => ml + e / EMAX * pw, Y = s => mt + (SMAX - s) / SMAX * ph;
    ctx.font = '11px ' + css('--f-mono'); ctx.lineWidth = 1;
    for (let s = 0; s <= SMAX; s += 50) {
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(ml, Y(s)); ctx.lineTo(ml + pw, Y(s)); ctx.stroke();
      if (s % 100 === 0) { ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(s, ml - 8, Y(s)); }
    }
    pijl(ctx, ml, mt + ph, ml, mt - 14, C.axis, 1.5); pijl(ctx, ml, mt + ph, ml + pw + 14, mt + ph, C.axis, 1.5);
    ctx.fillStyle = C.fg; ctx.font = 'italic 600 14px ' + css('--f-body'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('σ', ml + 8, mt - 12); ctx.font = '11px ' + css('--f-mono'); ctx.fillText('[MPa]', ml + 20, mt - 12);
    ctx.font = 'italic 600 14px ' + css('--f-body'); ctx.textAlign = 'right'; ctx.fillText('ε', w - 34, mt + ph + 18);
    ctx.font = '11px ' + css('--f-mono'); ctx.fillText('[−]', w - 6, mt + ph + 18);
    ctx.textAlign = 'right'; ctx.fillText('O', ml - 6, mt + ph + 12);
    const e = st.e, N = 400;
    const pad = (a, b) => { ctx.beginPath(); ctx.moveTo(X(a), Y(0)); for (let k = 0; k <= N; k++) { const ee = a + (b - a) * k / N; ctx.lineTo(X(ee), Y(sigma(ee))); } ctx.lineTo(X(b), Y(0)); ctx.closePath(); };
    // gebieden
    if (e > 0) { pad(0, Math.min(e, EA)); ctx.fillStyle = C.el; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1; }
    if (e > EA) { pad(EA, e); ctx.fillStyle = C.pl; ctx.globalAlpha = 0.12; ctx.fill(); ctx.globalAlpha = 1; }
    if (e >= EA) {
      ctx.font = '500 12px ' + css('--f-body'); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = C.el; ctx.fillText('elastische', ml + 4, mt + ph + 8); ctx.fillText('vervorming', ml + 4, mt + ph + 22);
      if (e > 0.06) { const wEl = ctx.measureText('vervorming').width, wPl = ctx.measureText('plastische vervorming').width; ctx.textAlign = 'center'; ctx.fillStyle = C.pl; const xPl = Math.max(X((EA + e) / 2), ml + 4 + wEl + 14 + wPl / 2); if (xPl + wPl / 2 < w - 70) ctx.fillText('plastische vervorming', xPl, mt + ph + 8); else { ctx.textAlign = 'left'; ctx.fillText('plastische vervorming', ml + 4, mt + ph + 36); } }
    }
    // kenmerkende niveaus
    const niveau = (ee, s, label, idx, punt) => {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = C.rood; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ml, Y(s)); ctx.lineTo(X(ee), Y(s)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.rood; ctx.beginPath(); ctx.arc(X(ee), Y(s), 3.5, 0, 7); ctx.fill();
      indexLabel(ctx, ml - 58, Y(s), label, idx, '', C.rood, C.bg);
      if (punt) { ctx.font = 'italic 700 13px ' + css('--f-body'); ctx.fillStyle = C.rood; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(punt, X(ee) + 7, Y(s) + 8); }
    };
    if (e >= EP - 1e-9) niveau(EP, SP, 'R', 'p', 'P');
    if (e >= EA - 1e-9) niveau(EA, SA, 'R', 'e', 'A');
    if (e >= EV - 1e-9) niveau(EV, SV, 'R', 'v', '');
    if (e >= EM - 1e-9) {
      niveau(EM, SM, 'R', 'm', '');
      ctx.font = '600 12px ' + css('--f-body'); ctx.fillStyle = C.rood; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('treksterkte', ml + 6, Y(SM) - 6);
    }
    // curve tot nu
    ctx.strokeStyle = C.lijn; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let k = 0; k <= N; k++) { const ee = e * k / N; k ? ctx.lineTo(X(ee), Y(sigma(ee))) : ctx.moveTo(X(ee), Y(sigma(ee))); }
    ctx.stroke();
    if (e >= EB - 1e-9) {
      ctx.fillStyle = C.lijn; ctx.font = '600 12px ' + css('--f-body'); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('breekpunt', X(EB) - 8, Y(SB) + 10);
      ctx.strokeStyle = C.lijn; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(EB) - 5, Y(SB) - 5); ctx.lineTo(X(EB) + 5, Y(SB) + 5); ctx.moveTo(X(EB) + 5, Y(SB) - 5); ctx.lineTo(X(EB) - 5, Y(SB) + 5); ctx.stroke();
    } else {
      ctx.fillStyle = C.lijn; ctx.beginPath(); ctx.arc(X(e), Y(sigma(e)), 5, 0, 7); ctx.fill(); ctx.strokeStyle = C.bg; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  function metingen() {
    const br = gebroken(), F = br ? 0 : sigma(st.e) * A0 / 1000, dl = st.e * L0;
    $('meet').innerHTML =
      `Kracht: F = <b class="c-m">${fmt(F, 2)} kN</b><br>` +
      `Verlenging: Δl = <b>${fmt(dl, 2)} mm</b> (l = ${fmt(L0 + dl, 2)} mm)<br>` +
      `Spanning: σ = F / A = <b class="c-a">${fmt(br ? 0 : sigma(st.e), 0)} MPa</b><br>` +
      `Relatieve rek: ε = Δl / l<sub>0</sub> = <b>${fmt(st.e, 3)}</b>`;
  }

  /* ---------- lus ---------- */
  let raf = 0, vorige = null;
  function lus(ts) {
    if (vorige == null) vorige = ts;
    const dt = Math.min(0.05, (ts - vorige) / 1000); vorige = ts;
    if (st.loopt && st.doel != null) {
      const v = st.e < EV ? 0.004 : st.e < EPL ? 0.012 : 0.03;   // trager in het elastisch gebied
      st.e += v * dt;
      const doelE = STAPPEN[st.doel].e;
      if (st.e >= doelE) { st.e = doelE; st.loopt = false; st.stap = st.doel; st.doel = null; uitleg(); knoppen(); }
    }
    tekenBank(); tekenCurve(); metingen();
    raf = requestAnimationFrame(lus);
  }
  uitleg(); knoppen();
  raf = requestAnimationFrame(lus);
  return () => cancelAnimationFrame(raf);
}


/* ============================================================
   APPLET: Ontwerp van een hemisferische parachute (Engineering – CanSat)
   Nodige oppervlakte uit het krachtenevenwicht bij constante valsnelheid,
   optioneel gat in het midden, en het patroon (de afmetingen) van één gore.
   Export als pdf: berekeningen + gore verkleind + gore op ware grootte.
   ============================================================ */
function renderPara(root) {
  const G = 9.81, RHO = 1.225, NST = 10;
  const st = { m: 350, v: 8, cd: 0.75, n: 8, gat: false, dg: 5, naad: false, t: 1, zoomO: false, zo: 1.5, zoomG: false, zg: 1.5 };

  // vaste decimalen met komma
  const f = (x, d = 2) => (Object.is(x, -0) ? 0 : x).toLocaleString('nl-BE', { minimumFractionDigits: d, maximumFractionDigits: d }).replace('-', '−');

  const rgba = (hex, a) => { const h = hex.replace('#', ''); const v = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`; };
  const mengP = (a) => { // var(--b) gemengd met --panel, a = aandeel --b
    const p = x => { const v = parseInt(css(x).slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
    const b = p('--b'), q = p('--panel'); return `rgb(${b.map((c, i) => Math.round(c * a + q[i] * (1 - a))).join(',')})`;
  };
  const ctrl = (id, label, min, max, step, eenh) => `

  root.innerHTML = `
  <div class="lay2 pa">
    <div class="hoofd2">

          <table id="pa-tab"></table>
        </div>
      </div>
    </div>
    <div class="zij2">
      <div class="paneel bediening">
        <div class="groep">
          <div class="gkop">CanSat</div>

          ${ctrl('v', 'Valsnelheid v', 3, 15, 0.5, 'm/s')}
