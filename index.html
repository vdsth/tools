        </div>
        <div class="groep">
          <div class="gkop">Parachute</div>
          ${ctrl('cd', 'Drag-coëfficiënt C<sub>D</sub>', 0.4, 1.2, 0.01, '')}
          <p class="uitleg klein">Hemisferische parachute: C<sub>D</sub> ≈ 0,62 tot 0,77.</p>
          ${ctrl('n', 'Aantal gores n', 4, 16, 1, '')}
        </div>
        <div class="groep" id="pa-ggat">
          <div class="gkop"><label class="vink"><input type="checkbox" id="pa-gat">Gat in het midden</label></div>
          <div id="pa-gatin">${ctrl('dg', 'Diameter van het gat d<sub>gat</sub>', 1, 20, 0.5, 'cm')}</div>
        </div>
        <div class="groep">
          <div class="gkop">Naden en zomen</div>
          <label class="vink"><input type="checkbox" id="pa-naad">Naadtoeslag zijkanten</label>
          <div id="pa-naadin">${ctrl('t', 'Breedte (om de gores aan elkaar te naaien)', 0.5, 3, 0.5, 'cm')}</div>
          <label class="vink"><input type="checkbox" id="pa-zoomO">Zoom onderaan</label>
          <div id="pa-zoomOin">${ctrl('zo', 'Breedte van de zoom onderaan', 0.5, 3, 0.5, 'cm')}</div>
          <div id="pa-zoomGblok">
            <label class="vink"><input type="checkbox" id="pa-zoomG">Zoom rond het gat</label>
            <div id="pa-zoomGin">${ctrl('zg', 'Breedte van de zoom rond het gat', 0.5, 3, 0.5, 'cm')}</div>
          </div>
        </div>
        <div class="groep">
          <div class="gkop">Exporteren</div>
          <div class="knoppen"><button class="knop pa-pdf" type="button" id="pa-pdf">⤓ Exporteer als pdf</button><button class="knop pa-pdf" type="button" id="pa-dxf">⤓ Gore als dxf</button></div>
          <p class="uitleg klein" id="pa-pdfmeld">Het pdf bevat de berekeningen en de gore op ware grootte (1:1), om af te drukken en uit te knippen. Het dxf-bestand (in mm) bevat de snijlijn (met naadtoeslag en zomen) en de naadlijn, bv. voor een lasersnijder.</p>
        </div>
      </div>
    </div>
  </div>`;

  const $ = id => root.querySelector('#pa-' + id);
  const cvG = $('gore'), cvC = $('chute');

  function koppel(id, key, min, max) {
    const r = $(id), n = $(id + 'n');
    const zet = (val, bron) => {
      let x = parseFloat(String(val).replace(',', '.')); if (!isFinite(x)) return;
      x = Math.min(max, Math.max(min, x)); st[key] = x;
      if (bron !== r) r.value = x; if (bron !== n) n.value = x;
      alles();
    };
    r.addEventListener('input', () => zet(r.value, r));
    n.addEventListener('input', () => zet(n.value, n));
    n.addEventListener('change', () => { n.value = st[key]; });
    r.value = n.value = st[key];
  }
  koppel('m', 'm', 100, 1000); koppel('v', 'v', 3, 15); koppel('cd', 'cd', 0.4, 1.2);
  koppel('n', 'n', 4, 16); koppel('dg', 'dg', 1, 20); koppel('t', 't', 0.5, 3); koppel('zo', 'zo', 0.5, 3); koppel('zg', 'zg', 0.5, 3);
  $('gat').checked = st.gat; $('naad').checked = st.naad;
  $('gat').addEventListener('change', () => { st.gat = $('gat').checked; alles(); });
  $('naad').addEventListener('change', () => { st.naad = $('naad').checked; alles(); });
  $('zoomO').checked = st.zoomO; $('zoomG').checked = st.zoomG;
  $('zoomO').addEventListener('change', () => { st.zoomO = $('zoomO').checked; alles(); });
  $('zoomG').addEventListener('change', () => { st.zoomG = $('zoomG').checked; alles(); });

  /* ---------- berekening ---------- */
  function bereken() {
    const m = st.m / 1000, n = Math.round(st.n);
    const Fz = m * G;
    const A = 2 * Fz / (st.cd * RHO * st.v ** 2);           // m²
    const dg = st.gat ? st.dg / 100 : 0;                      // m
    const Ag = st.gat ? Math.PI * dg ** 2 / 4 : 0;
    const At = A + Ag;
    const R = Math.sqrt(At / (2 * Math.PI));                  // m
    const a = dg / 2;
    const ok = a < R * 0.95;
    const th = ok ? Math.acos(a / R) : 0;                     // rad, hoek vanaf de onderrand
    const Rc = R * 100, ac = a * 100;                         // cm
    const h = Rc * th, b0 = 2 * Math.PI * Rc / n, bt = 2 * Math.PI * ac / n;
    const bw = y => b0 * Math.cos(y / Rc);
    const stations = [];
    for (let k = 0; k <= NST; k++) { const y = h * k / NST; stations.push({ k, y, b: bw(y) }); }
    return { m, n, Fz, A, dg, Ag, At, R, a, ok, th, Rc, ac, h, b0, bt, bw, stations, ts: st.naad ? st.t : 0, tb: st.zoomO ? st.zo : 0, tg: (st.gat && st.zoomG) ? st.zg : 0, hoek: 360 / n };
  }

  /* ---------- berekeningen als opmaaktekst (zelfde bron voor scherm en pdf) ----------
     **vet**, _{onderschrift}, ^{bovenschrift} */
  function regels(g) {
    const L = [];
    const kop = s => L.push({ k: 'kop', s }), fo = s => L.push({ k: 'f', s }), tx = s => L.push({ k: 't', s });
    kop('1. Gewicht van de CanSat');
    fo('F_{z} = m · g');
    fo(`F_{z} = ${f(g.m, 3)} kg · 9,81 m/s^{2} = **${f(g.Fz, 2)} N**`);
    kop('2. Nodige oppervlakte van de parachute');
    tx('Bij een constante valsnelheid is de luchtweerstand even groot als het gewicht: F_{w} = F_{z}.');
    fo('F_{w} = ½ · C_{D} · ρ · A · v^{2}     (ρ = 1,225 kg/m^{3})');
    fo('A = 2 · F_{z} / (C_{D} · ρ · v^{2})');
    fo(`A = 2 · ${f(g.Fz, 2)} / (${f(st.cd, 2)} · 1,225 · ${f(st.v, 1)}^{2}) = **${f(g.A, 4)} m^{2}**  (${f(g.A * 1e4, 0)} cm^{2})`);
    if (st.gat) {
      kop('3. Rekening houden met het gat');
      tx('Het gat laat lucht door, dus de stof moet zoveel groter zijn als de oppervlakte van het gat.');
      fo('A_{gat} = π · d_{gat}^{2} / 4');
      fo(`A_{gat} = π · ${f(g.dg, 3)}^{2} / 4 = ${f(g.Ag, 4)} m^{2}`);
      fo(`A_{tot} = A + A_{gat} = ${f(g.A, 4)} + ${f(g.Ag, 4)} = **${f(g.At, 4)} m^{2}**`);
    }
    const nr = st.gat ? 4 : 3;
    kop(`${nr}. Straal van de halve bol`);
    tx('De opgeblazen parachute is een halve bol met oppervlakte 2 · π · R^{2}.');
    const At = st.gat ? 'A_{tot}' : 'A';
    fo(`${At} = 2 · π · R^{2}   ⇒   R = √(${At} / (2 · π))`);
    fo(`R = √(${f(g.At, 4)} / (2 · π)) = **${f(g.R, 4)} m = ${f(g.Rc, 1)} cm**`);
    fo(`diameter D = 2 · R = ${f(2 * g.Rc, 1)} cm`);
    kop(`${nr + 1}. Afmetingen van één gore`);
    fo(`hoek per gore (bovenaanzicht): α = 360° / n = 360° / ${g.n} = ${f(g.hoek, 1)}°`);
    fo(`breedte onderaan: b = 2 · π · R / n = 2 · π · ${f(g.Rc, 1)} / ${g.n} = **${f(g.b0, 1)} cm**`);
    if (st.gat) {
      fo(`straal van het gat: r_{gat} = d_{gat} / 2 = ${f(g.ac, 2)} cm`);
      if (g.ok) {
        fo(`hoogte: h = R · bgcos(r_{gat} / R) = ${f(g.Rc, 1)} · bgcos(${f(g.ac, 2)} / ${f(g.Rc, 1)}) = **${f(g.h, 1)} cm**`);
        fo(`breedte bovenaan: b_{top} = 2 · π · r_{gat} / n = **${f(g.bt, 1)} cm**`);
      }
    } else {
      fo(`hoogte (kwart van de omtrek): h = π · R / 2 = π · ${f(g.Rc, 1)} / 2 = **${f(g.h, 1)} cm**`);
    }
    fo('breedte op hoogte y: b(y) = b · cos(y / R)   (y / R in radialen)');
    const extra = [];
    if (g.ts) extra.push(`${f(g.ts, 1)} cm naadtoeslag langs de zijkanten (om de gores aan elkaar te naaien)`);
    if (g.tb) extra.push(`${f(g.tb, 1)} cm zoom aan de onderrand`);
    if (g.tg) extra.push(`${f(g.tg, 1)} cm zoom rond het gat`);
    if (extra.length) tx('Teken extra stof bij: ' + extra.join(', ') + '.');
    return L;
  }

  function richHTML(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/_\{(.+?)\}/g, '<sub>$1</sub>')
      .replace(/\^\{(.+?)\}/g, '<sup>$1</sup>');
  }
  function richTokens(s) {
    const out = []; let b = false, i = 0, buf = '';
    const push = (t, mode) => { if (t) out.push({ t, mode, b }); };
    while (i < s.length) {
      if (s.startsWith('**', i)) { push(buf, 0); buf = ''; b = !b; i += 2; continue; }
      if ((s[i] === '_' || s[i] === '^') && s[i + 1] === '{') {
        push(buf, 0); buf = '';
        const e = s.indexOf('}', i); push(s.slice(i + 2, e), s[i] === '_' ? 1 : 2); i = e + 1; continue;
      }
      buf += s[i++];
    }
    push(buf, 0);
    return out;
  }
  // tekent opmaaktekst op een canvas, geeft breedte terug
  function richCanvas(ctx, s, x, y, size, fam, kleur, vetKleur, meten) {
    let cx = x;
    for (const tk of richTokens(s)) {
      const sz = tk.mode ? size * 0.72 : size;
      ctx.font = `${tk.b ? 700 : 400} ${sz}px ${fam}`;
      const dy = tk.mode === 1 ? size * 0.28 : tk.mode === 2 ? -size * 0.38 : 0;
      if (!meten) { ctx.fillStyle = tk.b ? vetKleur : kleur; ctx.fillText(tk.t, cx, y + dy); }
      cx += ctx.measureText(tk.t).width;
    }
    return cx - x;
  }

  /* ---------- tekenen van de gore (scherm en pdf) ---------- */
  function rand(g, N = 120) {           // rechterrand in cm: [{x,y}]
    const p = [];
    for (let i = 0; i <= N; i++) { const y = g.h * i / N; p.push({ x: g.bw(y) / 2, y }); }
    return p;
  }
  function heeftExtra(g) { return g.ts > 0 || g.tb > 0 || g.tg > 0; }
  // snijlijn: gore met naadtoeslag langs de zijkanten, zoom onderaan en (met gat) zoom bovenaan; in cm
  function naadRand(g, N = 120) {
    const ts = g.ts, tb = g.tb, k = Math.PI / g.n;
    let r = [];
    for (let i = 0; i <= N; i++) {
      const y = g.h * i / N, x = g.bw(y) / 2;
      const dxdy = -k * Math.sin(y / g.Rc), nn = Math.hypot(1, dxdy);
      r.push({ x: x + ts / nn, y: y - ts * dxdy / nn });
    }
    const hellingTop = -k * Math.sin(g.h / g.Rc);   // dx/dy van de rand bovenaan
    let top;
    if (g.bt > 0) {                                   // met gat: bovenrand op h + zoom
      const yt = g.h + g.tg;
      const bin = r.filter(p => p.y <= yt + 1e-9);
      const laatste = bin[bin.length - 1];
      if (bin.length < r.length) {                    // snijden op yt
        const nxt = r[bin.length], u = (yt - laatste.y) / (nxt.y - laatste.y);
        bin.push({ x: laatste.x + u * (nxt.x - laatste.x), y: yt });
      } else if (laatste.y < yt - 1e-9) {             // verlengen langs de rand
        bin.push({ x: laatste.x + hellingTop * (yt - laatste.y), y: yt });
      }
      r = bin; const e = r[r.length - 1];
      top = [{ x: -e.x, y: e.y }];
    } else {                                          // zonder gat: zijranden lopen samen in de top
      const e = r[r.length - 1];
      if (e.x > 1e-9) r.push({ x: 0, y: e.y + e.x / Math.max(1e-6, -hellingTop) });
      top = [];
    }
    const x0 = r[0].x;
    const pts = [{ x: -x0, y: -tb }, { x: x0, y: -tb }, ...r, ...top];
    for (let i = r.length - 1; i >= 0; i--) if (r[i].x > 1e-9 || g.bt > 0) { if (!(g.bt > 0 && i === r.length - 1)) pts.push({ x: -r[i].x, y: r[i].y }); }
    return pts;
  }
  function grenzen(g) {                               // omhullende van de snijlijn (cm)
    const pts = heeftExtra(g) ? naadRand(g) : [...rand(g), { x: -g.b0 / 2, y: 0 }];
    let xm = 0, y0 = 0, y1 = g.h;
    pts.forEach(p => { xm = Math.max(xm, Math.abs(p.x)); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
    return { xm, y0, y1 };
  }
  function maatPijl(ctx, x1, y1, x2, y2, kleur, lw) {
    ctx.strokeStyle = kleur; ctx.fillStyle = kleur; ctx.lineWidth = lw; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const kop = (x, y, ux, uy) => {
      const s = 7 * lw;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x - ux * s - uy * s * 0.35, y - uy * s + ux * s * 0.35);
      ctx.lineTo(x - ux * s + uy * s * 0.35, y - uy * s - ux * s * 0.35); ctx.closePath(); ctx.fill();
    };
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    kop(x2, y2, ux, uy); kop(x1, y1, -ux, -uy);
  }
  /* o: { k (px/cm), ox, oy (midden onderrand), C (kleuren), fs (lettergrootte), fam, mono, lw, binnen (labels in de gore) } */
  function tekenGore(ctx, g, o) {
    const X = x => o.ox + x * o.k, Y = y => o.oy - y * o.k;
    const C = o.C, lw = o.lw || 1;
    // naadtoeslag
    const Gr = grenzen(g);
    if (heeftExtra(g)) {
      ctx.beginPath(); naadRand(g).forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))); ctx.closePath();
      ctx.setLineDash([6 * lw, 4 * lw]); ctx.strokeStyle = C.naad; ctx.lineWidth = 1.2 * lw; ctx.stroke(); ctx.setLineDash([]);
    }
    // gore zelf
    const r = rand(g);
    ctx.beginPath();
    r.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)));
    for (let i = r.length - 1; i >= 0; i--) ctx.lineTo(X(-r[i].x), Y(r[i].y));
    ctx.closePath(); ctx.fillStyle = C.vul; ctx.fill(); ctx.strokeStyle = C.lijn; ctx.lineWidth = 2 * lw; ctx.stroke();
    // meetlijnen (stations)
    ctx.font = `${o.fs * 0.86}px ${o.mono}`; ctx.textBaseline = 'middle';
    g.stations.forEach(s => {
      if (s.k === 0 || (s.k === NST)) return;
      ctx.setLineDash([3 * lw, 3 * lw]); ctx.strokeStyle = C.zacht; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(X(-s.b / 2), Y(s.y)); ctx.lineTo(X(s.b / 2), Y(s.y)); ctx.stroke(); ctx.setLineDash([]);
      if (o.geenLabels) return;
      if (o.binnen) {
        const tekst = `y = ${f(s.y, 1)} · b = ${f(s.b, 1)} cm`;
        const tw = ctx.measureText(tekst).width;
        if (tw < s.b * o.k - 8) { ctx.textAlign = 'center'; ctx.fillStyle = C.tekst; ctx.fillText(tekst, X(0), Y(s.y) - o.fs * 0.6); }
        else {
          const kort = `b = ${f(s.b, 1)} cm`;
          ctx.fillStyle = C.tekst;
          if (ctx.measureText(kort).width < s.b * o.k - 8) { ctx.textAlign = 'center'; ctx.fillText(kort, X(0), Y(s.y) - o.fs * 0.6); }
          else { ctx.textAlign = 'left'; ctx.fillText(kort, X(s.b / 2 + g.ts) + 8, Y(s.y)); }
        }
      } else {
        ctx.textAlign = 'left'; ctx.fillStyle = C.zacht2;

  function themaScherm() {

    const { ctx, w, h } = prepCanvas(cvG);

    const links = 58, rechts = 92, boven = g.bt ? 46 : 36, onder = 70;
    const k = Math.min((w - links - rechts) / M.w, (h - boven - onder) / M.h);

    ctx.fillStyle = css('--muted'); ctx.font = '14px ' + css('--f-body');
    ctx.fillText('Maak het gat kleiner of de valsnelheid lager.', w / 2, h / 2 + 14);
  }

  function tekenChute(g) {
    const { ctx, w, h } = prepCanvas(cvC);
    const C = themaScherm(), fam = css('--f-body'), mono = css('--f-mono');

    const vakW = naast ? w / 2 : w, vakH = naast ? h : h / 2;
    const n = g.n, rel = g.ok ? g.a / g.R : 0;
    const titel = (s, x, y) => { ctx.fillStyle = C.zacht2; ctx.font = '600 13px ' + fam; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText(s, x, y); };

      ctx.fillText(`α = ${f(g.hoek, 1)}°`, cx + r * 1.04 * Math.cos(am) + 4, cy + r * 1.04 * Math.sin(am) - 4);

  }

  /* ---------- pdf ---------- */

  function paginaBerekening(g) {

    const L = 1.5 * KCM; let y = 2 * KCM;
    ctx.fillStyle = '#000'; ctx.font = `700 ${0.6 * KCM}px ${css('--f-display') || fam}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Ontwerp van een hemisferische parachute', L, y); y += 0.55 * KCM;
    ctx.font = `${0.3 * KCM}px ${fam}`; ctx.fillStyle = '#444';
    ctx.fillText('CanSat · berekening van de nodige oppervlakte en het patroon van één gore', L, y); y += 0.8 * KCM;
    // gegevens
    const geg = [`m = ${f(st.m, 0)} g`, `v = ${f(st.v, 1)} m/s`, `C_{D} = ${f(st.cd, 2)}`, `n = ${g.n} gores`, st.gat ? `d_{gat} = ${f(st.dg, 1)} cm` : 'geen gat', `ρ = 1,225 kg/m^{3}`, `g = 9,81 m/s^{2}`];
    ctx.fillStyle = '#000'; ctx.font = `700 ${0.36 * KCM}px ${fam}`; ctx.fillText('Gegeven', L, y); y += 0.55 * KCM;
    let x = L;
    geg.forEach(s => { const wd = richCanvas(ctx, s, 0, 0, 0.32 * KCM, mono, '#000', '#000', true); if (x + wd > PW - L) { x = L; y += 0.5 * KCM; } richCanvas(ctx, s, x, y, 0.32 * KCM, mono, '#000', '#000'); x += wd + 0.7 * KCM; });

      const size = r.k === 'f' ? 0.3 * KCM : 0.29 * KCM, fnt = r.k === 'f' ? mono : fam, kl = r.k === 'f' ? '#000' : '#444';
      // eenvoudige woordafbreking voor tekstregels

        woorden.forEach(wd => { const test = lijn ? lijn + ' ' + wd : wd; if (richCanvas(ctx, test, 0, 0, size, fnt, kl, kl, true) > maxW && lijn) { richCanvas(ctx, lijn, L, y, size, fnt, kl, kl); y += 0.46 * KCM; lijn = wd; } else lijn = test; });

  }
  function paginasWareGrootte(g) {
    const fam = css('--f-body'), mono = css('--f-mono');

    const bruikW = 21 - 2 * mL, bruikH = 29.7 - mT - mB;

    const buiten = g.stations.some(s => s.k > 0 && s.k < NST && `b = ${f(s.b, 1)} cm`.length * lettW > s.b - 0.3);
    const extraX = 2.0, extraR = buiten ? 3.6 : 0.4, extraO = 2.1, extraB = g.bt ? 1.0 : 0.9;

      ctx.fillText('Gore op ware grootte (1:1)' + (kol * rij > 1 ? ` – deel ${r * kol + c + 1} van ${kol * rij} (rij ${r + 1}, kolom ${c + 1})` : ''), mL * KCM, 0.9 * KCM);
      ctx.font = `${0.27 * KCM}px ${fam}`; ctx.fillStyle = '#444';

      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; const lx = PW - mL * KCM - 5 * KCM, ly = 0.8 * KCM;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 5 * KCM, ly); ctx.moveTo(lx, ly - 0.15 * KCM); ctx.lineTo(lx, ly + 0.15 * KCM); ctx.moveTo(lx + 5 * KCM, ly - 0.15 * KCM); ctx.lineTo(lx + 5 * KCM, ly + 0.15 * KCM); ctx.stroke();

  // minimale pdf-schrijver: elke pagina = één jpeg-afbeelding op A4
  function maakPdf(canvassen) {

    obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => add(`<< /Type /Pages /Count ${N} /Kids [${canvassen.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] >>`));
    const W = 595.28, H = 841.89;
    canvassen.forEach((cv, i) => {
      const p = 3 + 3 * i;
      obj(p, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`));

    const k = Math.min((w - links - rechts) / Math.max(boom, 1), (h - boven - onder) / Lmax); // px per mm
    // hoogte van het doek aanpassen aan de tekening (geen lege ruimte)
    const nodig = Math.round(Math.max(240, Math.min(420, Lmax * k + boven + onder + 8)));
    if (Math.abs(cvT.parentElement.clientHeight - nodig) > 2) cvT.parentElement.style.height = nodig + 'px';
    const totW = boom * k, ox = links + (w - links - rechts - totW) / 2, cy = boven + (h - boven - onder) / 2;
    const X = xmm => ox + xmm * k;
    // boom
    const extra = 0.04 * lam * k;
    ctx.fillStyle = css('--axis');
    ctx.fillRect(X(0) - extra, cy - 3, totW + 2 * extra, 6);
    // elementen
    const dik = Math.max(2, st.d * k);
    els.forEach(e => {
      const x = X(mm(e.x)), half = mm(e.L) / 2 * k, kl = kleurVan(e.soort);
      ctx.strokeStyle = kl; ctx.lineWidth = dik; ctx.lineCap = 'round';
      if (e.soort === 'A') {
        const gap = Math.max(4, 6);
        ctx.beginPath(); ctx.moveTo(x, cy - half); ctx.lineTo(x, cy - gap); ctx.moveTo(x, cy + gap); ctx.lineTo(x, cy + half); ctx.stroke();
        ctx.fillStyle = kl; [cy - gap, cy + gap].forEach(y => { ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, dik * 0.8), 0, 7); ctx.fill(); });
      } else { ctx.beginPath(); ctx.moveTo(x, cy - half); ctx.lineTo(x, cy + half); ctx.stroke(); }
      ctx.fillStyle = kl; ctx.font = '600 13px ' + css('--f-body'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(e.naam, x, cy - half - 6);
    });
    ctx.lineCap = 'butt';
    // maat lengte reflector (links)
    const xr = X(0) - 22, hr = mm(els[0].L) / 2 * k;
    maat(ctx, xr, cy - hr, xr, cy + hr);
    ctx.save(); ctx.translate(xr - 6, cy); ctx.rotate(-Math.PI / 2); ctx.fillStyle = css('--fg'); ctx.font = '500 12px ' + css('--f-mono'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(`${f2(mm(els[0].L), 0)} mm`, 0, 0); ctx.restore();
    // maten tussen de elementen (onder)
    const yM = cy + hr + 18;
    ctx.font = '500 11px ' + css('--f-mono'); ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    for (let i = 1; i < els.length; i++) {
      const xa = X(mm(els[i - 1].x)), xb = X(mm(els[i].x));
      ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(xb, cy + mm(els[i].L) / 2 * k + 4); ctx.lineTo(xb, yM + 4); ctx.stroke(); ctx.setLineDash([]);
      if (i === 1) { ctx.beginPath(); ctx.setLineDash([2, 3]); ctx.moveTo(xa, cy + hr + 4); ctx.lineTo(xa, yM + 4); ctx.stroke(); ctx.setLineDash([]); }
      maat(ctx, xa, yM, xb, yM);
      const t = f2(mm(els[i].x - els[i - 1].x), 0);
      ctx.fillStyle = css('--muted');
      if (ctx.measureText(t).width + 6 < xb - xa) ctx.fillText(t, (xa + xb) / 2, yM + 5);
    }
    // totale boomlengte
    const yT = yM + 26;
    maat(ctx, X(0), yT, X(boom), yT);
    ctx.fillStyle = css('--fg'); ctx.font = '600 12px ' + css('--f-mono');
    const tt = `afstand R tot laatste element: ${f2(boom, 0)} mm`, tw2 = ctx.measureText(tt).width / 2;
    ctx.fillText(tt, Math.min(w - tw2 - 4, Math.max(tw2 + 4, (X(0) + X(boom)) / 2)), yT + 5);
    // richting
    const xp = X(boom) + 24;
    pijl(ctx, xp, cy, xp + 48, cy, css('--fg'), 2);
    ctx.fillStyle = css('--muted'); ctx.font = '12px ' + css('--f-body'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('naar de', xp + 26, cy - 10); ctx.fillText('CanSat', xp + 26, cy + 22);
    // schaalbalk
    const stappen = [10, 20, 50, 100, 200, 500];
    const sb = stappen.find(s => s * k >= 60) || 500;
    const sx = 14, sy = 16;
    ctx.strokeStyle = css('--fg'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sb * k, sy); ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4); ctx.moveTo(sx + sb * k, sy - 4); ctx.lineTo(sx + sb * k, sy + 4); ctx.stroke();
    ctx.fillStyle = css('--fg'); ctx.font = '500 12px ' + css('--f-mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(sb >= 10 && sb % 10 === 0 ? `${sb / 10} cm` : `${sb} mm`, sx + sb * k + 8, sy);
    $('schaal').textContent = 'alle elementen op dezelfde schaal';
  }
  function maat(ctx, x1, y1, x2, y2) {
    const kl = css('--axis');
    ctx.strokeStyle = kl; ctx.fillStyle = kl; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 8) return;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, s = 6;
    [[x2, y2, ux, uy], [x1, y1, -ux, -uy]].forEach(([x, y, a, b]) => {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - a * s - b * s * 0.4, y - b * s + a * s * 0.4); ctx.lineTo(x - a * s + b * s * 0.4, y - b * s - a * s * 0.4); ctx.closePath(); ctx.fill();
    });
  }
  function tekenPool(cv, pat, kleur, label, soort) {
    const { ctx, w, h } = prepCanvas(cv);
    const cx = w / 2, cy = h / 2 + 4, R = Math.min(w, h) / 2 - 30, MIN = -30;
    const r = dB => Math.max(0, (Math.max(MIN, dB) - MIN) / -MIN) * R;
    ctx.font = '11px ' + css('--f-mono');
    // raster
    [0, -10, -20].forEach(db => {
      ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r(db), 0, 7); ctx.stroke();
    });
    ctx.setLineDash([3, 4]); ctx.strokeStyle = css('--axis'); ctx.beginPath(); ctx.arc(cx, cy, r(-3), 0, 7); ctx.stroke(); ctx.setLineDash([]);
    const dbLabels = () => {   // langs de richting 255°, na het patroon getekend
      const a = 255 * Math.PI / 180;
      ctx.font = '11px ' + css('--f-mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      [[0, '0 dB'], [-3, '−3 dB'], [-10, '−10 dB'], [-20, '−20 dB']].forEach(([db, t]) => {
        const x = cx + r(db) * Math.cos(a) + 4, y = cy - r(db) * Math.sin(a);
        ctx.fillStyle = css('--panel'); const tw = ctx.measureText(t).width; ctx.fillRect(x - 2, y - 7, tw + 4, 14);
        ctx.fillStyle = css('--muted'); ctx.fillText(t, x, y);
      });
    };
    for (let g = 0; g < 360; g += 30) {
      const a = g * Math.PI / 180;
      ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy - R * Math.sin(a)); ctx.stroke();
      ctx.fillStyle = css('--muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${g}°`, cx + (R + 16) * Math.cos(a), cy - (R + 14) * Math.sin(a));
    }
    // patroon
    ctx.beginPath();
    for (let g = 0; g <= 360; g++) { const a = g * Math.PI / 180, rr = r(pat[g % 360]); const x = cx + rr * Math.cos(a), y = cy - rr * Math.sin(a); g ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fillStyle = rgbaVan(kleur, 0.18); ctx.fill(); ctx.strokeStyle = kleur; ctx.lineWidth = 2.2; ctx.stroke();
    dbLabels();
    // openingshoek
    const bw = bundel(pat);
    if (bw) {
      const half = bw / 2 * Math.PI / 180;
      ctx.setLineDash([5, 4]); ctx.strokeStyle = css('--a'); ctx.lineWidth = 1.2;
      [half, -half].forEach(a => { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy - R * Math.sin(a)); ctx.stroke(); });
      ctx.setLineDash([]);
      ctx.fillStyle = css('--a'); ctx.font = '600 12px ' + css('--f-mono'); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(`openingshoek ${f2(bw, 0)}°`, 6, 4);
    }
    ctx.fillStyle = css('--muted'); ctx.font = '12px ' + css('--f-body'); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText(label, w - 6, 4);
    if (soort === 'zij') { ctx.fillText('90° = omhoog', w - 6, 20); }
    // klein antennetje in het midden, wijzend naar 0°
    ctx.strokeStyle = css('--fg'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx + 14, cy); ctx.stroke();
    pijl(ctx, cx + 8, cy, cx + 22, cy, css('--fg'), 2);
    return bw;
  }
  function rgbaVan(hex, a) { const v = parseInt(hex.slice(1), 16); return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`; }

  /* ---------- 3D-patroon ---------- */
  let rooster = null;
  const NA = 72, NB = 36;     // stappen in azimut en elevatie
  function maakRooster(sim) {
    const hor = st.montage === 'h', MIN = -30, P = [];
    for (let j = 0; j <= NB; j++) {
      const b = -Math.PI / 2 + Math.PI * j / NB, rij = [];
      for (let i = 0; i <= NA; i++) {
        const a = 2 * Math.PI * i / NA;
        const dx = Math.cos(b) * Math.cos(a), dy = Math.cos(b) * Math.sin(a), dz = Math.sin(b);
        const cth = hor ? dy : dz;                  // as van de elementen: y (horizontaal) of z (verticaal)
        const db = 10 * Math.log10(Math.max(1e-12, sim.AF2(cth, dx) / sim.Uf));
        const r = Math.max(0, (Math.max(MIN, db) - MIN) / -MIN);
        rij.push({ x: r * dx, y: r * dy, z: r * dz, r });
      }
      P.push(rij);
    }
    rooster = P;
  }
  function kleur3d(r, licht) {          // van blauw (zwak) naar amber (sterk)
    const a = [40, 70, 120], b = [92, 198, 227], c = [242, 181, 68];
    const m = r < 0.6 ? a.map((v, i) => v + (b[i] - v) * r / 0.6) : b.map((v, i) => v + (c[i] - v) * (r - 0.6) / 0.4);
    return `rgb(${m.map(v => Math.round(v * licht)).join(',')})`;
  }
  function teken3d() {
    if (!rooster) return;
    const { ctx, w, h } = prepCanvas(cv3);
    const R = Math.min(w * 0.36, h * 0.44), cx = w / 2 - R * 0.1, cy = h / 2 + 8;
    const cy0 = Math.cos(zicht.yaw), sy0 = Math.sin(zicht.yaw), cp = Math.cos(zicht.pitch), sp = Math.sin(zicht.pitch);
    const proj = p => {
      const x1 = p.x * cy0 - p.y * sy0, y1 = p.x * sy0 + p.y * cy0, z1 = p.z;
      const y2 = y1 * cp - z1 * sp, z2 = y1 * sp + z1 * cp;
      return { X: cx + x1 * R, Y: cy - z2 * R, d: y2 };
    };
    // assen
    const as = (x, y, z, t, kl) => {
      const o = proj({ x: 0, y: 0, z: 0 }), e = proj({ x, y, z });
      ctx.setLineDash([4, 4]); ctx.strokeStyle = kl; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(o.X, o.Y); ctx.lineTo(e.X, e.Y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = kl; ctx.font = '12px ' + css('--f-body'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, e.X, e.Y);
    };
    as(0, 0, 1.25, 'omhoog', css('--muted'));
    as(-1.2, 0, 0, 'achter', css('--muted'));
    // vlakjes sorteren (ver eerst)
    const Q = [];
    for (let j = 0; j < NB; j++) for (let i = 0; i < NA; i++) {
      const p = [rooster[j][i], rooster[j][i + 1], rooster[j + 1][i + 1], rooster[j + 1][i]];
      const rm = (p[0].r + p[1].r + p[2].r + p[3].r) / 4;
      if (rm < 0.005) continue;
      const q = p.map(proj);
      // normaal voor schaduw
      const ux = p[2].x - p[0].x, uy = p[2].y - p[0].y, uz = p[2].z - p[0].z, vx = p[3].x - p[1].x, vy = p[3].y - p[1].y, vz = p[3].z - p[1].z;
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const nl = Math.hypot(nx, ny, nz) || 1;
      const kijk = { x: sy0 * cp, y: cy0 * cp, z: -sp };           // richting naar de kijker (wereld)
      const licht = 0.45 + 0.55 * Math.abs((nx * -kijk.x + ny * -kijk.y + nz * -kijk.z) / nl);
      Q.push({ q, d: (q[0].d + q[1].d + q[2].d + q[3].d) / 4, rm, licht });
    }
    Q.sort((a, b) => b.d - a.d);
    // antenne in het midden (klein, niet op schaal)
    const hor = st.montage === 'h', els = ontwerp(), bl = els[els.length - 1].x || 0.2, sch = 0.32 / Math.max(bl, 0.3);
    const tekenAnt = () => {
      els.forEach(e => {
        const x = (e.x - bl / 2) * sch, half = e.L / 2 * sch;
        const a = proj(hor ? { x, y: -half, z: 0 } : { x, y: 0, z: -half }), b = proj(hor ? { x, y: half, z: 0 } : { x, y: 0, z: half });
        ctx.strokeStyle = kleurVan(e.soort); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();
      });
      const a = proj({ x: -bl / 2 * sch - 0.03, y: 0, z: 0 }), b = proj({ x: bl / 2 * sch + 0.03, y: 0, z: 0 });
      ctx.strokeStyle = css('--axis'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();
    };
    tekenAnt();
    ctx.lineWidth = 0.5;
    Q.forEach(v => {
      ctx.beginPath(); ctx.moveTo(v.q[0].X, v.q[0].Y); for (let k = 1; k < 4; k++) ctx.lineTo(v.q[k].X, v.q[k].Y); ctx.closePath();
      ctx.globalAlpha = 0.86; ctx.fillStyle = kleur3d(v.rm, v.licht); ctx.fill();
      ctx.globalAlpha = 0.35; ctx.strokeStyle = css('--bg'); ctx.stroke(); ctx.globalAlpha = 1;
    });
    // voorwaartse richting
    const o = proj({ x: 1.02, y: 0, z: 0 }), e = proj({ x: 1.35, y: 0, z: 0 });
    pijl(ctx, o.X, o.Y, e.X, e.Y, css('--fg'), 2);
    ctx.fillStyle = css('--fg'); ctx.font = '600 12px ' + css('--f-body'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('naar de CanSat', e.X, e.Y - 8);
    // kleurenschaal
    const gx = 14, gy = h - 24, gw = Math.min(160, w * 0.4);
    for (let i = 0; i < gw; i++) { ctx.fillStyle = kleur3d(i / gw, 1); ctx.fillRect(gx + i, gy, 1, 8); }
    ctx.fillStyle = css('--muted'); ctx.font = '11px ' + css('--f-mono'); ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText('−30 dB', gx, gy + 10); ctx.textAlign = 'right'; ctx.fillText('0 dB', gx + gw, gy + 10);
  }

  function alles() {
    const lam = C0 / (st.f * 1e6) * 1000;   // mm
    const els = ontwerp();
    const sim = simuleer(els, lam);
    tekenAntenne(els, lam);
    const hor = st.montage === 'h';
    const bwE = tekenPool(hor ? cvE : cvH, sim.pe, css('--b'), 'voorkant = 0°', hor ? 'boven' : 'zij');
    const bwH = tekenPool(hor ? cvH : cvE, sim.ph, css('--b'), 'voorkant = 0°', hor ? 'zij' : 'boven');
    $('l1').textContent = hor ? 'E-vlak' : 'H-vlak';
    $('l2').textContent = hor ? 'H-vlak' : 'E-vlak';
    $('vlakuitleg').innerHTML = hor
      ? 'De elementen staan <b>horizontaal</b>. Het <b>bovenaanzicht</b> is het <b>E-vlak</b>: het vlak waarin de elementen liggen en waarin het elektrisch veld trilt. Het <b>zijaanzicht</b> is het <b>H-vlak</b>: het vlak loodrecht op de elementen, waarin het magnetisch veld trilt. 0° is telkens de richting waarin de antenne wijst.'
      : 'De elementen staan <b>verticaal</b>. Het <b>bovenaanzicht</b> is nu het <b>H-vlak</b>: het vlak loodrecht op de elementen, waarin het magnetisch veld trilt. Het <b>zijaanzicht</b> is het <b>E-vlak</b>: het vlak waarin de elementen liggen en waarin het elektrisch veld trilt. 0° is telkens de richting waarin de antenne wijst.';
    root.querySelectorAll('#ya-mont button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === st.montage)));
    maakRooster(sim); teken3d();
    // tabel
    const Imax = Math.max(...sim.I.map(c => Math.hypot(c.re, c.im)));
    const ref = sim.I[1], fRef = Math.atan2(ref.im, ref.re);
    $('tab').innerHTML = `<thead><tr><th>element</th><th>lengte (mm)</th><th>positie (mm)</th><th>afstand tot vorige (mm)</th><th>stroom (relatief)</th></tr></thead><tbody>` +
      els.map((e, i) => {
        const c = sim.I[i], amp = Math.hypot(c.re, c.im) / Imax;
        let fa = (Math.atan2(c.im, c.re) - fRef) * 180 / Math.PI; fa = ((fa + 540) % 360) - 180;
        return `<tr><td><b style="color:${kleurVan(e.soort)}">${e.naam}</b> <span class="ya-soort">${e.soort === 'R' ? 'reflector' : e.soort === 'A' ? 'gevoed element' : 'director'}</span></td>` +
          `<td>${f2(e.L * lam, 0)}</td><td>${f2(e.x * lam, 0)}</td><td>${i ? f2((e.x - els[i - 1].x) * lam, 0) : '–'}</td>` +
          `<td>${f2(amp * 100, 0)} % · ${f2(fa, 0)}°</td></tr>`;
      }).join('') + '</tbody>';
    // resultaten
    const Z = sim.Zin;
    $('res').innerHTML = `
      <div><span>Antennewinst</span><b>${f2(sim.dBi, 1)} dBi</b></div>
      <div><span>Voor-achterverhouding</span><b>${f2(sim.FB, 1)} dB</b></div>
      <div><span>Openingshoek ${hor ? 'bovenaanzicht' : 'zijaanzicht'} / E-vlak (−3 dB)</span><b>${bwE ? f2(bwE, 0) + '°' : '–'}</b></div>
      <div><span>Openingshoek ${hor ? 'zijaanzicht' : 'bovenaanzicht'} / H-vlak (−3 dB)</span><b>${bwH ? f2(bwH, 0) + '°' : '–'}</b></div>
      <div><span>Ingangsimpedantie dipool</span><b>${f2(Z.re, 0)} ${Z.im < 0 ? '−' : '+'} j${f2(Math.abs(Z.im), 0)} Ω</b></div>
      <p class="uitleg klein">Vereenvoudigde simulatie (methode van de geïnduceerde emk) in vrije ruimte, met een geleidende boom en de kabel niet meegerekend. Een echte antenne wijkt daar wat van af, dus test en stem af na het bouwen.</p>`;
    // berekening
    const r = REGEL, d1 = els.filter(e => e.soort === 'D');
    $('ber').innerHTML = `
      <div class="pa-f">golflengte: λ = c / f = 299 792 458 / (${f2(st.f, 0)} · 10<sup>6</sup>) = <b>${f2(lam / 1000, 4)} m = ${f2(lam, 1)} mm</b></div>
      <h3>Lengtes</h3>
      <div class="pa-f">reflector R: L = ${f2(r.LR, 3)} · λ = <b>${f2(r.LR * lam, 0)} mm</b></div>
      <div class="pa-f">gevoed element A (dipool): L = ${f2(r.LA, 3)} · λ = <b>${f2(r.LA * lam, 0)} mm</b></div>
      ${d1.length ? `<div class="pa-f">directoren: D1 = ${f2(r.LD1, 3)} · λ = <b>${f2(r.LD1 * lam, 0)} mm</b>, elke volgende ${f2(r.dec, 3)} · λ korter (minstens ${f2(r.Lmin, 2)} · λ)</div>` : ''}
      <h3>Afstanden</h3>
      <div class="pa-f">R → A: ${f2(r.sR, 2)} · λ = <b>${f2(r.sR * lam, 0)} mm</b></div>
      ${d1.length ? `<div class="pa-f">A → D1: ${f2(r.s1, 2)} · λ = <b>${f2(r.s1 * lam, 0)} mm</b></div>` : ''}
      ${d1.length > 1 ? `<div class="pa-f">tussen de directoren: vanaf ${f2(r.s2, 2)} · λ, telkens ${f2(r.sg, 2)} · λ meer (hoogstens ${f2(r.sMax, 2)} · λ)</div>` : ''}
      <p class="uitleg klein">De reflector is iets langer dan λ/2, de directoren zijn korter. Zo stuurt de antenne de straling naar de directoren toe.</p>`;
    root.querySelectorAll('#ya-snel button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.f === st.f)));
  }

  const ro = new ResizeObserver(() => alles());
  [cvT, cvE, cvH, cv3].forEach(c => ro.observe(c));
  alles();
  return () => ro.disconnect();
}

/* ============================================================
   APPLET: Vakwerken tekenen en simuleren (Engineering)
   Tekenen op een instelbaar raster, steunpunten en krachten op knopen,
   oplossen met de stijfheidsmethode (scharnierende knopen),
   spanning per lid, knik (Euler), export van de onderdelen als dxf.
   ============================================================ */
function renderVak(root) {
  const MAT = [
    { id: 'multiplex', naam: 'Multiplex / plexihout (populier)', s: 30, E: 6000 },
    { id: 'mdf', naam: 'MDF', s: 18, E: 3000 },
    { id: 'pmma', naam: 'Plexiglas (PMMA)', s: 70, E: 3000 },

  /* ---------- model ---------- */

  function voorbeeld(soort) {
    bewaarStap();

    const g = st.g, nx = Math.max(2, Math.floor(st.W / g)), hy = Math.max(1, Math.min(Math.floor(st.H / g), Math.round(nx / 4) || 1));

    let vakken = Math.min(8, nx); if (soort !== 'warren' && vakken % 2) vakken--;

    if (soort === 'kraan') {

  /* ---------- oplossen (stijfheidsmethode) ---------- */
  function los() {
    const N = st.nodes.length, M = st.bars.length;
    const res = { ok: false, reden: '', N: [], u: [], R: {} };
    if (!M) { res.reden = 'leeg'; return res; }
    const idx = new Map(st.nodes.map((n, i) => [n.id, i]));
    const A = st.b * st.t, E = st.E, nd = 2 * N;
    const K = Array.from({ length: nd }, () => new Float64Array(nd));
    const geo = st.bars.map(s => {
      const p = st.nodes[idx.get(s.a)], q = st.nodes[idx.get(s.b)];
      const L = Math.hypot(q.x - p.x, q.y - p.y), c = (q.x - p.x) / L, sn = (q.y - p.y) / L;
      return { i: idx.get(s.a), j: idx.get(s.b), L, c, s: sn };
    });
    geo.forEach(g => {
      const k = E * A / g.L, m = [g.c * g.c, g.c * g.s, g.s * g.s];
      const d = [2 * g.i, 2 * g.i + 1, 2 * g.j, 2 * g.j + 1];
      const ke = [[m[0], m[1], -m[0], -m[1]], [m[1], m[2], -m[1], -m[2]], [-m[0], -m[1], m[0], m[1]], [-m[1], -m[2], m[1], m[2]]];
      for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) K[d[a]][d[b]] += k * ke[a][b];

    const F = new Float64Array(nd), vast = new Array(nd).fill(false);
    st.nodes.forEach((n, i) => {

      if (n.steun === 'rol') vast[2 * i + 1] = true;
    });
    st.loads.forEach(l => { const k = knoop(l.x, l.y); if (!k) return; const i = idx.get(k.id), v = lastVec(l); F[2 * i] += v.fx; F[2 * i + 1] += v.fy; });
    const Fmax = Math.max(1, ...st.loads.map(l => l.F));
    const vrij = []; for (let i = 0; i < nd; i++) if (!vast[i]) vrij.push(i);
    const r = vast.filter(Boolean).length;
    res.m = M; res.k = N; res.r = r;
    if (!r) { res.reden = 'geen steun'; return res; }
    // gereduceerd stelsel
    const n = vrij.length, Kr = vrij.map(i => Float64Array.from(vrij.map(j => K[i][j]))), Fr = Float64Array.from(vrij.map(i => F[i]));
    let maxd = 0; for (let i = 0; i < n; i++) maxd = Math.max(maxd, Math.abs(Kr[i][i]));
    for (let c = 0; c < n; c++) {
      let p = c; for (let rr = c + 1; rr < n; rr++) if (Math.abs(Kr[rr][c]) > Math.abs(Kr[p][c])) p = rr;
      if (Math.abs(Kr[p][c]) < 1e-9 * maxd) { res.reden = 'mechanisme'; return res; }
      [Kr[c], Kr[p]] = [Kr[p], Kr[c]]; [Fr[c], Fr[p]] = [Fr[p], Fr[c]];
      for (let rr = c + 1; rr < n; rr++) { const f = Kr[rr][c] / Kr[c][c]; if (!f) continue; for (let k = c; k < n; k++) Kr[rr][k] -= f * Kr[c][k]; Fr[rr] -= f * Fr[c]; }
    }
    const ur = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) { let s = Fr[i]; for (let k = i + 1; k < n; k++) s -= Kr[i][k] * ur[k]; ur[i] = s / Kr[i][i]; }
    const u = new Float64Array(nd); vrij.forEach((d, i) => { u[d] = ur[i]; });
    res.u = u;
    res.N = geo.map(g => E * A / g.L * (g.c * (u[2 * g.j] - u[2 * g.i]) + g.s * (u[2 * g.j + 1] - u[2 * g.i + 1])));
    res.geo = geo;
    st.nodes.forEach((nn, i) => {
      if (!nn.steun) return;
      const rx = vast[2 * i] ? K[2 * i].reduce((s, v, j) => s + v * u[j], 0) - F[2 * i] : 0;
      const ry = K[2 * i + 1].reduce((s, v, j) => s + v * u[j], 0) - F[2 * i + 1];
      res.R[nn.id] = { rx, ry };

  /* ---------- dxf-export van de onderdelen ---------- */
  function maakDxf() {
    const L = [], p = (c, v) => L.push(String(c), String(v)), n3 = x => (Math.round(x * 1000) / 1000).toFixed(3);

    p(0, 'ENDTAB'); p(0, 'ENDSEC');
    p(0, 'SECTION'); p(2, 'ENTITIES');
    const lijn = (x1, y1, x2, y2) => { p(0, 'LINE'); p(8, 'SNIJLIJN'); p(10, n3(x1)); p(20, n3(y1)); p(30, '0.0'); p(11, n3(x2)); p(21, n3(y2)); p(31, '0.0'); };
    const boog = (x, y, r, a1, a2) => { p(0, 'ARC'); p(8, 'SNIJLIJN'); p(10, n3(x)); p(20, n3(y)); p(30, '0.0'); p(40, n3(r)); p(50, n3(a1)); p(51, n3(a2)); };
    const cirkel = (x, y, r) => { p(0, 'CIRCLE'); p(8, 'SNIJLIJN'); p(10, n3(x)); p(20, n3(y)); p(30, '0.0'); p(40, n3(r)); };
    const tekst = (x, y, hgt, t) => { p(0, 'TEXT'); p(8, 'GRAVEER'); p(10, n3(x)); p(20, n3(y)); p(30, '0.0'); p(40, n3(hgt)); p(1, t); p(72, 1); p(11, n3(x)); p(21, n3(y)); p(31, '0.0'); };

    const delen = st.bars.map((s, i) => { const P = st.nodes.find(n => n.id === s.a), Q = st.nodes.find(n => n.id === s.b); return { nr: i + 1, L: Math.hypot(Q.x - P.x, Q.y - P.y) }; }).sort((a, c) => c.L - a.L);

    let r = 'ok';
    if (dl) {

      catch (e) {
        if (e && e.code === 'declined') r = 'nee';
        else if (e && (e.code === 'rejected_extension' || e.code === 'extension_not_enabled')) {
          try { await dl.save({ filename: naam.replace('.dxf', '.zip'), data: maakZip(naam, tekst) }); r = 'zip'; } catch (e2) { r = e2 && e2.code === 'declined' ? 'nee' : 'fout'; }
        } else r = 'fout';
      }
    } else {
      const url = URL.createObjectURL(new Blob([tekst], { type: 'application/dxf' })), a = document.createElement('a');
      a.href = url; a.download = naam; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

  }
  window.__vakDxf = maakDxf;

  const ro = new ResizeObserver(() => { teken(); teken3d(); });
  ro.observe(cv.parentElement); ro.observe(cv3);
  alles();
  return () => { ro.disconnect(); window.removeEventListener('keydown', esc); delete window.__vakDxf; };
}

   Oplossen met knooppuntanalyse (MNA); spanning, stroom en vermogen per weerstand.
   ============================================================ */
function renderSchakeling(root) {
  const COLS = 18, ROWS = 11;
  const st = {
    tool: 'draad', el: [], volg: 1, sel: null,
    sim: false, toonP: false, lading: true,
    start: null, cur: null, slepen: false, hover: null, muis: null, melding: ''
  };
  const geschiedenis = [];
  const $ = id => root.querySelector('#sk-' + id);
  const sleutel = (p, q) => { const [a, b] = (p.c < q.c || (p.c === q.c && p.r < q.r)) ? [p, q] : [q, p]; return `${a.c},${a.r}|${b.c},${b.r}`; };
  const pk = p => `${p.c},${p.r}`;
  const zelfde = (p, q) => p && q && p.c === q.c && p.r === q.r;
  const eenheden = (p, q) => {   // lijst van eenheidssegmenten van p naar q (horizontaal of verticaal)
    const L = [], dc = Math.sign(q.c - p.c), dr = Math.sign(q.r - p.r), n = Math.abs(q.c - p.c) + Math.abs(q.r - p.r);
    for (let k = 0; k < n; k++) L.push([{ c: p.c + dc * k, r: p.r + dr * k }, { c: p.c + dc * (k + 1), r: p.r + dr * (k + 1) }]);
    return L;
  };
  const fR = R => R >= 1e6 ? fmtS(R / 1e6) + ' MΩ' : R >= 1000 ? fmtS(R / 1000) + ' kΩ' : fmtS(R) + ' Ω';
  const fU = U => fmtS(Math.abs(U) < 1e-9 ? 0 : U) + ' V';
  const fI = I => fmtS(Math.abs(I) < 1e-9 ? 0 : I) + ' A';
  const fP = P => fmtS(Math.abs(P) < 1e-9 ? 0 : P) + ' W';
  const bron = () => st.el.find(e => e.type === 'bron');
  const nieuweNaam = () => { const n = new Set(st.el.filter(e => e.type === 'R').map(e => e.naam)); let k = 1; while (n.has('R' + k)) k++; return 'R' + k; };

  root.innerHTML = `
  <div class="lay2 sk">
    <div class="hoofd2">
      <div class="paneel graf">
        <div class="kop"><h2>Schakeling</h2><span class="legende sk-leg"><span class="sk-lu">U spanning</span><span class="sk-li">I stroom</span><span class="sk-lp" id="sk-legp" hidden>P vermogen</span></span></div>
        <div class="vw-balk">
          <div class="chips" id="sk-tools">
            <button type="button" class="sit" data-tool="kies">⬚ Selecteren</button>
            <button type="button" class="sit" data-tool="draad">╱ Draad</button>
            <button type="button" class="sit" data-tool="R">▭ Weerstand</button>
            <button type="button" class="sit" data-tool="bron">⊣⊢ Bron</button>
            <button type="button" class="sit" data-tool="wis">✕ Wissen</button>
          </div>
          <div class="chips">
            <button type="button" class="knop" id="sk-undo">↶ Ongedaan maken</button>
            <button type="button" class="knop" id="sk-leeg">Alles wissen</button>
          </div>
        </div>
        <p class="uitleg klein" id="sk-hint"></p>
        <div class="doek sk-doek" id="sk-doek" style="aspect-ratio:${COLS + 1} / ${ROWS + 1}"><canvas id="sk-c" role="img" aria-label="Tekenvlak met raster voor de elektrische schakeling"></canvas>
        <div class="sk-edit" id="sk-edit" hidden></div></div>
      </div>
      <div class="paneel">
        <h2 class="vw-h2">Resultaten</h2>
        <div id="sk-status"></div>
        <div class="vw-tabwrap"><table class="vw-tab" id="sk-tab"></table></div>
      </div>
    </div>
    <div class="zij2">
      <div class="paneel bediening">
        <div class="groep">
          <div class="gkop">Simulatie</div>
          <button type="button" class="knop sk-simknop" id="sk-sim">▶ Simulatie starten</button>
          <label class="vink"><input type="checkbox" id="sk-p">Vermogen tonen</label>
          <label class="vink"><input type="checkbox" id="sk-lad" checked>Stroom tonen met bewegende ladingen</label>
        </div>
        <div class="groep">
          <div class="gkop">Voorbeelden</div>
          <div class="sk-vbrij"><span>Serie</span><div class="chips">${[1, 2, 3].map(k => `<button type="button" class="sit" data-vb="s${k}">${k}</button>`).join('')}</div></div>
          <div class="sk-vbrij"><span>Parallel</span><div class="chips">${[1, 2, 3].map(k => `<button type="button" class="sit" data-vb="p${k}">${k}</button>`).join('')}</div></div>
          <div class="sk-vbrij"><span>Gemengd</span><div class="chips">${[1, 2, 3, 4, 5].map(k => `<button type="button" class="sit" data-vb="g${k}">${k}</button>`).join('')}</div></div>
        </div>
      </div>
    </div>
  </div>`;

  const cv = $('c');
  let cel = 40, ox = 20, oy = 20;
  const xy = p => [ox + p.c * cel, oy + p.r * cel];
  const raster = (mx, my) => {
    const c = Math.round((mx - ox) / cel), r = Math.round((my - oy) / cel);
    if (c < 0 || c > COLS || r < 0 || r > ROWS) return null;
    return { c, r };
  };
  const snap = (a, p) => (Math.abs(p.c - a.c) >= Math.abs(p.r - a.r) ? { c: p.c, r: a.r } : { c: a.c, r: p.r });
  const LEN = 2;   // weerstand en bron hebben een vaste lengte van twee vakjes
  const past = q => q.c >= 0 && q.c <= COLS && q.r >= 0 && q.r <= ROWS;
  const vastEind = (a, mx, my) => {   // eindpunt van een onderdeel met vaste lengte, in de richting van de muis
    let dx = 1, dy = 0;
    if (mx != null) { const [x, y] = xy(a), ddx = mx - x, ddy = my - y; if (Math.hypot(ddx, ddy) > cel * 0.3) { if (Math.abs(ddx) >= Math.abs(ddy)) { dx = Math.sign(ddx); dy = 0; } else { dx = 0; dy = Math.sign(ddy); } } }
    let b = { c: a.c + dx * LEN, r: a.r + dy * LEN };
    if (!past(b)) b = { c: a.c - dx * LEN, r: a.r - dy * LEN };
    return past(b) ? b : null;
  };

  /* ---------- bewerken ---------- */
  const bewaar = () => { geschiedenis.push(JSON.stringify({ el: st.el, volg: st.volg })); if (geschiedenis.length > 80) geschiedenis.shift(); $('undo').disabled = false; };
  const bezetDoorComp = (k, behalve) => st.el.some(e => e !== behalve && e.type !== 'draad' && eenheden(e.a, e.b).some(([p, q]) => sleutel(p, q) === k));
  function voegToe(type, a, b) {
    if (zelfde(a, b)) return;
    if (type === 'draad') {
      const nieuw = eenheden(a, b).filter(([p, q]) => { const k = sleutel(p, q); return !bezetDoorComp(k) && !st.el.some(e => e.type === 'draad' && sleutel(e.a, e.b) === k); });
      if (!nieuw.length) return;
      bewaar();
      nieuw.forEach(([p, q]) => st.el.push({ id: st.volg++, type: 'draad', a: p, b: q }));
      st.melding = '';
      return;
    }
    const ks = eenheden(a, b).map(([p, q]) => sleutel(p, q));
    if (ks.some(k => bezetDoorComp(k))) { st.melding = 'Daar staat al een weerstand of een bron. Kies een andere plaats.'; return; }
    bewaar();
    st.el = st.el.filter(e => !(e.type === 'draad' && ks.includes(sleutel(e.a, e.b))));   // draad onder het onderdeel vervalt
    st.melding = '';
    if (type === 'bron') {
      const oud = bron();
      if (oud) { st.el = st.el.filter(e => e !== oud); st.melding = 'Er kan maar één bron zijn: de vorige bron is verwijderd.'; }
      const e = { id: st.volg++, type: 'bron', a, b, U: oud ? oud.U : 12 };
      st.el.push(e); open(e);
    } else {
      const e = { id: st.volg++, type: 'R', a, b, R: 100, naam: nieuweNaam() };
      st.el.push(e); open(e);
    }
  }
  const afstSeg = (mx, my, e) => {
    const [x1, y1] = xy(e.a), [x2, y2] = xy(e.b), dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((mx - x1) * dx + (my - y1) * dy) / L2));
    return Math.hypot(mx - x1 - t * dx, my - y1 - t * dy);
  };
  const raak = (mx, my) => {
    let best = null, bd = Math.max(8, cel * 0.22);
    // onderdelen gaan voor draden
    st.el.forEach(e => { const d = afstSeg(mx, my, e) - (e.type === 'draad' ? 0 : 4); if (d < bd) { bd = d; best = e; } });
    return best;
  };
  const verwijder = e => { if (!e) return; bewaar(); st.el = st.el.filter(x => x !== e); if (st.sel === e.id) sluit(); };
  // onderdeel aangeklikt (niet op een aansluitpunt)?
  const raakComp = (mx, my) => {
    const e = raak(mx, my); if (!e || e.type === 'draad') return null;
    const [x1, y1] = xy(e.a), [x2, y2] = xy(e.b);
    return Math.hypot(mx - x1, my - y1) < cel * 0.35 || Math.hypot(mx - x2, my - y2) < cel * 0.35 ? null : e;
  };
  function draai(e) {   // 90° draaien rond het midden
    const m = { c: (e.a.c + e.b.c) / 2, r: (e.a.r + e.b.r) / 2 }, rot = p => ({ c: m.c - (p.r - m.r), r: m.r + (p.c - m.c) });
    const a = rot(e.a), b = rot(e.b);
    if (!past(a) || !past(b)) { st.melding = 'Draaien lukt hier niet: het onderdeel zou buiten het raster komen.'; return; }
    const ks = eenheden(a, b).map(([p, q]) => sleutel(p, q));
    if (ks.some(k => bezetDoorComp(k, e))) { st.melding = 'Draaien lukt hier niet: daar staat al een onderdeel.'; return; }
    bewaar(); st.el = st.el.filter(x => !(x.type === 'draad' && ks.includes(sleutel(x.a, x.b)))); e.a = a; e.b = b; st.melding = '';
  }

  /* ---------- oplossen (knooppuntanalyse) ---------- */
  function losStelsel(A, z) {   // Gauss met pivotering
    const N = z.length;
    for (let k = 0; k < N; k++) {
      let m = k; for (let i = k + 1; i < N; i++) if (Math.abs(A[i][k]) > Math.abs(A[m][k])) m = i;
      if (Math.abs(A[m][k]) < 1e-30) continue;
      [A[k], A[m]] = [A[m], A[k]]; [z[k], z[m]] = [z[m], z[k]];
      for (let i = k + 1; i < N; i++) { const fct = A[i][k] / A[k][k]; if (!fct) continue; for (let j = k; j < N; j++) A[i][j] -= fct * A[k][j]; z[i] -= fct * z[k]; }
    }
    const x = new Float64Array(N);
    for (let i = N - 1; i >= 0; i--) { let t = z[i]; for (let j = i + 1; j < N; j++) t -= A[i][j] * x[j]; x[i] = Math.abs(A[i][i]) < 1e-30 ? 0 : t / A[i][i]; }
    return x;
  }
  let res = null;
  function los() {
    const b = bron();
    const uit = { ok: false, fout: '', V: {}, I: {}, Ib: 0, kort: false };
    if (!b) { uit.fout = 'Plaats eerst een bron.'; return uit; }
    // kortsluiting: + en − verbonden via enkel draden?
    const ouder = {}, f = x => { while (ouder[x] !== undefined && ouder[x] !== x) x = ouder[x]; return x; };
    const un = (p, q) => { const a = f(p), c = f(q); if (a !== c) ouder[a] = c; };
    st.el.forEach(e => { ouder[pk(e.a)] ??= pk(e.a); ouder[pk(e.b)] ??= pk(e.b); });
    st.el.filter(e => e.type === 'draad').forEach(e => un(pk(e.a), pk(e.b)));
    if (f(pk(b.a)) === f(pk(b.b))) { uit.kort = true; uit.fout = 'Kortsluiting! De + en de − van de bron zijn rechtstreeks verbonden met een draad zonder weerstand.'; return uit; }
    // draden verbinden punten tot één knoop (ideale draad: geen weerstand)
    const knoop = pt => f(pk(pt)), gnd = knoop(b.a), idx = {}; let n = 0;
    st.el.forEach(e => [e.a, e.b].forEach(pt => { const k = knoop(pt); if (k !== gnd && idx[k] === undefined) idx[k] = n++; }));
    const N = n + 1, A = Array.from({ length: N }, () => new Float64Array(N)), z = new Float64Array(N);
    const ix = pt => { const k = knoop(pt); return k === gnd ? -1 : idx[k]; };
    const stamp = (i, j, g) => { if (i >= 0) A[i][i] += g; if (j >= 0) A[j][j] += g; if (i >= 0 && j >= 0) { A[i][j] -= g; A[j][i] -= g; } };
    st.el.forEach(e => { if (e.type === 'R') stamp(ix(e.a), ix(e.b), 1 / e.R); });
    for (let i = 0; i < n; i++) A[i][i] += 1e-12;   // zwevende knopen
    const p = ix(b.b), q = ix(b.a);
    if (p >= 0) { A[p][n] += 1; A[n][p] += 1; }
    if (q >= 0) { A[q][n] -= 1; A[n][q] -= 1; }
    z[n] = b.U;
    const x = losStelsel(A, z);
    const V = pt => { const i = ix(pt); return i < 0 ? 0 : x[i]; };
    st.el.forEach(e => {
      uit.V[e.id] = V(e.a) - V(e.b);
      if (e.type === 'R') uit.I[e.id] = (V(e.a) - V(e.b)) / e.R;
    });
    uit.Ib = -x[n];                       // stroom die de bron aan de +klem levert
    uit.I[b.id] = uit.Ib;                 // binnen de bron van − (a) naar + (b)
    // stroom in de draden: per knoop verdeelt de stroom zich over de draadstukjes (alle stukjes even 'goed')
    const inj = {};
    st.el.forEach(e => { if (e.type === 'draad') return; const I = uit.I[e.id] || 0; inj[pk(e.a)] = (inj[pk(e.a)] || 0) - I; inj[pk(e.b)] = (inj[pk(e.b)] || 0) + I; });
    const groepen = {};
    st.el.filter(e => e.type === 'draad').forEach(e => (groepen[knoop(e.a)] ||= []).push(e));
    Object.values(groepen).forEach(dr => {
      const pts = [...new Set(dr.flatMap(e => [pk(e.a), pk(e.b)]))], id = {}; pts.forEach((k, i) => { id[k] = i; });
      const M = pts.length - 1; if (M < 1) return;
      const L = Array.from({ length: M }, () => new Float64Array(M)), r = new Float64Array(M);
      const g = k => id[k] - 1;   // eerste punt is referentie
      dr.forEach(e => { const i = g(pk(e.a)), j = g(pk(e.b)); if (i >= 0) L[i][i] += 1; if (j >= 0) L[j][j] += 1; if (i >= 0 && j >= 0) { L[i][j] -= 1; L[j][i] -= 1; } });
      pts.forEach(k => { if (g(k) >= 0) r[g(k)] = inj[k] || 0; });
      const phi = losStelsel(L, r), F = k => g(k) < 0 ? 0 : phi[g(k)];
      dr.forEach(e => { uit.I[e.id] = F(pk(e.a)) - F(pk(e.b)); });
    });
    uit.ok = true;
    if (Math.abs(uit.Ib) < 1e-9) uit.fout = 'Er loopt geen stroom: de kring is niet gesloten. Verbind de + en de − van de bron via weerstanden.';
    // afrondingsruis bij draden wegwerken
    const Imax = Math.max(1e-12, ...Object.values(uit.I).map(Math.abs));
    Object.keys(uit.I).forEach(k => { if (Math.abs(uit.I[k]) < Math.max(Imax * 1e-7, 1e-9)) uit.I[k] = 0; });
    if (Math.abs(uit.Ib) < 1e-9) { uit.Ib = 0; Object.keys(uit.V).forEach(k => { if (Math.abs(uit.V[k]) < 1e-6) uit.V[k] = 0; }); }
    return uit;
  }

  /* ---------- tekenen ---------- */
  const fase = {};
  function tekenSymbool(ctx, e, kleur) {
    const [x1, y1] = xy(e.a), [x2, y2] = xy(e.b), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    ctx.strokeStyle = kleur; ctx.lineWidth = 2; ctx.lineCap = 'round';
    if (e.type === 'draad') { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); return; }
    if (e.type === 'R') {
      const lr = Math.min(L - 8, cel * 1.1) / 2, br = Math.max(6, cel * 0.17);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(mx - ux * lr, my - uy * lr); ctx.moveTo(mx + ux * lr, my + uy * lr); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.fillStyle = css('--panel');
      ctx.beginPath();
      ctx.moveTo(mx - ux * lr + nx * br, my - uy * lr + ny * br); ctx.lineTo(mx + ux * lr + nx * br, my + uy * lr + ny * br);
      ctx.lineTo(mx + ux * lr - nx * br, my + uy * lr - ny * br); ctx.lineTo(mx - ux * lr - nx * br, my - uy * lr - ny * br); ctx.closePath();
      ctx.fill(); ctx.stroke();
      return;
    }
    // bron: lange plaat = +, korte dikke plaat = −  (b is de +klem)
    const g = Math.max(5, cel * 0.13), hl = Math.max(14, cel * 0.42), hk = hl * 0.5;
    const pm = [mx - ux * g, my - uy * g], pp = [mx + ux * g, my + uy * g];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(pm[0], pm[1]); ctx.moveTo(pp[0], pp[1]); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pp[0] + nx * hl, pp[1] + ny * hl); ctx.lineTo(pp[0] - nx * hl, pp[1] - ny * hl); ctx.stroke();
    ctx.lineWidth = 5; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(pm[0] + nx * hk, pm[1] + ny * hk); ctx.lineTo(pm[0] - nx * hk, pm[1] - ny * hk); ctx.stroke();
    ctx.lineCap = 'round';
    ctx.fillStyle = kleur; ctx.font = `700 ${Math.round(Math.max(13, cel * 0.32))}px ${css('--f-mono')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const o = hl * 0.75;
    ctx.fillText('+', pp[0] + ux * o * 0.9 + nx * o, pp[1] + uy * o * 0.9 + ny * o);
    ctx.fillText('−', pm[0] - ux * o * 0.9 + nx * o, pm[1] - uy * o * 0.9 + ny * o);
  }
  function labels(ctx, e) {
    const [x1, y1] = xy(e.a), [x2, y2] = xy(e.b), hor = y1 === y2, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const rijen = [];
    if (e.type === 'R') rijen.push([`${e.naam} = ${fR(e.R)}`, css('--fg'), 600]);
    if (e.type === 'bron') rijen.push([`U = ${fU(e.U)}`, css('--fg'), 600]);
    if (st.sim && res && res.ok && !res.kort) {
      const I = res.I[e.id] || 0;
      if (e.type === 'R') rijen.push([`U = ${fU(Math.abs(res.V[e.id]))}`, css('--a'), 400]);
      rijen.push([`I = ${fI(Math.abs(I))}`, css('--b'), 400]);
      if (st.toonP) rijen.push([`P = ${fP(e.type === 'R' ? I * I * e.R : Math.abs(I) * e.U)}`, css('--meet'), 400]);
    }
    const fs = Math.round(Math.max(11, Math.min(13.5, cel * 0.28))), lh = fs + 3;
    ctx.textBaseline = 'middle';
    const off = (e.type === 'bron' ? Math.max(14, cel * 0.42) : Math.max(6, cel * 0.17)) + 8;
    const bg = css('--panel');
    const schrijf = (t, x, y, k) => {
      const tw = ctx.measureText(t).width, x0 = ctx.textAlign === 'center' ? x - tw / 2 : x;
      ctx.fillStyle = bg; ctx.globalAlpha = 0.85; ctx.fillRect(x0 - 3, y - lh / 2, tw + 6, lh); ctx.globalAlpha = 1;
      ctx.fillStyle = k; ctx.fillText(t, x, y);
    };
    rijen.forEach(([t, k, w], i) => {
      ctx.font = `${w} ${fs}px ${css('--f-mono')}`;
      if (hor) {
        // naam boven, waarden onder het symbool
        ctx.textAlign = 'center';
        if (i === 0) schrijf(t, mx, my - off - lh / 2 + 2, k);
        else schrijf(t, mx, my + off + lh * (i - 0.5), k);
      } else {
        ctx.textAlign = 'left';
        schrijf(t, mx + off, my + (i - (rijen.length - 1) / 2) * lh, k);
      }
    });
    // stroomzin op de weerstand
    if (st.sim && res && res.ok && !res.kort && e.type === 'R') {
      const I = res.I[e.id] || 0; if (Math.abs(I) < 1e-12) return;
      const s = I > 0 ? 1 : -1, ux = Math.sign(x2 - x1), uy = Math.sign(y2 - y1);
      const d = Math.min(Math.hypot(x2 - x1, y2 - y1) / 2 - 4, Math.max(cel * 0.62, Math.min(cel * 0.8, Math.hypot(x2 - x1, y2 - y1) * 0.33)));
      const ax = mx - s * ux * d, ay = my - s * uy * d, a2 = 9;
      ctx.fillStyle = css('--b'); ctx.beginPath();
      ctx.moveTo(ax + s * ux * a2, ay + s * uy * a2);
      ctx.lineTo(ax - s * ux * 2 + uy * 5, ay - s * uy * 2 + ux * 5);
      ctx.lineTo(ax - s * ux * 2 - uy * 5, ay - s * uy * 2 - ux * 5);

  }

      case 'g1':   // 12 V, 40 + (60 // 30) = 60 Ω → I = 200 mA
        bronLinks(12); tak([[3, 3], [14, 3]], [R(5, 3, 7, 3, 40)]); tak([[3, 7], [14, 7]]); vert(10, 60); vert(14, 30); break;
      case 'g2':   // 12 V, (60 // 60 // 60) + 40 = 60 Ω → I = 200 mA
        bronLinks(12); tak([[3, 3], [15, 3]]); vert(9, 60); vert(12, 60); vert(15, 60); tak([[3, 7], [15, 7]], [R(5, 7, 7, 7, 40)]); break;
      case 'g3':   // 12 V, 10 + ((10 + 50) // 60) = 40 Ω → I = 300 mA
        bronOnder(12, 5, 2, 9); tak([[3, 2], [14, 2]], [R(5, 2, 7, 2, 10)]); tak([[3, 9], [14, 9]]);
        tak([[10, 2], [10, 9]], [R(10, 3, 10, 5, 10), R(10, 6, 10, 8, 50)]); tak([[14, 2], [14, 9]], [R(14, 4, 14, 6, 60)]); break;
      case 'g4':   // 24 V, 50 + (100 // 100) + 20 = 120 Ω → I = 200 mA
        bronLinks(24); tak([[3, 3], [14, 3]], [R(5, 3, 7, 3, 50)]); vert(10, 100); vert(14, 100); tak([[3, 7], [14, 7]], [R(7, 7, 5, 7, 20)]); break;
      default:     // 20 V, ((40 + 20) // (30 + 30)) + 20 = 50 Ω → I = 400 mA
        bronOnder(20, 5, 2, 9); tak([[3, 2], [14, 2]], [R(5, 2, 7, 2, 20)]); tak([[3, 9], [14, 9]]);
        tak([[10, 2], [10, 9]], [R(10, 3, 10, 5, 40), R(10, 6, 10, 8, 20)]); tak([[14, 2], [14, 9]], [R(14, 3, 14, 5, 30), R(14, 6, 14, 8, 30)]);
    }
    root.querySelectorAll('[data-vb]').forEach(b => b.setAttribute('aria-pressed', b.dataset.vb === vb));
    update();
  }
  root.querySelectorAll('[data-vb]').forEach(b => b.addEventListener('click', () => laad(b.dataset.vb)));

  const ro = new ResizeObserver(() => teken()); ro.observe(cv);
  laad('g1'); geschiedenis.length = 0; st.tool = 'kies'; update();
  return () => { ro.disconnect(); if (raf) cancelAnimationFrame(raf); document.removeEventListener('keydown', toets); };
}

/* ============================================================
   APPLET: Positiemetingen (3TEW, Mechanica)
   Een autootje rijdt met constante snelheid langs een baan.
   Met "Neem meting" noteer je de tijd t (s, op 1 ms) en de positie s (m) in een tabel; export als xlsx.
   ============================================================ */
function renderGrafisch(root) {
  const LENGTE = 100;                  // lengte van de baan in m
  const st = { v: 5, loopt: false, t0: 0, t: 0, metingen: [] };
  const $ = id => root.querySelector('#gv-' + id);
  const f2 = (x, d) => (Object.is(x, -0) ? 0 : x).toLocaleString('nl-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
  const ms = t => Math.round(t * 1000);
  const fs = t => f2(ms(t) / 1000, 3);   // seconden, tot op 1 ms: 1,359
  const sVan = t => Math.min(LENGTE, st.v * t);
  const tEind = () => LENGTE / st.v;

  root.innerHTML = `
  <div class="gv">
    <div class="paneel graf">
      <div class="kop"><h2>De baan</h2><span class="legende">positie s langs de baan</span></div>
      <div class="doek gv-doek"><canvas id="gv-c" role="img" aria-label="Autootje dat langs een baan rijdt, met een klok"></canvas></div>
      <div class="gv-balk">
        <div class="ctrl gv-v"><label for="gv-vr">Snelheid van het autootje</label>
          <div class="rij"><input type="range" id="gv-vr" min="1" max="10" step="0.5"><input type="number" id="gv-vn" min="1" max="10" step="0.5" aria-label="Snelheid in m/s"><span class="eenh">m/s</span></div></div>
        <div class="knoppen">
          <button class="knop" type="button" id="gv-start">▶ Start</button>
          <button class="knop gv-meet" type="button" id="gv-meet" disabled>⏱ Neem meting</button>
          <button class="knop" type="button" id="gv-reset">↺ Opnieuw</button>
        </div>
      </div>
      <p class="uitleg klein" id="gv-hint"></p>
    </div>
    <div class="paneel">
      <div class="gv-mkop"><h2 class="vw-h2" style="margin:0">Metingen</h2><button class="knop" type="button" id="gv-xlsx" disabled>⤓ Exporteer naar Excel</button></div>
      <p class="uitleg" id="gv-leeg">Nog geen metingen. Klik op <b>Start</b> en daarna een paar keer op <b>Neem meting</b>.</p>
      <div class="vw-tabwrap"><table class="vw-tab gv-tab" id="gv-tab"></table></div>
    </div>
  </div>`;

  const cv = $('c');
  function teken() {
    const { ctx, w, h } = prepCanvas(cv);
    const mL = 34, mR = 34, x0 = mL, x1 = w - mR, yB = h * 0.62;
    const X = s => x0 + (s / LENGTE) * (x1 - x0);
    const fg = css('--fg'), mu = css('--muted'), ax = css('--axis'), a = css('--a'), b = css('--b'), bg = css('--bg');
    // weg
    ctx.fillStyle = css('--panel-2'); ctx.fillRect(x0 - 14, yB - 4, x1 - x0 + 28, 10);
    ctx.strokeStyle = ax; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 - 14, yB); ctx.lineTo(x1 + 14, yB); ctx.stroke();
    // meetlat
    ctx.font = `12px ${css('--f-mono')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let s = 0; s <= LENGTE; s += 5) {
      const x = X(s), groot = s % 10 === 0;
      ctx.strokeStyle = groot ? ax : css('--line'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yB + 8); ctx.lineTo(x, yB + (groot ? 18 : 13)); ctx.stroke();
      if (groot) { ctx.fillStyle = mu; ctx.fillText(String(s), x, yB + 22); }
    }
    ctx.fillStyle = mu; ctx.textAlign = 'right'; ctx.fillText('s (m)', x1 + 30, yB + 40);
    // metingen als vlaggetjes
    st.metingen.forEach((m, i) => {
      const x = X(m.s);
      ctx.strokeStyle = b; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, yB - 2); ctx.lineTo(x, yB - 52); ctx.stroke();
      ctx.fillStyle = b; ctx.beginPath(); ctx.arc(x, yB, 3.5, 0, 7); ctx.fill();
      ctx.font = `600 11px ${css('--f-mono')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(String(i + 1), x, yB - 54);
    });
    // autootje
    const s = sVan(st.t);
    ctx.save(); ctx.translate(X(s), yB - 1); ctx.scale(1.7, 1.7); auto(ctx, 0, 0, a, 1, bg); ctx.restore();
    // klok
    const tk = `t = ${fs(st.t)} s`;
    ctx.font = `600 ${Math.max(20, Math.min(30, w * 0.035))}px ${css('--f-mono')}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    const tw = ctx.measureText(tk).width;
    ctx.fillStyle = css('--bg'); ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x1 - tw - 18, 12, tw + 26, 44, 8) : ctx.rect(x1 - tw - 18, 12, tw + 26, 44); ctx.fill(); ctx.stroke();
    ctx.fillStyle = fg; ctx.fillText(tk, x1 - 1, 21);
    ctx.font = `12px ${css('--f-body')}`; ctx.fillStyle = mu; ctx.textAlign = 'right';
    ctx.fillText('verstreken tijd', x1 + 7, 62);
  }

  function tabel() {
    $('leeg').hidden = st.metingen.length > 0;
    $('tab').innerHTML = st.metingen.length ? `<tr><th>Meting</th><th>t (s)</th><th>s (m)</th></tr>` +
      st.metingen.map((m, i) => `<tr><td>${i + 1}</td><td>${fs(m.t)}</td><td>${f2(m.s, 2)}</td></tr>`).join('') : '';
    $('xlsx').disabled = !st.metingen.length;
  }
  function knoppen() {
    const einde = st.t >= tEind() - 1e-9;
    $('start').textContent = st.loopt ? '⏸ Pauze' : st.t > 0 && !einde ? '▶ Verder' : '▶ Start';
    $('start').disabled = einde;
    $('meet').disabled = !st.loopt;
    $('vr').disabled = $('vn').disabled = st.loopt || st.t > 0;
    $('hint').innerHTML = einde ? 'Het autootje is aan het einde van de baan. Klik op <b>Opnieuw</b> om opnieuw te beginnen.'
      : st.loopt ? 'Klik op <b>Neem meting</b> (of druk op de spatiebalk) om de tijd en de positie te noteren.'
      : st.t > 0 ? 'Gepauzeerd. De snelheid kun je pas veranderen na <b>Opnieuw</b>.' : 'Stel de snelheid in en klik op <b>Start</b>.';
  }

  // animatie
  let raf = 0, vorig = 0;
  function stap(nu) {
    raf = 0; if (!st.loopt || !document.body.contains(cv)) return;
    st.t = Math.min(tEind(), st.tBasis + (nu - st.t0) / 1000);
    if (st.t >= tEind()) { st.loopt = false; knoppen(); }
    teken();
    if (st.loopt) raf = requestAnimationFrame(stap);
  }
  $('start').addEventListener('click', () => {
    if (st.loopt) { st.t = Math.min(tEind(), st.tBasis + (performance.now() - st.t0) / 1000); st.loopt = false; }
    else { st.loopt = true; st.tBasis = st.t; st.t0 = performance.now(); if (!raf) raf = requestAnimationFrame(stap); }
    knoppen(); teken();
    if (st.loopt) $('meet').focus();   // spatiebalk = meting
  });
  function meet() {
    if (!st.loopt) return;
    const t = Math.min(tEind(), st.tBasis + (performance.now() - st.t0) / 1000);
    st.metingen.push({ t, s: sVan(t) });
    tabel(); teken();
  }
  $('meet').addEventListener('click', meet);

  /* ---------- export naar Excel (.xlsx, zelf opgebouwd) ---------- */
  function zipStore(bestanden) {
    const enc = new TextEncoder(), delen = [], cd = []; let off = 0;
    const crc32 = d => { let c = -1; for (let i = 0; i < d.length; i++) { c ^= d[i]; for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1)); } return (c ^ -1) >>> 0; };
    bestanden.forEach(([naam, tekst]) => {
      const nm = enc.encode(naam), data = enc.encode(tekst), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
      delen.push(lh.buffer, nm, data); cd.push(ch.buffer, nm); off += 30 + nm.length + data.length;
    });
    const cdLen = cd.reduce((t, x) => t + (x.byteLength ?? x.length), 0), eind = new DataView(new ArrayBuffer(22));
    eind.setUint32(0, 0x06054b50, true); eind.setUint16(8, bestanden.length, true); eind.setUint16(10, bestanden.length, true); eind.setUint32(12, cdLen, true); eind.setUint32(16, off, true);
    return new Blob([...delen, ...cd, eind.buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function maakXlsx() {
    const c = (ref, v, stijl) => `<c r="${ref}"${stijl ? ` s="${stijl}"` : ''}><v>${v}</v></c>`;
    const tx = (ref, t) => `<c r="${ref}" t="inlineStr" s="1"><is><t>${t}</t></is></c>`;
    let rijen = `<row r="1">${tx('A1', 'Meting')}${tx('B1', 't (s)')}${tx('C1', 's (m)')}</row>`;
    st.metingen.forEach((m, i) => { const r = i + 2; rijen += `<row r="${r}">${c('A' + r, i + 1)}${c('B' + r, ms(m.t) / 1000, 2)}${c('C' + r, Math.round(m.s * 100) / 100, 3)}</row>`; });
    const blad = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="3" width="12" customWidth="1"/></cols><sheetData>${rijen}</sheetData></worksheet>`;
    const stijlen = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="0.000"/><numFmt numFmtId="165" formatCode="0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    return zipStore([
      ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
      ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Metingen" sheetId="1" r:id="rId1"/></sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/worksheets/sheet1.xml', blad],
      ['xl/styles.xml', stijlen]
    ]);
  }
  $('xlsx').addEventListener('click', async () => {
    if (!st.metingen.length) return;
    const blob = maakXlsx(), naam = 'positiemetingen.xlsx';
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) { try { await dl.save({ filename: naam, data: blob }); } catch (e) { } return; }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = naam; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  });
  const toets = e => {
    if (!document.body.contains(cv)) return;
    if (e.code === 'Space' && st.loopt && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); meet(); }
  };
  document.addEventListener('keydown', toets);
  $('reset').addEventListener('click', () => { st.loopt = false; st.t = 0; st.metingen = []; tabel(); knoppen(); teken(); });
  const zetV = v => { st.v = Math.min(10, Math.max(1, Math.round((+v || 5) * 2) / 2)); $('vr').value = st.v; $('vn').value = st.v; teken(); };
  $('vr').addEventListener('input', () => zetV($('vr').value));
  $('vn').addEventListener('change', () => zetV($('vn').value));

  zetV(5); tabel(); knoppen();
  const ro = new ResizeObserver(() => teken()); ro.observe(cv);
  window.addEventListener('thema', teken);
  return () => { ro.disconnect(); if (raf) cancelAnimationFrame(raf); document.removeEventListener('keydown', toets); window.removeEventListener('thema', teken); st.loopt = false; };
}

/* ---------- licht / donker ---------- */
(function () {
  const knop = document.getElementById('thema-knop');
  const ZON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const MAAN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const isLicht = () => document.documentElement.dataset.theme === 'light';
  const toonKnop = () => {
    knop.innerHTML = isLicht() ? MAAN + 'Donkere modus' : ZON + 'Lichte modus';
    knop.setAttribute('aria-label', isLicht() ? 'Schakel over naar de donkere modus' : 'Schakel over naar de lichte modus');
  };
  knop.addEventListener('click', () => {
    if (isLicht()) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = 'light';
    try { localStorage.setItem('tools-thema', isLicht() ? 'licht' : 'donker'); } catch (e) { }
    toonKnop();
    window.dispatchEvent(new Event('thema'));
    // tekeningen opnieuw laten tekenen in de nieuwe kleuren
    inhoud.style.marginRight = '1px';
    requestAnimationFrame(() => requestAnimationFrame(() => { inhoud.style.marginRight = ''; window.dispatchEvent(new Event('resize')); }));
  });
  toonKnop();
})();
route();
</script>
